<!DOCTYPE html>
<!-- cc-verify-2026-05-24 -->
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX 每日更新</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #05060f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 400px;
      width: 100%;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4da6ff, #9f7aea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { font-size: 17px; color: #8888aa; margin-bottom: 48px; }
    .date-display { font-size: 18px; font-weight: 600; color: #f0f0f5; margin-bottom: 32px; }
    .btn-trigger {
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      font-family: -apple-system, sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, #4da6ff, #9f7aea);
      color: #fff;
      box-shadow: 0 0 30px rgba(77,166,255,0.3);
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .btn-trigger:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(77,166,255,0.5); }
    .btn-trigger:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status { font-size: 16px; color: #8888aa; min-height: 24px; margin-top: 16px; }
    .status.success { color: #48bb78; }
    .status.error { color: #fc8181; }
    .status.loading { color: #4da6ff; }
    .status.warning { color: #f6ad55; }
    .progress-stage { display: block; font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .retry-btn { margin-top: 10px; padding: 6px 16px; font-size: 12px; background: rgba(77,166,255,0.15); border: 1px solid #4da6ff; color: #4da6ff; border-radius: 4px; cursor: pointer; }
    .retry-btn:hover { background: rgba(77,166,255,0.25); }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(77,166,255,0.3);
      border-top-color: #4da6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .history { margin-top: 40px; text-align: left; }
    .history-title { font-size: 16px; color: #44445a; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .history-item {
      font-size: 16px;
      color: #8888aa;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
    }
    .history-item .success-dot { color: #48bb78; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4da6ff"/><stop offset="100%" stop-color="#9f7aea"/></linearGradient><linearGradient id="lgh" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4da6ff"/><stop offset="100%" stop-color="#9f7aea"/></linearGradient></defs><g transform="translate(20,20)"><polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="rgba(77,166,255,0.08)" stroke="url(#lg)" stroke-width="1.5"/><line x1="-5.5" y1="-5.5" x2="5.5" y2="5.5" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round"/><line x1="5.5" y1="-5.5" x2="-5.5" y2="5.5" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round"/></g><text x="40" y="17" font-family="Inter,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#f0f0f5">PROJECT <tspan fill="url(#lgh)">X</tspan></text><text x="41" y="30" font-family="Inter,sans-serif" font-size="5.5" font-weight="400" letter-spacing="3" fill="#7070a0">INTELLIGENCE</text></svg></div>
    <div class="subtitle">每日情報自動更新系統</div>
    <div class="date-display" id="date-display"></div>
    <button class="btn-trigger" id="trigger-btn" onclick="triggerBrief()">
      🚀 啟動今日 Brief+
    </button>
    <div class="status" id="status"></div>
    <div class="history">
      <div class="history-title">最近更新記錄</div>
      <div id="history-list"></div>
    </div>
  </div>

  <script>
    const API = 'https://projectx-backend-o2pl.onrender.com';

    function getToday() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }

    document.getElementById('date-display').textContent = formatDate(getToday());

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('brief_history') || '[]');
      const list = document.getElementById('history-list');
      if (history.length === 0) {
        list.innerHTML = '<div class="history-item" style="color:#44445a">尚無記錄</div>';
        return;
      }
      list.innerHTML = history.slice(0, 5).map(h => `
        <div class="history-item">
          <span>${h.date}</span>
          <span class="success-dot">✓ ${h.time}</span>
        </div>
      `).join('');
    }

    function saveHistory(date) {
      const history = JSON.parse(localStorage.getItem('brief_history') || '[]');
      const now = new Date();
      const time = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
      history.unshift({ date, time });
      localStorage.setItem('brief_history', JSON.stringify(history.slice(0, 10)));
      loadHistory();
    }

    // 假進度提示（按時間切換訊息，僅 UI 安慰用，不真實追蹤後端步驟）
    const PROGRESS_STAGES = [
      { sec:   0, msg: '正在啟動服務...' },
      { sec:  20, msg: '搜尋市場資料中（CoinGecko、TWSE、Yahoo）...' },
      { sec:  60, msg: '搜尋宏觀新聞、機構研報、法說會...' },
      { sec: 180, msg: '整理資料、產出 JSON...' },
      { sec: 300, msg: '產出 Morning Brief、機會、事件預判...' },
      { sec: 420, msg: '驗證資料品質、寫入 daily.json...' },
      { sec: 540, msg: '即將完成，請稍候...' }
    ];

    function formatElapsed(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
    }

    async function triggerBrief() {
      const btn = document.getElementById('trigger-btn');
      const status = document.getElementById('status');
      const date = getToday();

      btn.disabled = true;
      const startTime = Date.now();

      // 啟動假進度 timer（每秒更新訊息與經過時間）
      function renderProgress() {
        const elapsedMs = Date.now() - startTime;
        const elapsedSec = elapsedMs / 1000;
        let stage = PROGRESS_STAGES[0].msg;
        for (const p of PROGRESS_STAGES) {
          if (elapsedSec >= p.sec) stage = p.msg;
        }
        status.innerHTML = `<span class="spinner"></span>${stage}<span class="progress-stage">已耗時 ${formatElapsed(elapsedMs)}　·　預計總時長 9-10 分鐘</span>`;
      }
      status.className = 'status loading';
      renderProgress();
      const progressTimer = setInterval(renderProgress, 1000);

      try {
        // 用 AbortController 設 15 分鐘 timeout，避免瀏覽器自己斷線
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15 * 60 * 1000);

        const res = await fetch(`${API}/brief`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await res.json();
        clearInterval(progressTimer);

        if (data.success) {
          status.className = 'status success';
          status.innerHTML = `✅ 更新成功（耗時 ${formatElapsed(Date.now() - startTime)}）！網站將於 30 秒內自動更新<span class="progress-stage">commit: ${(data.commit || '').substring(0, 7)}</span>`;
          saveHistory(date);
        } else {
          // 區分「資料品質警告」與「真錯誤」
          const err = data.error || '未知錯誤';
          if (err.includes('data_quality_blocked') || err.includes('quality')) {
            status.className = 'status warning';
            status.innerHTML = `⚠️ 資料品質檢查未通過<span class="progress-stage">原 daily.json 維持不變，未被覆蓋。可再試一次（市場開盤後資料更穩定）</span><button class="retry-btn" onclick="triggerBrief()">🔄 再試一次</button>`;
          } else {
            throw new Error(err);
          }
        }
      } catch (err) {
        clearInterval(progressTimer);
        const elapsed = formatElapsed(Date.now() - startTime);
        if (err.name === 'AbortError') {
          status.className = 'status warning';
          status.innerHTML = `⚠️ 前端等待逾時（15 分鐘，已耗時 ${elapsed}）<span class="progress-stage">後端可能仍在跑，1-2 分鐘後檢查 daily.json 是否更新</span>`;
        } else {
          status.className = 'status error';
          status.innerHTML = `❌ 錯誤：${err.message}<span class="progress-stage">已耗時 ${elapsed}</span><button class="retry-btn" onclick="triggerBrief()">🔄 再試一次</button>`;
        }
      } finally {
        btn.disabled = false;
      }
    }

    loadHistory();
  </script>
</body>
</html>
