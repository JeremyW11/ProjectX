<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX 每日更新</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #05060f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 400px;
      width: 100%;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4da6ff, #9f7aea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { font-size: 17px; color: #8888aa; margin-bottom: 48px; }
    .date-display { font-size: 18px; font-weight: 600; color: #f0f0f5; margin-bottom: 32px; }
    .btn-trigger {
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      font-family: -apple-system, sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, #4da6ff, #9f7aea);
      color: #fff;
      box-shadow: 0 0 30px rgba(77,166,255,0.3);
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .btn-trigger:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(77,166,255,0.5); }
    .btn-trigger:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status { font-size: 16px; color: #8888aa; min-height: 24px; margin-top: 16px; }
    .status.success { color: #48bb78; }
    .status.error { color: #fc8181; }
    .status.loading { color: #4da6ff; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(77,166,255,0.3);
      border-top-color: #4da6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .history { margin-top: 40px; text-align: left; }
    .history-title { font-size: 16px; color: #44445a; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .history-item {
      font-size: 16px;
      color: #8888aa;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
    }
    .history-item .success-dot { color: #48bb78; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">PROJECT X</div>
    <div class="subtitle">每日情報自動更新系統</div>
    <div class="date-display" id="date-display"></div>
    <button class="btn-trigger" id="trigger-btn" onclick="triggerBrief()">
      🚀 啟動今日 Brief+
    </button>
    <div class="status" id="status"></div>
    <div class="history">
      <div class="history-title">最近更新記錄</div>
      <div id="history-list"></div>
    </div>
  </div>

  <script>
    const API = 'https://projectx-backend-o2pl.onrender.com';

    function getToday() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }

    document.getElementById('date-display').textContent = formatDate(getToday());

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('brief_history') || '[]');
      const list = document.getElementById('history-list');
      if (history.length === 0) {
        list.innerHTML = '<div class="history-item" style="color:#44445a">尚無記錄</div>';
        return;
      }
      list.innerHTML = history.slice(0, 5).map(h => `
        <div class="history-item">
          <span>${h.date}</span>
          <span class="success-dot">✓ ${h.time}</span>
        </div>
      `).join('');
    }

    function saveHistory(date) {
      const history = JSON.parse(localStorage.getItem('brief_history') || '[]');
      const now = new Date();
      const time = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
      history.unshift({ date, time });
      localStorage.setItem('brief_history', JSON.stringify(history.slice(0, 10)));
      loadHistory();
    }

    async function triggerBrief() {
      const btn = document.getElementById('trigger-btn');
      const status = document.getElementById('status');
      const date = getToday();

      btn.disabled = true;
      status.className = 'status loading';
      status.innerHTML = '<span class="spinner"></span>正在搜尋整理今日資訊...（約 1-2 分鐘）';

      try {
        const res = await fetch(`${API}/brief`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date })
        });

        const data = await res.json();

        if (data.success) {
          status.className = 'status success';
          status.textContent = '✅ 更新成功！網站將於 30 秒內自動更新';
          saveHistory(date);
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent = `❌ 錯誤：${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    loadHistory();
  </script>
</body>
</html>
