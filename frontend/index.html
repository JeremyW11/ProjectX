<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX — 全球投資情報</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-base: #05060f;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --text-muted: #44445a;
      --accent-blue: #4da6ff;
      --accent-purple: #9f7aea;
      --accent-green: #48bb78;
      --accent-red: #fc8181;
      --accent-orange: #f6ad55;
      --accent-teal: #38b2ac;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(77,99,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 0%, rgba(159,122,234,0.06) 0%, transparent 50%);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,6,15,0.85);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4da6ff, #9f7aea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); padding-bottom: 2px; }
    .nav-right { display: flex; gap: 10px; align-items: center; }

    .btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .btn-glow { background: linear-gradient(135deg, #4da6ff, #9f7aea); color: #fff; box-shadow: 0 0 20px rgba(77,166,255,0.3); }
    .btn-glow:hover { box-shadow: 0 0 30px rgba(77,166,255,0.5); transform: translateY(-1px); }

    main { max-width: 1440px; margin: 0 auto; padding: 28px 40px 60px; }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
    .top-bar h1 { font-size: 20px; font-weight: 600; }
    .top-bar .meta { font-size: 12px; color: var(--text-muted); text-align: right; line-height: 1.8; }

    .live-dot { display: inline-block; width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; margin-right: 5px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .ticker-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 28px; }
    .ticker-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; transition: all 0.2s; }
    .ticker-item:hover { background: var(--bg-card-hover); border-color: rgba(77,166,255,0.2); }
    .t-label { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .t-value { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
    .t-change { font-size: 12px; font-weight: 500; }

    .up { color: var(--accent-green); }
    .down { color: var(--accent-red); }
    .flat { color: var(--text-muted); }

    .content-layout { display: grid; grid-template-columns: 1fr 1fr 320px; gap: 20px; align-items: start; }

    .glass-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); margin-bottom: 16px; }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .card-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .icon { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .icon-blue { background: rgba(77,166,255,0.15); }
    .icon-green { background: rgba(72,187,120,0.15); }
    .icon-purple { background: rgba(159,122,234,0.15); }
    .icon-orange { background: rgba(246,173,85,0.15); }
    .icon-teal { background: rgba(56,178,172,0.15); }

    .card-badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.5px; }
    .badge-free { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.2); }
    .badge-pro { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.2); }

    .news-item { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .news-item:last-child { border-bottom: none; padding-bottom: 0; }
    .news-tag { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; height: fit-content; margin-top: 1px; letter-spacing: 0.5px; }
    .tag-macro { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.15); }
    .tag-industry { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.15); }
    .tag-crypto { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.15); }
    .tag-us { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }
    .tag-tw { background: rgba(56,178,172,0.1); color: var(--accent-teal); border: 1px solid rgba(56,178,172,0.15); }

    .news-body { flex: 1; }
    .news-text { font-size: 13px; color: #c8c8d8; line-height: 1.65; }
    .news-footer { display: flex; justify-content: space-between; margin-top: 4px; }
    .news-time { font-size: 11px; color: var(--text-muted); }
    .news-impact { font-size: 10px; font-weight: 600; color: var(--accent-orange); }

    .industry-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .industry-row:last-child { border-bottom: none; }
    .ind-left { display: flex; align-items: center; gap: 8px; }
    .ind-dot { width: 6px; height: 6px; border-radius: 50%; }
    .ind-name { font-size: 13px; color: var(--text-secondary); }
    .signal-pill { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px; }
    .bull { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.2); }
    .bear { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.2); }
    .watch { background: rgba(246,173,85,0.08); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }
    .neutral { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border); }

    .person-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .person-item:last-child { border-bottom: none; }
    .person-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; background: linear-gradient(135deg, rgba(77,166,255,0.2), rgba(159,122,234,0.2)); border: 1px solid rgba(77,166,255,0.2); color: var(--accent-blue); }
    .person-name { font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .person-title { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
    .person-note { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .pro-card { background: linear-gradient(135deg, rgba(77,99,255,0.12), rgba(159,122,234,0.08)); border: 1px solid rgba(99,130,255,0.25); border-radius: 16px; padding: 24px 20px; text-align: center; position: relative; overflow: hidden; }
    .pro-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--accent-purple); margin-bottom: 10px; text-transform: uppercase; }
    .pro-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; line-height: 1.4; }
    .pro-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 18px; }
    .pro-features { list-style: none; text-align: left; margin-bottom: 20px; }
    .pro-features li { font-size: 12px; color: var(--text-secondary); padding: 4px 0; display: flex; align-items: center; gap: 7px; }
    .pro-features li::before { content: '✦'; font-size: 8px; color: var(--accent-purple); }
    .divider-line { height: 1px; background: var(--border); margin: 20px 0; }
  </style>
</head>
<body>

  <nav>
    <div class="logo">PROJECT X</div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">總覽</a></li>
      <li><a href="pages/market.html">市場</a></li>
      <li><a href="pages/industry.html">產業</a></li>
      <li><a href="pages/targets.html">標的追蹤</a></li>
    </ul>
    <div class="nav-right">
      <button class="btn btn-ghost">登入</button>
      <button class="btn btn-glow">訂閱 Pro</button>
    </div>
  </nav>

  <main>
    <div class="top-bar">
      <div>
        <h1>每日全球投資情報</h1>
        <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">
          <span class="live-dot"></span>即時更新中
        </div>
      </div>
      <div class="meta">
        <span id="date-display"></span><br>UTC+8 台北時間
      </div>
    </div>

    <div id="ticker-strip" class="ticker-strip"></div>

    <div class="content-layout">

      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-blue">🌐</div>宏觀政策觀察</div>
            <span class="card-badge badge-free">FREE</span>
          </div>
          <div id="macro-list"></div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-orange">👤</div>重要人物動向</div>
            <span class="card-badge badge-free">FREE</span>
          </div>
          <div id="persons-list"></div>
        </div>
      </div>

      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-green">🏭</div>全球產業動態</div>
            <span class="card-badge badge-free">FREE</span>
          </div>
          <div id="industry-list"></div>
        </div>
      </div>

      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-purple">📡</div>產業信號雷達</div>
          </div>
          <div id="signals-list"></div>
        </div>

        <div class="divider-line"></div>

        <div class="pro-card">
          <div class="pro-label">PRO PLAN</div>
          <div class="pro-title">客製化<br>每日投資日報</div>
          <div class="pro-desc">依你的關注標的與產業，每日自動篩選整合，直送 Email 與會員頁。</div>
          <ul class="pro-features">
            <li>自選產業 &amp; 標的追蹤</li>
            <li>技術面 + 籌碼面深度分析</li>
            <li>全球前10大公司完整報告</li>
            <li>每日 Email 專屬日報</li>
          </ul>
          <button class="btn btn-glow" style="width:100%; padding:10px;">立即訂閱 Pro</button>
        </div>
      </div>

    </div>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
