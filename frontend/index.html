<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project X · 全球決策情報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7;
  --amber-600:#d97706; --amber-100:#fef3c7;
  --red-600:#dc2626; --red-100:#fee2e2;
  --font-en:'DM Sans',sans-serif;
  --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
  --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;scroll-behavior:smooth;}
body{background:var(--white);color:var(--gray-900);font-family:var(--font-zh);min-height:100vh;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}

/* ── SCROLL REVEAL ── */
.reveal{opacity:0;transform:translateY(28px);transition:opacity 0.6s ease, transform 0.6s ease;}
.reveal.visible{opacity:1;transform:none;}
.reveal-delay-1{transition-delay:0.1s;}
.reveal-delay-2{transition-delay:0.2s;}
.reveal-delay-3{transition-delay:0.3s;}
.reveal-delay-4{transition-delay:0.4s;}
.reveal-delay-5{transition-delay:0.5s;}

/* ── TOPBAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;padding:0 32px;z-index:100;
  transition:box-shadow 0.3s;
}
.topbar.scrolled{box-shadow:0 2px 20px rgba(15,23,42,0.08);}
.topbar-logo{display:flex;align-items:center;gap:10px;flex:1;}
.logo-mark{width:32px;height:32px;background:var(--navy-700);border-radius:8px;display:grid;place-items:center;flex-shrink:0;transition:transform var(--transition);}
.logo-mark:hover{transform:rotate(45deg) scale(1.05);}
.logo-main{font-family:var(--font-en);font-size:13.5px;font-weight:600;color:var(--navy-800);letter-spacing:.05em;}
.logo-sub{font-size:9.5px;color:var(--gray-400);letter-spacing:.08em;font-family:var(--font-en);}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.btn-ghost{padding:7px 16px;border:1px solid var(--gray-300);border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--gray-700);font-family:var(--font-en);transition:all var(--transition);background:var(--white);}
.btn-ghost:hover{border-color:var(--navy-400);color:var(--navy-700);background:var(--navy-50);}
.btn-primary{padding:7px 18px;background:var(--navy-700);color:var(--white);border-radius:var(--r-sm);font-size:13px;font-weight:500;font-family:var(--font-en);transition:all var(--transition);}
.btn-primary:hover{background:var(--navy-600);transform:translateY(-1px);}

/* ── HERO ── */
.hero{padding:130px 32px 80px;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 460px;gap:60px;align-items:center;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--navy-50);border:1px solid var(--navy-100);border-radius:20px;padding:5px 14px;margin-bottom:24px;}
.eyebrow-dot{width:6px;height:6px;background:var(--green-600);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.eyebrow-text{font-size:11.5px;font-weight:500;color:var(--navy-600);font-family:var(--font-en);letter-spacing:.04em;}
.hero-h1{font-family:var(--font-display);font-size:52px;line-height:1.12;color:var(--navy-950);margin-bottom:10px;letter-spacing:-.01em;}
.hero-h1-accent{color:var(--navy-600);font-style:italic;}
.hero-h1-zh{display:block;font-family:var(--font-zh);font-size:20px;font-weight:300;color:var(--gray-500);margin-top:8px;letter-spacing:.04em;font-style:normal;}
.hero-desc{font-size:16px;line-height:1.75;color:var(--gray-500);margin:22px 0 36px;max-width:480px;font-weight:300;}
.hero-cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.btn-hero-primary{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:var(--navy-700);color:var(--white);border-radius:var(--r-md);font-size:15px;font-weight:500;font-family:var(--font-en);transition:all 0.2s;letter-spacing:.01em;}
.btn-hero-primary:hover{background:var(--navy-600);transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,58,138,0.22);}
.btn-hero-primary:active{transform:translateY(0);}
.btn-hero-secondary{display:inline-flex;align-items:center;gap:6px;padding:13px 24px;border:1px solid var(--gray-300);border-radius:var(--r-md);font-size:15px;font-weight:500;color:var(--gray-700);font-family:var(--font-en);transition:all var(--transition);background:var(--white);}
.btn-hero-secondary:hover{border-color:var(--navy-300);color:var(--navy-700);background:var(--navy-50);transform:translateY(-1px);}
.hero-note{margin-top:16px;font-size:12px;color:var(--gray-400);font-family:var(--font-en);display:flex;align-items:center;gap:6px;}
.hero-note-check{color:var(--green-600);}

/* ── HERO CARD ── */
.hero-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-xl);overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06),0 20px 60px rgba(15,23,42,.10),0 40px 80px rgba(30,58,138,.06);position:relative;transition:transform 0.4s ease, box-shadow 0.4s ease;}
.hero-card:hover{transform:translateY(-4px);box-shadow:0 4px 8px rgba(15,23,42,.04),0 28px 70px rgba(15,23,42,.14),0 48px 90px rgba(30,58,138,.09);}
.hero-card-topbar{background:var(--navy-900);padding:12px 16px;display:flex;align-items:center;gap:8px;}
.hc-dot{width:9px;height:9px;border-radius:50%;}
.hc-title{margin-left:auto;font-family:var(--font-en);font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.1em;}
.hero-card-body{padding:20px;}
.hc-date{font-family:var(--font-en);font-size:10px;color:var(--gray-400);letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.hc-live{display:flex;align-items:center;gap:4px;color:var(--green-600);font-size:10px;font-weight:500;}
.hc-live-dot{width:5px;height:5px;background:var(--green-600);border-radius:50%;animation:pulse 2s infinite;}

/* Animated tickers */
.hc-tickers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;}
.hc-ticker{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:8px 10px;transition:all 0.3s;position:relative;overflow:hidden;}
.hc-ticker::after{content:'';position:absolute;inset:0;background:var(--green-100);opacity:0;transition:opacity 0.6s;}
.hc-ticker.tick-up::after{animation:tickFlashGreen 0.8s ease;}
.hc-ticker.tick-down::after{background:var(--red-100);animation:tickFlashGreen 0.8s ease;}
@keyframes tickFlashGreen{0%{opacity:0.5;}100%{opacity:0;}}
.hc-ticker-sym{font-family:var(--font-en);font-size:9.5px;font-weight:600;color:var(--gray-500);letter-spacing:.08em;}
.hc-ticker-val{font-family:var(--font-en);font-size:15px;font-weight:600;color:var(--gray-900);margin:2px 0 1px;letter-spacing:-.01em;transition:color 0.3s;}
.hc-ticker-chg{font-family:var(--font-en);font-size:10px;font-weight:500;transition:color 0.3s;}
.up{color:var(--green-600);}
.down{color:var(--red-600);}

/* Brief preview with filter */
.hc-filter-row{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
.hc-filter-btn{font-size:9.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--gray-200);color:var(--gray-500);font-family:var(--font-en);font-weight:500;transition:all 0.15s;cursor:pointer;background:var(--white);}
.hc-filter-btn:hover{border-color:var(--navy-300);color:var(--navy-600);}
.hc-filter-btn.active{background:var(--navy-700);border-color:var(--navy-700);color:var(--white);}
.hc-brief-label{font-size:10px;font-weight:600;color:var(--gray-400);letter-spacing:.08em;font-family:var(--font-en);margin-bottom:8px;}
.hc-brief-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--gray-100);transition:all 0.25s;}
.hc-brief-item:last-child{border-bottom:none;}
.hc-brief-item.hidden{display:none;}
.hc-brief-badge{font-family:var(--font-en);font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;flex-shrink:0;letter-spacing:.04em;margin-top:1px;}
.badge-m{background:#eff6ff;color:#1d4ed8;}
.badge-c{background:#fef3c7;color:#92400e;}
.badge-t{background:#fdf4ff;color:#7e22ce;}
.badge-u{background:#f0fdf4;color:#166534;}
.hc-brief-text{font-size:11.5px;color:var(--gray-700);line-height:1.45;font-family:var(--font-zh);}
.hc-blur-overlay{position:absolute;bottom:0;left:0;right:0;height:90px;background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,rgba(255,255,255,.97) 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;pointer-events:none;}
.hc-unlock{font-size:11.5px;color:var(--navy-600);font-weight:500;font-family:var(--font-en);display:flex;align-items:center;gap:5px;pointer-events:auto;cursor:pointer;transition:color 0.15s;}
.hc-unlock:hover{color:var(--navy-400);}

/* ── STATS STRIP ── */
.stats-strip{background:var(--gray-50);border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);padding:32px;}
.stats-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
.stat-item{text-align:center;padding:0 20px;border-right:1px solid var(--gray-200);}
.stat-item:last-child{border-right:none;}
.stat-num{font-family:var(--font-en);font-size:32px;font-weight:600;color:var(--navy-800);letter-spacing:-.02em;line-height:1.1;}
.stat-label{font-size:12px;color:var(--gray-500);margin-top:4px;font-family:var(--font-zh);}

/* ── FEATURES ── */
.features{padding:88px 32px;max-width:1200px;margin:0 auto;}
.features-header{text-align:center;margin-bottom:52px;}
.features-eyebrow{font-family:var(--font-en);font-size:11px;font-weight:600;color:var(--navy-500);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;}
.features-h2{font-family:var(--font-display);font-size:36px;color:var(--navy-950);line-height:1.2;margin-bottom:14px;}
.features-desc{font-size:15px;color:var(--gray-500);max-width:480px;margin:0 auto;line-height:1.7;font-weight:300;}
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

/* Interactive feature cards */
.feat-card{
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);
  padding:28px 24px;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  cursor:pointer;position:relative;overflow:hidden;
}
.feat-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--navy-50) 0%,transparent 70%);
  opacity:0;transition:opacity 0.3s;
}
.feat-card:hover{border-color:var(--navy-300);box-shadow:0 12px 40px rgba(30,58,138,.10);transform:translateY(-4px);}
.feat-card:hover::before{opacity:1;}
.feat-card:active{transform:translateY(-2px);}
.feat-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:18px;transition:transform 0.3s;}
.feat-card:hover .feat-icon{transform:scale(1.1) rotate(-3deg);}
.feat-tag{display:inline-block;font-size:10px;font-weight:600;font-family:var(--font-en);padding:2px 8px;border-radius:4px;letter-spacing:.06em;margin-bottom:10px;}
.tag-free{background:var(--green-100);color:var(--green-600);}
.tag-pro{background:var(--navy-50);color:var(--navy-600);}
.feat-title{font-size:15.5px;font-weight:600;color:var(--gray-900);margin-bottom:8px;font-family:var(--font-zh);line-height:1.4;}
.feat-desc{font-size:13px;color:var(--gray-500);line-height:1.65;font-family:var(--font-zh);font-weight:300;}

/* Expand panel inside feat card */
.feat-expand{
  max-height:0;overflow:hidden;transition:max-height 0.4s ease, opacity 0.3s;
  opacity:0;border-top:0px solid var(--gray-100);margin-top:0;padding-top:0;
}
.feat-card.expanded .feat-expand{
  max-height:120px;opacity:1;
  border-top:1px solid var(--gray-100);margin-top:14px;padding-top:12px;
}
.feat-expand-list{list-style:none;display:flex;flex-direction:column;gap:5px;}
.feat-expand-item{font-size:12px;color:var(--gray-600);display:flex;align-items:center;gap:6px;font-family:var(--font-zh);}
.feat-expand-check{color:var(--green-600);font-size:12px;flex-shrink:0;}
.feat-expand-item.pro-item .feat-expand-check{color:var(--navy-500);}
.feat-caret{position:absolute;top:24px;right:20px;font-size:13px;color:var(--gray-400);transition:transform 0.3s;}
.feat-card.expanded .feat-caret{transform:rotate(180deg);color:var(--navy-500);}

/* ── PRICING ── */
.pricing{background:var(--gray-50);border-top:1px solid var(--gray-200);padding:88px 32px;}
.pricing-inner{max-width:820px;margin:0 auto;}
.pricing-header{text-align:center;margin-bottom:36px;}
.pricing-h2{font-family:var(--font-display);font-size:32px;color:var(--navy-950);margin-bottom:10px;}
.pricing-desc{font-size:14px;color:var(--gray-500);font-weight:300;}

/* Billing toggle */
.billing-toggle{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0 40px;}
.billing-label{font-size:13px;color:var(--gray-500);font-family:var(--font-en);font-weight:500;transition:color 0.2s;}
.billing-label.active{color:var(--navy-700);}
.toggle-track{
  width:44px;height:24px;background:var(--gray-300);border-radius:12px;
  position:relative;cursor:pointer;transition:background 0.25s;
}
.toggle-track.on{background:var(--navy-600);}
.toggle-thumb{
  position:absolute;top:3px;left:3px;width:18px;height:18px;
  background:var(--white);border-radius:50%;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.toggle-track.on .toggle-thumb{transform:translateX(20px);}
.billing-save-badge{
  background:var(--green-100);color:var(--green-700);
  font-size:10px;font-weight:600;font-family:var(--font-en);
  padding:2px 8px;border-radius:20px;letter-spacing:.04em;
  transition:all 0.3s;
}
.billing-save-badge.hidden{opacity:0;transform:scale(0.8);}

.pricing-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.pricing-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-xl);padding:32px 28px;transition:all 0.3s;}
.pricing-card:hover{box-shadow:0 8px 32px rgba(15,23,42,.08);}
.pricing-card.featured{border:2px solid var(--navy-700);position:relative;}
.pricing-card.featured:hover{box-shadow:0 8px 40px rgba(30,58,138,.15);}
.pricing-featured-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--navy-700);color:var(--white);font-size:10.5px;font-weight:600;font-family:var(--font-en);padding:4px 14px;border-radius:20px;letter-spacing:.06em;white-space:nowrap;}
.plan-name{font-family:var(--font-en);font-size:12px;font-weight:600;color:var(--gray-500);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.plan-price{display:flex;align-items:baseline;gap:4px;margin-bottom:6px;}
.plan-price-num{font-family:var(--font-en);font-size:40px;font-weight:600;color:var(--navy-950);letter-spacing:-.02em;line-height:1;transition:all 0.3s;}
.plan-price-curr{font-family:var(--font-en);font-size:16px;color:var(--gray-500);margin-bottom:4px;}
.plan-price-period{font-size:13px;color:var(--gray-400);font-family:var(--font-en);}
.plan-tagline{font-size:12.5px;color:var(--gray-500);margin-bottom:24px;font-family:var(--font-zh);line-height:1.5;}
.plan-features{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.plan-feat-item{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--gray-700);font-family:var(--font-zh);line-height:1.45;}
.check-free{color:var(--green-600);}
.check-pro{color:var(--navy-600);}
.check-lock{color:var(--gray-300);}
.btn-plan-free{display:block;width:100%;padding:12px;border:1px solid var(--gray-300);border-radius:var(--r-md);font-size:14px;font-weight:500;color:var(--gray-700);font-family:var(--font-en);text-align:center;transition:all var(--transition);background:var(--white);}
.btn-plan-free:hover{border-color:var(--navy-400);color:var(--navy-700);background:var(--navy-50);}
.btn-plan-pro{display:block;width:100%;padding:12px;border-radius:var(--r-md);font-size:14px;font-weight:500;color:var(--white);font-family:var(--font-en);text-align:center;background:var(--navy-700);transition:all var(--transition);}
.btn-plan-pro:hover{background:var(--navy-600);box-shadow:0 4px 16px rgba(30,58,138,.25);}

/* ── FINAL CTA ── */
.final-cta{background:var(--navy-900);padding:88px 32px;text-align:center;}
.final-cta-inner{max-width:560px;margin:0 auto;}
.final-cta h2{font-family:var(--font-display);font-size:36px;color:var(--white);line-height:1.2;margin-bottom:16px;}
.final-cta h2 em{color:var(--navy-300);}
.final-cta p{font-size:15px;color:rgba(255,255,255,.5);margin-bottom:36px;font-weight:300;line-height:1.7;}
.final-cta-btns{display:flex;align-items:center;justify-content:center;gap:12px;}
.btn-cta-white{padding:13px 28px;background:var(--white);color:var(--navy-800);border-radius:var(--r-md);font-size:14px;font-weight:600;font-family:var(--font-en);transition:all var(--transition);}
.btn-cta-white:hover{background:var(--navy-100);transform:translateY(-2px);}
.btn-cta-outline{padding:13px 28px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);border-radius:var(--r-md);font-size:14px;font-weight:500;font-family:var(--font-en);transition:all var(--transition);}
.btn-cta-outline:hover{border-color:rgba(255,255,255,.5);color:var(--white);transform:translateY(-1px);}

/* ── FOOTER ── */
.footer{background:var(--navy-950);padding:28px 32px;display:flex;align-items:center;justify-content:space-between;}
.footer-logo{font-family:var(--font-en);font-size:12px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.08em;}
.footer-note{font-size:11px;color:rgba(255,255,255,.2);font-family:var(--font-zh);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(7,13,28,.6);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border-radius:var(--r-xl);width:400px;max-width:92vw;box-shadow:0 32px 80px rgba(7,13,28,.3);overflow:hidden;animation:modalIn 0.22s cubic-bezier(0.34,1.56,0.64,1);position:relative;}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(0.95);}to{opacity:1;transform:none;}}
.modal-header{padding:28px 28px 20px;border-bottom:1px solid var(--gray-100);}
.modal-logo{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
.modal-logo-mark{width:28px;height:28px;background:var(--navy-700);border-radius:7px;display:grid;place-items:center;}
.modal-logo-text{font-family:var(--font-en);font-size:13px;font-weight:600;color:var(--navy-800);letter-spacing:.05em;}
.modal-tabs{display:flex;gap:0;background:var(--gray-100);border-radius:8px;padding:3px;}
.modal-tab{flex:1;padding:7px 0;text-align:center;font-size:13px;font-weight:500;color:var(--gray-500);border-radius:6px;font-family:var(--font-en);transition:all 0.2s;cursor:pointer;}
.modal-tab.active{background:var(--white);color:var(--navy-800);box-shadow:0 1px 4px rgba(15,23,42,.08);}
.modal-body{padding:24px 28px 28px;}
.modal-form-group{margin-bottom:14px;}
.modal-label{display:block;font-size:12.5px;font-weight:500;color:var(--gray-700);margin-bottom:6px;font-family:var(--font-en);}
.modal-input{width:100%;padding:10px 13px;border:1px solid var(--gray-300);border-radius:var(--r-sm);font-size:14px;color:var(--gray-900);font-family:var(--font-en);outline:none;transition:all 0.15s;background:var(--white);}
.modal-input:focus{border-color:var(--navy-400);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
.btn-modal-submit{width:100%;padding:12px;background:var(--navy-700);color:var(--white);border-radius:var(--r-md);font-size:14px;font-weight:500;font-family:var(--font-en);margin-top:6px;transition:all var(--transition);}
.btn-modal-submit:hover{background:var(--navy-600);transform:translateY(-1px);}
.modal-divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
.modal-divider-line{flex:1;height:1px;background:var(--gray-200);}
.modal-divider-text{font-size:11.5px;color:var(--gray-400);font-family:var(--font-en);}
.btn-guest{width:100%;padding:11px;border:1px solid var(--gray-300);border-radius:var(--r-md);font-size:13.5px;font-weight:500;color:var(--gray-700);font-family:var(--font-en);background:var(--white);transition:all var(--transition);display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-guest:hover{border-color:var(--navy-300);color:var(--navy-700);background:var(--navy-50);}
.modal-footnote{margin-top:16px;font-size:11px;color:var(--gray-400);text-align:center;font-family:var(--font-zh);line-height:1.6;}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;display:grid;place-items:center;color:var(--gray-400);border-radius:6px;font-size:16px;transition:all 0.15s;}
.modal-close:hover{background:var(--gray-100);color:var(--gray-700);}

/* Input shake animation */
@keyframes shake{0%,100%{transform:none;}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
.shake{animation:shake 0.4s ease;}

/* ── RESPONSIVE ── */
@media(max-width:960px){
  .hero{grid-template-columns:1fr;gap:40px;padding-top:100px;}
  .hero-card{max-width:460px;}
  .hero-h1{font-size:38px;}
  .features-grid{grid-template-columns:1fr 1fr;}
  .stats-inner{grid-template-columns:repeat(2,1fr);}
  .stat-item{padding:16px 20px;border-right:none;border-bottom:1px solid var(--gray-200);}
  .stat-item:nth-child(odd){border-right:1px solid var(--gray-200);}
}
@media(max-width:600px){
  .features-grid{grid-template-columns:1fr;}
  .pricing-cards{grid-template-columns:1fr;}
  .topbar{padding:0 16px;}
  .hero{padding:100px 16px 60px;}
  .hero-h1{font-size:30px;}
  .final-cta-btns{flex-direction:column;}
}

<section class="final-cta">

<footer class="footer">

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <div class="modal-logo">
        <div class="modal-logo-mark">
          <svg width="14" height="14" viewBox="0 0 18 18" fill="none"><path d="M2 9L9 2L16 9L9 16L2 9Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.8" fill="white"/></svg>
        </div>
        <span class="modal-logo-text">PROJECT X</span>
      </div>
      <div class="modal-tabs">
        <div class="modal-tab active" id="tab-login" onclick="switchTab('login')">登入</div>
        <div class="modal-tab" id="tab-signup" onclick="switchTab('signup')">免費註冊</div>
      </div>
    </div>
    <div class="modal-body">
      <div id="form-login">
        <div class="modal-form-group">
          <label class="modal-label">Email</label>
          <input class="modal-input" id="login-email" type="email" placeholder="your@email.com">
        </div>
        <div class="modal-form-group">
          <label class="modal-label">密碼</label>
          <input class="modal-input" id="login-pw" type="password" placeholder="••••••••">
        </div>
        <button class="btn-modal-submit" onclick="submitLogin()">登入</button>
        <div class="modal-divider"><div class="modal-divider-line"></div><span class="modal-divider-text">or</span><div class="modal-divider-line"></div></div>
        <button class="btn-guest" onclick="window.location.href='/brief.html'">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          以訪客身份繼續（免費版）
        </button>
        <p class="modal-footnote">免費版可瀏覽每日宏觀情報與市場數據，無需帳號。</p>
      </div>
      <div id="form-signup" style="display:none">
        <div class="modal-form-group">
          <label class="modal-label">Email</label>
          <input class="modal-input" id="signup-email" type="email" placeholder="your@email.com">
        </div>
        <div class="modal-form-group">
          <label class="modal-label">設定密碼</label>
          <input class="modal-input" id="signup-pw" type="password" placeholder="至少8個字元">
        </div>
        <button class="btn-modal-submit" onclick="submitSignup()">建立帳號 · 免費開始</button>
        <div class="modal-divider"><div class="modal-divider-line"></div><span class="modal-divider-text">or</span><div class="modal-divider-line"></div></div>
        <button class="btn-guest" onclick="window.location.href='/brief.html'">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          先以訪客身份瀏覽
        </button>
        <p class="modal-footnote">建立帳號即表示同意服務條款。Pro 方案提供7天免費試用，試用期結束前可隨時取消。</p>
      </div>
    </div>
  </div>
</div>

<script>
/* ── TOPBAR SCROLL ── */
window.addEventListener('scroll',()=>{
  document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 20);
});

/* ── SCROLL REVEAL ── */
const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');}});
},{threshold:0.12});
document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));

/* ── COUNT UP ANIMATION ── */
function countUp(el, target, suffix=''){
  let start=0;
  const dur=1200;
  const step=16;
  const increment=target/(dur/step);
  const timer=setInterval(()=>{
    start+=increment;
    if(start>=target){start=target;clearInterval(timer);}
    el.textContent=Math.floor(start)+suffix;
  },step);
}
const countObserver = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const el=e.target;
      const to=parseInt(el.dataset.countTo);
      const suf=el.dataset.suffix||'';
      if(!isNaN(to)){countUp(el,to,suf);}
      countObserver.unobserve(el);
    }
  });
},{threshold:0.5});
document.querySelectorAll('[data-count-to]').forEach(el=>countObserver.observe(el));

/* ── LIVE TICKER SIMULATION ── */
const tickers = {
  btc: { base:102840, chgBase:2.31, el:'btc', dir:1 },
  spx: { base:5214,   chgBase:-0.48, el:'spx', dir:-1 },
  twx: { base:21330,  chgBase:0.72, el:'twx', dir:1 }
};

function fmtNum(n){ return n >= 1000 ? n.toLocaleString('en-US',{maximumFractionDigits:0}) : n.toFixed(2); }

function jitterTicker(){
  Object.values(tickers).forEach(t=>{
    const jitter = (Math.random()-0.48)*t.base*0.0004;
    t.base += jitter;
    const chgJitter = (Math.random()-0.48)*0.05;
    t.chgBase += chgJitter;

    const valEl = document.getElementById(t.el+'-val');
    const chgEl = document.getElementById(t.el+'-chg');
    const card  = document.getElementById('ticker-'+t.el);

    valEl.textContent = fmtNum(t.base);
    const up = t.chgBase >= 0;
    chgEl.className = 'hc-ticker-chg '+(up?'up':'down');
    chgEl.textContent = (up?'▲ +':'▼ ')+Math.abs(t.chgBase).toFixed(2)+'%';
    card.classList.remove('tick-up','tick-down');
    void card.offsetWidth;
    card.classList.add(jitter>=0?'tick-up':'tick-down');
  });
}

let tickerInterval;
const heroCard = document.querySelector('.hero-card');
const cardObserver = new IntersectionObserver((entries)=>{
  if(entries[0].isIntersecting){
    tickerInterval = setInterval(jitterTicker, 2800);
  } else {
    clearInterval(tickerInterval);
  }
},{threshold:0.3});
cardObserver.observe(heroCard);

/* ── BRIEF FILTER ── */
document.querySelectorAll('.hc-filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.hc-filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    document.querySelectorAll('.hc-brief-item').forEach(item=>{
      if(filter==='all'||item.dataset.track===filter){
        item.classList.remove('hidden');
      } else {
        item.classList.add('hidden');
      }
    });
  });
});

/* ── FEAT CARD EXPAND ── */
function toggleFeat(card){
  const isOpen = card.classList.contains('expanded');
  document.querySelectorAll('.feat-card').forEach(c=>c.classList.remove('expanded'));
  if(!isOpen) card.classList.add('expanded');
}

/* ── BILLING TOGGLE ── */
let isAnnual = false;
function toggleBilling(){
  isAnnual = !isAnnual;
  const track = document.getElementById('billingToggle');
  const badge = document.getElementById('saveBadge');
  const lm    = document.getElementById('label-monthly');
  const la    = document.getElementById('label-annual');
  const price = document.getElementById('pro-price');
  const period= document.getElementById('pro-period');
  const tagline=document.getElementById('pro-tagline');

  track.classList.toggle('on', isAnnual);
  badge.classList.toggle('hidden', !isAnnual);
  lm.classList.toggle('active', !isAnnual);
  la.classList.toggle('active', isAnnual);

  if(isAnnual){
    price.textContent='86';
    period.textContent='/ 年（USD 7.2/月）';
    tagline.innerHTML='完整情報功能 + 個人化追蹤<br>年付省20%，7天免費試用';
  } else {
    price.textContent='9';
    period.textContent='/ 月';
    tagline.innerHTML='完整情報功能 + 個人化追蹤<br>7天免費試用，隨時取消';
  }
}

/* ── MODAL ── */
function openModal(tab){
  document.getElementById('modalOverlay').classList.add('open');
  switchTab(tab||'login');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}
function closeModalOnBg(e){
  if(e.target===document.getElementById('modalOverlay')) closeModal();
}
function switchTab(tab){
  const isLogin = tab==='login';
  document.getElementById('tab-login').classList.toggle('active',isLogin);
  document.getElementById('tab-signup').classList.toggle('active',!isLogin);
  document.getElementById('form-login').style.display  = isLogin?'block':'none';
  document.getElementById('form-signup').style.display = isLogin?'none':'block';
}

/* form validation with shake */
function validateEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function shakeEl(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

function submitLogin(){
  const email=document.getElementById('login-email');
  const pw=document.getElementById('login-pw');
  let ok=true;
  if(!validateEmail(email.value)){ shakeEl(email); email.focus(); ok=false; }
  if(pw.value.length<6 && ok){ shakeEl(pw); pw.focus(); ok=false; }
  if(ok) window.location.href='/brief.html';
}

function submitSignup(){
  const email=document.getElementById('signup-email');
  const pw=document.getElementById('signup-pw');
  let ok=true;
  if(!validateEmail(email.value)){ shakeEl(email); email.focus(); ok=false; }
  if(pw.value.length<8 && ok){ shakeEl(pw); pw.focus(); ok=false; }
  if(ok) window.location.href='/brief.html';
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
