<style>
/* ============================================================
   VELA · DESIGN SYSTEM v1
   Robinhood/Revolut感 · Light Mode · Navy主色
   ============================================================ */

:root {
  /* Brand Palette */
  --navy-950: #0a0f1e;
  --navy-900: #0f1729;
  --navy-800: #162040;
  --navy-700: #1d2d5a;
  --navy-600: #1e3a8a;
  --navy-500: #2563eb;
  --navy-400: #3b82f6;
  --navy-300: #93c5fd;
  --navy-100: #dbeafe;
  --navy-50:  #eff6ff;

  /* Neutrals */
  --gray-950: #09090b;
  --gray-900: #18181b;
  --gray-800: #27272a;
  --gray-700: #3f3f46;
  --gray-600: #52525b;
  --gray-500: #71717a;
  --gray-400: #a1a1aa;
  --gray-300: #d4d4d8;
  --gray-200: #e4e4e7;
  --gray-100: #f4f4f5;
  --gray-50:  #fafafa;
  --white:    #ffffff;

  /* Semantic */
  --green-600: #16a34a;
  --green-100: #dcfce7;
  --red-600:   #dc2626;
  --red-100:   #fee2e2;
  --amber-600: #d97706;
  --amber-100: #fef3c7;

  /* Surface */
  --bg-page:    #f7f8fc;
  --bg-card:    #ffffff;
  --bg-subtle:  #f1f3f9;
  --bg-hover:   #eef2fb;

  /* Border */
  --border-light: #e8eaf2;
  --border-mid:   #d1d5e8;

  /* Text */
  --text-primary:   #0f172a;
  --text-secondary: #475569;
  --text-muted:     #94a3b8;
  --text-on-navy:   #ffffff;

  /* Typography */
  --font-en: 'DM Sans', sans-serif;
  --font-zh: 'Noto Sans TC', 'DM Sans', sans-serif;
  --font-display: 'DM Serif Display', Georgia, serif;

  /* Spacing */
  --header-h: 56px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  /* Shadow */
  --shadow-card: 0 1px 3px rgba(15,23,42,0.06), 0 4px 16px rgba(15,23,42,0.04);
  --shadow-elevated: 0 4px 24px rgba(15,23,42,0.10);
}

/* ============================================================ RESET */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
/* ── AMBIENT BACKGROUND (mesh gradient, no grid, bulletproof) ── */
body {
  background:
    radial-gradient(1120px 640px at 94% -14%, rgba(37,99,235,.46), transparent 64%),
    radial-gradient(940px 720px at -10% 4%, rgba(51,65,85,.40), transparent 64%),
    radial-gradient(820px 620px at 50% 118%, rgba(29,78,216,.28), transparent 66%),
    linear-gradient(160deg, #dbe2ef 0%, var(--bg-page) 56%);
  background-attachment:fixed;
  color: var(--text-primary);
  font-family: var(--font-zh);
  min-height: 100vh;
  line-height: 1.6;
  position: relative;
}
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
img { display: block; max-width: 100%; }

/* ============================================================ HEADER */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-light);
  z-index: 100;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 0;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: 40px;
  flex-shrink: 0;
}

.logo-mark {
  width: 32px;
  height: 32px;
  background: var(--navy-700);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.logo-mark svg { width: 18px; height: 18px; }

.logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.logo-main {
  font-family: var(--font-en);
  font-size: 14px;
  font-weight: 600;
  color: var(--navy-800);
  letter-spacing: 0.04em;
}

.logo-sub {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  font-family: var(--font-en);
}

.header-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-secondary);
  font-weight: 400;
  transition: all 0.15s;
  white-space: nowrap;
  font-family: var(--font-zh);
}

.nav-item:hover {
  background: var(--bg-hover);
  color: var(--navy-700);
}

.nav-item.active {
  background: var(--navy-50);
  color: var(--navy-600);
  font-weight: 500;
}

.nav-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--navy-400);
  opacity: 0;
  transition: opacity 0.15s;
}

.nav-item.active .nav-dot { opacity: 1; }

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.header-time {
  font-family: var(--font-en);
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

.live-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--green-100);
  color: var(--green-600);
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 20px;
  font-family: var(--font-en);
  letter-spacing: 0.04em;
}

.live-dot {
  width: 5px; height: 5px;
  background: var(--green-600);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.btn-login {
  padding: 7px 16px;
  background: var(--navy-700);
  color: var(--white);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font-en);
  transition: background 0.15s;
  letter-spacing: 0.02em;
}

.btn-login:hover { background: var(--navy-600); }

/* ============================================================ PAGE LAYOUT */
.page-body {
  margin-top: var(--header-h);
  max-width: 1280px;
  margin-left: auto;
  margin-right: auto;
  padding: 28px 24px 60px;
}

/* ============================================================ DATE BANNER */
.date-banner {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 22px;
}

.date-banner-left {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.date-main {
  font-family: var(--font-en);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}

.date-brief-label {
  font-size: 12px;
  color: var(--text-muted);
  font-family: var(--font-zh);
}

.date-gen-time {
  font-family: var(--font-en);
  font-size: 11.5px;
  color: var(--text-muted);
}

/* ============================================================ MARKET BAR */
.market-bar {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}

.mkt-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: box-shadow 0.15s, border-color 0.15s;
  cursor: default;
  box-shadow: var(--shadow-card);
}

.mkt-card:hover {
  border-color: var(--navy-300);
  box-shadow: var(--shadow-elevated);
}

.mkt-card-tag {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.mkt-tag {
  font-family: var(--font-en);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  background: var(--bg-subtle);
  padding: 2px 6px;
  border-radius: 4px;
}

.mkt-category {
  font-size: 9.5px;
  color: var(--text-muted);
  font-family: var(--font-en);
}

.mkt-name {
  font-size: 11px;
  color: var(--text-secondary);
  font-family: var(--font-zh);
  margin-top: 1px;
}

.mkt-price {
  font-family: var(--font-en);
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  line-height: 1.2;
  margin-top: 2px;
}

.mkt-chg {
  font-family: var(--font-en);
  font-size: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 3px;
}

.mkt-chg.up   { color: var(--green-600); }
.mkt-chg.down { color: var(--red-600); }
.mkt-chg.flat { color: var(--text-muted); }

/* ============================================================ MAIN GRID */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
  align-items: start;
}

/* ============================================================ BRIEF FEED */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-zh);
}

.section-title-en {
  font-family: var(--font-en);
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.06em;
}

.section-link {
  font-size: 12px;
  color: var(--navy-500);
  font-family: var(--font-en);
  font-weight: 500;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 3px;
  transition: color 0.15s;
}

.section-link:hover { color: var(--navy-700); }

/* Track side nav */
.brief-flex {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.track-side {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 108px;
  flex-shrink: 0;
  position: sticky;
  top: 76px;
}

.track-tab {
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-light);
  color: var(--text-secondary);
  font-family: var(--font-zh);
  background: var(--white);
  transition: all 0.15s;
  cursor: pointer;
  font-weight: 400;
  text-align: left;
}

@media (max-width: 720px) {
  .brief-flex { flex-direction: column; }
  .track-side { flex-direction: row; flex-wrap: wrap; position: static; width: auto; }
  .track-tab { border-radius: 20px; padding: 5px 12px; }
}

.track-tab:hover {
  border-color: var(--navy-300);
  color: var(--navy-600);
  background: var(--navy-50);
}

.track-tab.active {
  background: var(--navy-700);
  border-color: var(--navy-700);
  color: var(--white);
  font-weight: 500;
}

/* Brief item */
.brief-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brief-item {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  display: flex;
  gap: 14px;
  transition: box-shadow 0.15s, border-color 0.15s;
  cursor: default;
  margin-bottom: 6px;
  box-shadow: var(--shadow-card);
}

.brief-item:hover {
  border-color: var(--navy-200, #bfdbfe);
  box-shadow: var(--shadow-elevated);
}

.brief-item-left {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  flex: 1;
}

.brief-item-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.brief-track-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.06em;
  font-family: var(--font-en);
}

.badge-macro  { background: #eff6ff; color: #1d4ed8; }
.badge-crypto { background: #fef3c7; color: #92400e; }
.badge-us     { background: #f0fdf4; color: #166534; }
.badge-tw     { background: #fdf4ff; color: #7e22ce; }
.badge-commodity { background: #fff7ed; color: #9a3412; }
.badge-industry  { background: #f0f9ff; color: #0c4a6e; }

.brief-time {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-en);
  letter-spacing: 0.02em;
}

.brief-sentiment {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 500;
  font-family: var(--font-en);
}

.sent-bull  { background: var(--green-100); color: var(--green-600); }
.sent-bear  { background: var(--red-100);   color: var(--red-600); }
.sent-neut  { background: var(--amber-100); color: var(--amber-600); }

.brief-headline {
  font-size: 14.5px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.5;
  font-family: var(--font-zh);
}

.brief-body {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.65;
  font-family: var(--font-zh);
}

/* 今日總結分析 */
.synthesis-card {
  position: relative;
  background: linear-gradient(160deg, var(--navy-900) 0%, var(--navy-700) 100%);
  border-radius: 16px;
  padding: 26px 28px 22px;
  margin-bottom: 22px;
  box-shadow: 0 10px 30px -12px rgba(15,23,42,.45);
  overflow: hidden;
}
.synthesis-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
  background: linear-gradient(180deg, #facc15, #f59e0b);
}
.synthesis-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.synthesis-title { font-size: 16px; font-weight: 800; color: #fff; font-family: var(--font-zh); letter-spacing: .01em; }
.synthesis-title .en { display: block; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #facc15; font-family: var(--font-en); margin-top: 3px; }
.synthesis-badge { font-size: 10px; font-weight: 700; color: var(--navy-900); background: #facc15; padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-family: var(--font-en); letter-spacing: .04em; }
.synthesis-chips { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.synthesis-tier { font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: .04em; color: #cbd5e1; background: rgba(148,163,184,.18); border: 1px solid rgba(148,163,184,.32); }
.synthesis-tier.pro { color: var(--navy-900); background: linear-gradient(135deg,#fde68a,#facc15); border-color: transparent; }
.synthesis-upsell { margin-top: 12px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #facc15; background: rgba(250,204,21,.10); border: 1px solid rgba(250,204,21,.30); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-family: var(--font-zh); text-decoration: none; }
.synthesis-upsell:hover { background: rgba(250,204,21,.18); }
.synthesis-body { font-size: 13.5px; line-height: 1.95; color: #dbe4f5; font-family: var(--font-zh); position: relative; }
.synthesis-body p { margin: 0 0 11px; }
.synthesis-body p:last-child { margin-bottom: 0; }
.synthesis-body.clamped { max-height: 168px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); mask-image: linear-gradient(180deg, #000 60%, transparent); }
.synthesis-toggle { margin-top: 12px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #facc15; background: rgba(250,204,21,.10); border: 1px solid rgba(250,204,21,.30); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-family: var(--font-zh); }
.synthesis-toggle:hover { background: rgba(250,204,21,.18); }
@media (max-width: 640px) { .synthesis-card { padding: 20px 18px 18px; } .synthesis-body { font-size: 13px; } }

.brief-tickers {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.ticker-chip {
  font-family: var(--font-en);
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 8px;
  background: var(--bg-subtle);
  color: var(--navy-700);
  border-radius: 4px;
  letter-spacing: 0.04em;
  border: 1px solid var(--border-light);
}

.brief-item-right {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  min-width: 60px;
}

.impact-label {
  font-size: 9px;
  color: var(--text-muted);
  font-family: var(--font-en);
  letter-spacing: 0.06em;
  margin-bottom: 3px;
}

.impact-dots {
  display: flex;
  gap: 3px;
  justify-content: flex-end;
}

.impact-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--navy-400);
}

.impact-dot.empty {
  background: var(--gray-200);
}

/* ============================================================ SIDEBAR */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Risk matrix mini */
.risk-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.risk-card-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.risk-card-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  font-family: var(--font-zh);
}

.risk-label {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 500;
  font-family: var(--font-en);
}

.risk-moderate  { background: var(--amber-100); color: var(--amber-600); }
.risk-high      { background: var(--red-100);   color: var(--red-600); }
.risk-low       { background: var(--green-100);  color: var(--green-600); }

.risk-body { padding: 14px 16px; }

.risk-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid var(--border-light);
}

.risk-row:last-child { border-bottom: none; }

.risk-row-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.risk-indicator {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.risk-row-name {
  font-size: 12.5px;
  color: var(--text-secondary);
  font-family: var(--font-zh);
}

.risk-arrow {
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-en);
}

/* Sidebar small card */
.side-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-card);
}

.side-card-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  font-family: var(--font-zh);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Calendar events */
.cal-item {
  display: flex;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border-light);
}

.cal-item:last-child { border-bottom: none; }

.cal-date {
  flex-shrink: 0;
  width: 34px;
  text-align: center;
  background: var(--bg-subtle);
  border-radius: 6px;
  padding: 4px 0;
}

.cal-date-d {
  font-family: var(--font-en);
  font-size: 14px;

<script>
function updateClock() {
  const now = new Date();
  const tpe = new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  const el = document.getElementById('clock');
  if (el) el.textContent = tpe + ' CST';
}
updateClock(); setInterval(updateClock, 1000);

document.querySelectorAll('.track-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.track-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const filter = tab.getAttribute('data-filter');
    document.querySelectorAll('.brief-item').forEach(item => {
      item.style.display = (filter === 'all' || item.getAttribute('data-type') === filter) ? '' : 'none';
    });
    document.querySelectorAll('.track-divider').forEach(div => {
      const items = [];
      let el = div.nextElementSibling;
      while (el && !el.classList.contains('track-divider')) { items.push(el); el = el.nextElementSibling; }
      div.style.display = items.some(i => i.style.display !== 'none') ? '' : 'none';
    });
    const anyVisible = [...document.querySelectorAll('.brief-item')].some(i => i.style.display !== 'none');
    let empty = document.getElementById('brief-empty');
    if (!anyVisible) {
      if (!empty) {
        empty = document.createElement('div');
        empty.id = 'brief-empty';
        empty.style.cssText = 'padding:24px;text-align:center;color:var(--gray-400);font-family:var(--font-zh);font-size:13px;';
        empty.textContent = '此分類今日暫無消息';
        document.getElementById('brief-list').appendChild(empty);
      }
      empty.style.display = '';
    } else if (empty) empty.style.display = 'none';
  });
});

const badgeMap = {macro:'badge-macro',crypto:'badge-crypto',us:'badge-us',tw:'badge-tw',commodity:'badge-commodity',industry:'badge-industry'};
const badgeLabelMap = {macro:'MACRO',crypto:'CRYPTO',us:'US EQ',tw:'台股',commodity:'大宗',industry:'產業'};
const dividerMap = {macro:'宏觀 · MACRO',crypto:'加密貨幣 · CRYPTO',us:'美股 · US EQUITY',tw:'台股 · TAIWAN',commodity:'大宗原物料 · COMMODITY',industry:'產業 · INDUSTRY'};
const colorMap = {bull:'var(--green-600)',bear:'var(--red-600)',watch:'var(--amber-600)',neutral:'var(--gray-400)'};

function renderImpactDots(score) {
  let h = '';
  for (let i = 1; i <= 5; i++) h += '<span class="impact-dot' + (i > score ? ' empty' : '') + '"></span>';
  return h;
}

function normSentiment(item) {
  const raw = item.sentiment || item.tag_type || '';
  if (raw === 'bull' || raw === '利多' || raw === '看多' || raw === '偏多') return 'bull';
  if (raw === 'bear' || raw === '利空' || raw === '看空' || raw === '偏空') return 'bear';
  return 'neutral';
}

function buildExpand(item) {
  const rows = [];
  if (item.expand_analysis) rows.push('<div class="expand-row"><span class="expand-label">分析</span>' + item.expand_analysis + '</div>');
  if (item.expand_impact_pos) rows.push('<div class="expand-row"><span class="expand-label expand-pos">利多</span>' + item.expand_impact_pos + '</div>');
  if (item.expand_impact_neg) rows.push('<div class="expand-row"><span class="expand-label expand-neg">利空</span>' + item.expand_impact_neg + '</div>');
  if (item.expand_tickers) rows.push('<div class="expand-row"><span class="expand-label">相關標的</span>' + item.expand_tickers + '</div>');
  if (item.expand_action) rows.push('<div class="expand-row"><span class="expand-label">操作</span>' + item.expand_action + '</div>');
  if (item.expand_watch) rows.push('<div class="expand-row"><span class="expand-label">觀察</span>' + item.expand_watch + '</div>');
  return rows.join('');
}

function renderBriefList(items) {
  if (!items || !items.length) return '<div style="padding:20px;text-align:center;color:var(--gray-400);">暫無數據</div>';
  let html = '', lastType = '';
  items.forEach(item => {
    const type = item.type || 'macro';
    if (type !== lastType) { html += '<div class="track-divider">' + (dividerMap[type] || type) + '</div>'; lastType = type; }
    const tickers = (item.tickers || []).map(t => '<span class="ticker-chip">' + t + '</span>').join('');
    const sentiment = normSentiment(item);
    const sentLabel = sentiment === 'bull' ? '利多' : sentiment === 'bear' ? '利空' : '中性';
    const sentClass = sentiment === 'bull' ? 'sent-bull' : sentiment === 'bear' ? 'sent-bear' : 'sent-neut';
    const score = item.impact_score || 3;
    const badgeLabel = badgeLabelMap[type] || type;
    const subTag = (item.tag && item.tag !== badgeLabel) ? '<span class="brief-subtag">· ' + item.tag + '</span>' : '';
    const source = item.source ? '<span class="brief-source">· ' + item.source + '</span>' : '';
    const expandHtml = buildExpand(item);
    const hasExpand = !!expandHtml;
    html += '<div class="brief-item' + (hasExpand ? ' has-expand' : '') + '" data-type="' + type + '">' +
      '<div class="brief-item-left">' +
        '<div class="brief-item-meta">' +
          '<span class="brief-track-badge ' + (badgeMap[type] || 'badge-macro') + '">' + badgeLabel + '</span>' +
          subTag +
          '<span class="brief-time">' + (item.time || '') + '</span>' +
          '<span class="brief-sentiment ' + sentClass + '">' + sentLabel + '</span>' +
          source +
        '</div>' +
        '<div class="brief-headline">' + (item.text || item.headline || '') + (hasExpand ? '<span class="brief-caret">▼</span>' : '') + '</div>' +
        '<div class="brief-body">' + (item.body || item.detail || item.impact || '') + '</div>' +
        (tickers ? '<div class="brief-tickers">' + tickers + '</div>' : '') +
        (hasExpand ? '<div class="brief-expand">' + expandHtml + '</div>' : '') +
      '</div>' +
      '<div class="brief-item-right"><div>' +
        '<div class="impact-label">IMPACT</div>' +
        '<div class="impact-dots">' + renderImpactDots(score) + '</div>' +
      '</div></div>' +
    '</div>';
  });
  return html;
}

function renderMarketBar(tickers) {
  if (!tickers) return '';
  const labelMap = {
    'S&P 500':{tag:'SPX',cat:'US Equity',name:'標普500',yahoo:'^GSPC'},
    'NASDAQ':{tag:'NDX',cat:'US Equity',name:'納斯達克',yahoo:'^IXIC'},
    '台股加權':{tag:'TWX',cat:'台股',name:'加權指數',yahoo:'^TWII'},
    'BTC / USD':{tag:'BTC',cat:'Crypto',name:'比特幣',binance:'BTCUSDT'},
    'ETH / USD':{tag:'ETH',cat:'Crypto',name:'以太坊',binance:'ETHUSDT'},
    'VIX':{tag:'VIX',cat:'Volatility',name:'恐慌指數',yahoo:'^VIX'},
    'Brent 原油':{tag:'BRENT',cat:'Commodity',name:'布蘭特原油',yahoo:'BZ=F'},
  };
  return tickers.map(t => {
    const info = labelMap[t.label] || {tag:t.label,cat:'',name:t.label};
    const dc = t.dir==='up'?'up':t.dir==='down'?'down':'flat';
    const di = t.dir==='up'?'▲':t.dir==='down'?'▼':'―';
    const bAttr = info.binance ? ' data-binance="'+info.binance+'"' : '';
    const yAttr = info.yahoo   ? ' data-yahoo="'+info.yahoo+'"'     : '';
    return '<div class="mkt-card"'+bAttr+yAttr+'><div class="mkt-card-tag"><span class="mkt-tag">'+info.tag+'</span><span class="mkt-category">'+info.cat+'</span></div><div class="mkt-name">'+info.name+'</div><div class="mkt-price">'+t.value+'</div><div class="mkt-chg '+dc+'">'+di+' '+t.change+'</div></div>';
  }).join('');
}

function renderRiskMatrix(signals) {
  if (!signals) return '';
  const arrowMap = {bull:'↑',bear:'↓',watch:'→',neutral:'→'};
  return signals.map(s => '<div class="risk-row"><div class="risk-row-left"><div class="risk-indicator" style="background:'+( colorMap[s.signal]||'var(--gray-400)')+'"></div><span class="risk-row-name">'+s.name+'</span></div><span class="risk-arrow" style="color:'+(colorMap[s.signal]||'var(--gray-400)')+'">'+( arrowMap[s.signal]||'→')+' '+s.label+'</span></div>').join('');
}

function renderCalendar(calendar) {
  if (!calendar || !calendar.events) return '';
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return calendar.events.slice(0,5).map(e => {
    const d = new Date(e.date || e.start_date || '2026-05-12');
    const isEcon = (e.type==='data'||e.type==='econ'||e.type==='fed') && (e.prev||e.expect);
    function extractNum(v){ if(!v) return '—'; const m=v.match(/[+\-]?\d[\d,]*\.?\d*\s*%?(?:\s*[-–~]\s*[+\-]?\d[\d,]*\.?\d*\s*%?)?(?:\s*(?:K|M|B|bps|bp))?/); return (m&&m[0].trim())?m[0].trim():'—'; }
    const dataRow = isEcon
      ? '<div class="ec-data-row">'
        +'<div class="ec-data-cell"><span class="ec-data-label">前期</span><span class="ec-data-val">'+extractNum(e.prev)+'</span></div>'
        +'<div class="ec-data-cell"><span class="ec-data-label">預期</span><span class="ec-data-val">'+extractNum(e.expect)+'</span></div>'
        +'<div class="ec-data-cell'+(e.actual?' ec-data-actual':'')+'"><span class="ec-data-label">公布值</span><span class="ec-data-val '+(e.actual?'ec-data-published':'ec-data-pending')+'">'+(e.actual?extractNum(e.actual):'—')+'</span></div>'
        +'</div>'
      : '';
    return '<div class="cal-item"><div class="cal-date"><div class="cal-date-d">'+d.getDate()+'</div><div class="cal-date-m">'+months[d.getMonth()]+'</div></div><div class="cal-info"><div class="cal-event-type">'+(e.market||'')+' · '+(e.type_label||e.type||'')+'</div><div class="cal-event-name">'+(e.title||e.name||'')+'</div>'+dataRow+'</div></div>';
  }).join('');
}

function renderPersons(persons) {
  if (!Array.isArray(persons) || !persons.length) return '';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  return persons.map(function(p){
    return '<div class="person-item"><div class="person-avatar">'+esc(p.initials||(p.name||'?').slice(0,2))+'</div>'
      + '<div class="person-info"><div class="person-name">'+esc(p.name)+'</div>'
      + '<div class="person-title">'+esc(p.title)+'</div>'
      + '<div class="person-note">'+esc(p.note)+'</div>'
      + (p.expand_watch?'<div class="person-watch">關注：'+esc(p.expand_watch)+'</div>':'')
      + '</div></div>';
  }).join('');
}

var _synthText='', _synthDate='', _synthPro=false;
var SYNTH_FREE_CHARS=130;
function renderSynthesis(text, dateStr, isPro){
  var card=document.getElementById('synthesis-card');
  var body=document.getElementById('synthesis-body');
  var toggle=document.getElementById('synthesis-toggle');
  var upsell=document.getElementById('synthesis-upsell');
  var tier=document.getElementById('synthesis-tier');
  if(!card||!body) return;
  if(typeof text==='string'){ _synthText=text.trim(); _synthDate=dateStr||''; }
  if(typeof isPro==='boolean') _synthPro=isPro;
  var t=_synthText;
  if(!t){ card.style.display='none'; return; }
  var paras=t.split(/\n{1,}/).map(function(s){return s.trim();}).filter(Boolean);
  var dEl=document.getElementById('synthesis-date');
  if(dEl&&_synthDate) dEl.textContent=_synthDate;
  card.style.display='block';
  if(_synthPro){
    // Pro：完整版，可展開／收合
    body.innerHTML=paras.map(function(p){
      var d=document.createElement('p'); d.textContent=p; return d.outerHTML;
    }).join('');
    if(tier){ tier.textContent='PRO · 完整版'; tier.classList.add('pro'); }
    if(upsell) upsell.style.display='none';
    requestAnimationFrame(function(){
      if(body.scrollHeight>180){ body.classList.add('clamped'); toggle.style.display='inline-flex'; toggle.textContent='展開全文 ▾'; }
      else { body.classList.remove('clamped'); toggle.style.display='none'; }
    });
  } else {
    // 免費／未登入：精簡版，僅首段截斷，導引升級 Pro
    var first=paras[0]||'';
    var short=first.length>SYNTH_FREE_CHARS ? first.slice(0,SYNTH_FREE_CHARS).trim()+'…' : first;
    var d=document.createElement('p'); d.textContent=short;
    body.innerHTML=d.outerHTML;
    body.classList.remove('clamped');
    if(tier){ tier.textContent='精簡版'; tier.classList.remove('pro'); }
    if(toggle) toggle.style.display='none';
    if(upsell) upsell.style.display='inline-flex';
  }
}
function toggleSynthesis(){
  var body=document.getElementById('synthesis-body');
  var toggle=document.getElementById('synthesis-toggle');
  if(!body||!_synthPro) return;
  var clamped=body.classList.toggle('clamped');
  toggle.textContent=clamped?'展開全文 ▾':'收合 ▴';
}

function checkDataStaleness(dateStr){var today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date());if(dateStr&&dateStr!==today){var b=document.getElementById('stale-banner');if(b){b.style.display='flex';b.querySelector('.stale-date').textContent=dateStr;}}}

async function loadData() {
  try {
    const res = await fetch('/data/daily.json?v='+Math.floor(Date.now()/300000));
    const data = await res.json();
    checkDataStaleness(data.date);

    const d = new Date(data.date);
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const dateEl = document.getElementById('date-main-display');
    if (dateEl) dateEl.textContent = days[d.getDay()]+' · '+months[d.getMonth()]+' '+d.getDate()+' · '+d.getFullYear();
    const timeEl = document.getElementById('date-gen-time');
    if (timeEl) timeEl.textContent = '更新於 '+(data.generated_at||data.date);
    const mktEl = document.getElementById('market-bar');
    if (mktEl) mktEl.innerHTML = renderMarketBar(data.tickers);
    renderSynthesis(data.morning_brief, data.date);
    const mk = data.market || {};
    const sortDesc = arr => arr.slice().sort((a,b) => (b.time||b.date||'').localeCompare(a.time||a.date||''));
    const allItems = [
      ...sortDesc(data.macro||[]).map(i=>({...i,type:'macro'})),
      ...sortDesc(mk.us_news||[]).map(i=>({...i,type:'us'})),
      ...sortDesc(mk.tw_news||[]).map(i=>({...i,type:'tw'})),
      ...sortDesc(data.industry||[]).map(i=>({...i,type:'industry'})),
      ...sortDesc(mk.crypto_news||[]).map(i=>({...i,type:'crypto'})),
      ...sortDesc(mk.commodity_news||[]).map(i=>({...i,type:'commodity'})),
    ];
    const briefEl = document.getElementById('brief-list');
    if (briefEl) briefEl.innerHTML = renderBriefList(allItems);
    const riskEl = document.getElementById('risk-body');
    if (riskEl) riskEl.innerHTML = renderRiskMatrix(data.signals);
    const calEl = document.getElementById('cal-list');
    if (calEl && data.calendar) calEl.innerHTML = renderCalendar(data.calendar);
    const personsHtml = renderPersons(data.persons);
    const personsCard = document.getElementById('persons-card');
    const personsEl = document.getElementById('persons-list');
    if (personsEl && personsCard) {
      if (personsHtml) { personsEl.innerHTML = personsHtml; personsCard.style.display = 'block'; }
      else personsCard.style.display = 'none';
    }
  } catch(e) { console.error('loadData error:', e); if(window.PX_showDataError)window.PX_showDataError(); }
}

document.getElementById('brief-list').addEventListener('click', function(e){
  const item = e.target.closest('.brief-item.has-expand');
  if (item) item.classList.toggle('open');
});

loadData();
</script>

// ── 即時指數報價（後端 /live-market 代理 TWSE + Yahoo，30s 輪詢）──
(function(){
  var BASE='https://projectx-backend-o2pl.onrender.com';
  var PFX={'BZ=F':'$'};
  function fmtVal(n){
    if(n>=100) return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    return Number(n).toFixed(2);
  }
  async function tick(){
    var cards=document.querySelectorAll('[data-yahoo]');
    if(!cards.length) return;
    try{
      var r=await fetch(BASE+'/live-market',{cache:'no-store'});
      if(!r.ok) throw new Error('live-market '+r.status);
      var data=await r.json();
      cards.forEach(function(card){
        var sym=card.dataset.yahoo;
        var q=data[sym]; if(!q) return;
        var dc=q.dir==='up'?'up':q.dir==='down'?'down':'flat';
        var di=q.dir==='up'?'▲':q.dir==='down'?'▼':'―';
        var priceEl=card.querySelector('.mkt-price');
        var chgEl=card.querySelector('.mkt-chg');
        if(priceEl) priceEl.textContent=(PFX[sym]||'')+fmtVal(q.price);
        if(chgEl){chgEl.textContent=di+' '+Math.abs(q.change).toFixed(2)+'%';chgEl.className='mkt-chg '+dc;}
        var catEl=card.querySelector('.mkt-category');
        if(catEl&&!catEl.querySelector('.live-dot')) catEl.innerHTML='<span class="live-dot"></span>即時';
      });
    }catch(e){console.warn('live market skip:',e.message);}
  }
  var timer=null;
  function start(){tick();clearInterval(timer);timer=setInterval(function(){if(!document.hidden)tick();},30000);}
  var wait=setInterval(function(){if(document.querySelector('[data-yahoo]')){clearInterval(wait);start();}},300);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
})();

// ── 即時加密報價（Binance 公開 API，30s 輪詢，分頁隱藏時暫停）──
(function(){
  function fmtPrice(n){var dp=n>=10000?0:2;return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});}
  async function tick(){
    var cards=document.querySelectorAll('[data-binance]');
    if(!cards.length) return;
    try{
      var syms=Array.from(cards).map(function(c){return c.dataset.binance;});
      var url='https://api.binance.com/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(syms));
      var r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error('binance '+r.status);
      var arr=await r.json();
      arr.forEach(function(o){
        var card=document.querySelector('[data-binance="'+o.symbol+'"]');
        if(!card) return;
        var p=parseFloat(o.lastPrice),chg=parseFloat(o.priceChangePercent);
        var dc=chg>0?'up':chg<0?'down':'flat';
        var di=chg>0?'▲':chg<0?'▼':'―';
        var priceEl=card.querySelector('.mkt-price');
        var chgEl=card.querySelector('.mkt-chg');
        if(priceEl) priceEl.textContent=fmtPrice(p);
        if(chgEl){chgEl.textContent=di+' '+Math.abs(chg).toFixed(2)+'%';chgEl.className='mkt-chg '+dc;}
        var catEl=card.querySelector('.mkt-category');
        if(catEl&&!catEl.querySelector('.live-dot')) catEl.innerHTML='<span class="live-dot"></span>即時';
      });
    }catch(e){console.warn('live crypto skip:',e.message);}
  }
  var timer=null;
  function start(){tick();clearInterval(timer);timer=setInterval(function(){if(!document.hidden)tick();},30000);}
  var wait=setInterval(function(){if(document.querySelector('[data-binance]')){clearInterval(wait);start();}},300);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
})();
</script>
