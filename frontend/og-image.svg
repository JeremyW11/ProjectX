<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1630"/>
      <stop offset="100%" style="stop-color:#1a2d5a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a30a"/>
      <stop offset="100%" style="stop-color:#f0c840"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a30a;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#d4a30a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d4a30a;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e3366" stroke-width="1" opacity="0.35">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Gold accent bar top / bottom -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>
  <rect x="0" y="626" width="1200" height="4" fill="url(#gold)"/>

  <!-- ===== Centered logo mark (matches site favicon / topbar) ===== -->
  <!-- 40-unit mark scaled x4 = 160px, centered at x=600, top y=120 -->
  <g transform="translate(520, 120) scale(4)">
    <rect x="-6" y="-6" width="52" height="52" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity="0.4"/>
    <rect x="0" y="0" width="40" height="40" rx="9" ry="9" fill="#07090f"/>
    <line x1="10" y1="10" x2="30" y2="30" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="10" x2="10" y2="30" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="3" fill="#2563eb"/>
    <circle cx="20" cy="20" r="1.5" fill="#93c5fd"/>
  </g>

  <!-- ===== Centered wordmark ===== -->
  <text x="600" y="400" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="84" font-weight="900" letter-spacing="-1">
    <tspan fill="white">PROJECT </tspan><tspan fill="url(#gold)">X</tspan>
  </text>

  <!-- Divider line (centered) -->
  <rect x="380" y="425" width="440" height="2" fill="url(#line1)" rx="1"/>

  <!-- Tagline -->
  <text x="600" y="470" text-anchor="middle"
    font-family="'DM Sans', Arial, sans-serif"
    font-size="27" font-weight="400"
    fill="#94a3b8" letter-spacing="0.14em">DAILY MARKET INTELLIGENCE</text>

  <!-- Powered by PulseAI badge -->
  <g transform="translate(600, 516)">
    <rect x="-150" y="-22" width="300" height="44" rx="22" fill="#0e2748" stroke="#2a4a8a" stroke-width="1.2"/>
    <text x="0" y="6" text-anchor="middle"
      font-family="'DM Sans', Arial, sans-serif"
      font-size="19" font-weight="700" letter-spacing="0.1em"
      fill="#7dd3fc"><tspan fill="url(#gold)">POWERED BY </tspan><tspan fill="#7dd3fc">PULSEAI</tspan></text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="578" text-anchor="middle"
    font-family="'DM Sans', Arial, sans-serif"
    font-size="21" font-weight="400"
    fill="#5b7099" letter-spacing="0.06em">projectxbrief.netlify.app</text>
</svg>
