<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- flat ink background (no gradient, per Vela identity) -->
  <rect width="1200" height="630" fill="#0B1F4D"/>

  <!-- subtle construction grid -->
  <g stroke="#147EFF" stroke-width="1" opacity="0.08">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#147EFF"/>

  <!-- logo lockup: reversed V-mark + vela wordmark, centered -->
  <g transform="translate(452, 92) scale(2.0)">
    <path d="M 9 13 L 24 44 L 31.5 28.5" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="33" y="17" width="7" height="7" rx="1.2" fill="#147EFF"/>
    <rect x="36" y="11.5" width="6" height="6" rx="1" fill="#39D5FF"/>
    <rect x="39" y="6.5" width="5" height="5" rx="0.9" fill="#39D5FF"/>
  </g>
  <text x="556" y="186" font-family="'Poppins','DM Sans',Arial,sans-serif" font-size="86" font-weight="600" letter-spacing="-3" fill="#ffffff">vela</text>

  <!-- slogan (hero) -->
  <text x="600" y="372" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="94" font-weight="700" letter-spacing="3" fill="#ffffff">把雜訊，變成判斷</text>

  <!-- english sub -->
  <text x="600" y="440" text-anchor="middle" font-family="'DM Sans',Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="0.34em" fill="#39D5FF">FROM NOISE TO SIGNAL</text>

  <!-- divider -->
  <rect x="500" y="480" width="200" height="2" rx="1" fill="#147EFF" opacity="0.55"/>

  <!-- powered by OrionAI -->
  <text x="600" y="530" text-anchor="middle" font-family="'DM Sans',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="0.08em"><tspan fill="#7e93c4">POWERED BY </tspan><tspan fill="#ffffff">ORION</tspan><tspan fill="#39D5FF">AI</tspan></text>

  <!-- url -->
  <text x="600" y="584" text-anchor="middle" font-family="'DM Sans',Arial,sans-serif" font-size="21" font-weight="400" letter-spacing="0.06em" fill="#5b74a8">projectxbrief.netlify.app</text>
</svg>
