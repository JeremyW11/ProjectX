<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX — 產業追蹤</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-base: #05060f;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --text-muted: #44445a;
      --accent-blue: #4da6ff;
      --accent-purple: #9f7aea;
      --accent-green: #48bb78;
      --accent-red: #fc8181;
      --accent-orange: #f6ad55;
      --accent-teal: #38b2ac;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(77,99,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 0%, rgba(159,122,234,0.06) 0%, transparent 50%);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,6,15,0.85);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4da6ff, #9f7aea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); padding-bottom: 2px; }
    .nav-right { display: flex; gap: 10px; align-items: center; }

    .btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .btn-glow { background: linear-gradient(135deg, #4da6ff, #9f7aea); color: #fff; box-shadow: 0 0 20px rgba(77,166,255,0.3); }
    .btn-glow:hover { box-shadow: 0 0 30px rgba(77,166,255,0.5); transform: translateY(-1px); }

    main { max-width: 1440px; margin: 0 auto; padding: 28px 40px 60px; }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
    .top-bar h1 { font-size: 20px; font-weight: 600; }
    .top-bar .meta { font-size: 12px; color: var(--text-muted); text-align: right; line-height: 1.8; }

    /* 產業雷達總覽 */
    .radar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .radar-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .radar-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-2px);
    }

    .radar-card.selected {
      border-color: var(--accent-blue);
      background: rgba(77,166,255,0.06);
    }

    .radar-icon { font-size: 18px; margin-bottom: 6px; }
    .radar-name { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .radar-signal {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      display: inline-block;
    }

    .bull { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.2); }
    .bear { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.2); }
    .watch { background: rgba(246,173,85,0.08); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }
    .neutral { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border); }

    /* 主內容兩欄 */
    .content-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .icon { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .icon-blue { background: rgba(77,166,255,0.15); }
    .icon-green { background: rgba(72,187,120,0.15); }
    .icon-purple { background: rgba(159,122,234,0.15); }
    .icon-orange { background: rgba(246,173,85,0.15); }
    .icon-teal { background: rgba(56,178,172,0.15); }

    .card-badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.5px; }
    .badge-free { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.2); }
    .badge-pro { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.2); }

    /* 產業新聞 */
    .news-item {
      display: flex;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .news-item:last-child { border-bottom: none; padding-bottom: 0; }

    .news-tag { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; height: fit-content; margin-top: 1px; letter-spacing: 0.5px; }
    .tag-semi { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.15); }
    .tag-ai { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.15); }
    .tag-energy { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }
    .tag-finance { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.15); }
    .tag-shipping { background: rgba(56,178,172,0.1); color: var(--accent-teal); border: 1px solid rgba(56,178,172,0.15); }
    .tag-ev { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.15); }

    .news-body { flex: 1; }
    .news-text { font-size: 13px; color: #c8c8d8; line-height: 1.65; }
    .news-footer { display: flex; justify-content: space-between; margin-top: 4px; }
    .news-time { font-size: 11px; color: var(--text-muted); }
    .news-impact { font-size: 10px; font-weight: 600; color: var(--accent-orange); }

    /* 前十大公司 */
    .company-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .company-item:last-child { border-bottom: none; }

    .company-rank {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 20px;
      margin-top: 2px;
    }

    .company-info { flex: 1; }
    .company-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .company-name { font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .company-ticker { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .company-note { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .event-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    .event-earnings { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.15); }
    .event-ma { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.15); }
    .event-expand { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.15); }
    .event-watch { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }

    /* 側欄：股務事件 */
    .event-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .event-item:last-child { border-bottom: none; }
    .event-date { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .event-title { font-size: 13px; color: var(--text-primary); font-weight: 600; margin-bottom: 3px; }
    .event-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .up { color: var(--accent-green); }
    .down { color: var(--accent-red); }
  </style>
</head>
<body>

  <nav>
    <div class="logo">PROJECT X</div>
    <ul class="nav-links">
      <li><a href="/index.html">總覽</a></li>
      <li><a href="/pages/market.html">市場</a></li>
      <li><a href="/pages/industry.html" class="active">產業</a></li>
      <li><a href="/pages/institutional.html">機構報告</a></li><li><a href="/pages/calendar.html">市場日曆</a></li><li><a href="/pages/targets.html">標的追蹤</a></li>
    </ul>
    <div class="nav-right">
      <button class="btn btn-ghost">登入</button>
      <button class="btn btn-glow">訂閱 Pro</button>
    </div>
  </nav>

  <main>
    <div class="top-bar">
      <div>
        <h1>全球產業追蹤</h1>
        <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">
          產業面分析 + 全球前十大公司動向
        </div>
      </div>
      <div class="meta" id="industry-date"></div>
    </div>

    <!-- 產業雷達總覽 -->
    <div id="radar-grid" class="radar-grid"></div>

    <!-- 主內容 -->
    <div class="content-layout">

      <!-- 左：產業新聞 + 前十大公司 -->
      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-green">📰</div>產業重大事件</div>
            <span class="card-badge badge-free">FREE</span>
          </div>
          <div id="industry-news"></div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-blue">🏆</div>全球前十大公司動向</div>
            <span class="card-badge badge-free">FREE</span>
          </div>
          <div id="top-companies"></div>
        </div>
      </div>

      <!-- 右：股務事件 + 洞察 -->
      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-orange">📅</div>近期股務事件</div>
          </div>
          <div id="corp-events"></div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-purple">🔍</div>產業輪動洞察</div>
            <span class="card-badge badge-free">FREE</span>
          </div>
          <div id="rotation-insight"></div>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function loadIndustryData() {
      const res = await fetch('../data/daily.json');
      const data = await res.json();

      const d = new Date(data.date);
      document.getElementById('industry-date').innerHTML =
        d.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) +
        '<br>UTC+8 台北時間';

      // 產業雷達
      if (data.signals) {
        const icons = {
          '半導體 / AI': '💻', '加密貨幣': '🔮', '雲端 / 資料中心': '☁️',
          '金融': '🏦', '航運': '🚢', '能源': '⚡', '消費': '🛒'
        };
        document.getElementById('radar-grid').innerHTML = data.signals.map(s => `
          <div class="radar-card" onclick="filterByIndustry('${s.name}')">
            <div class="radar-icon">${icons[s.name] || '📊'}</div>
            <div class="radar-name">${s.name}</div>
            <span class="radar-signal ${s.signal}">${s.label}</span>
          </div>
        `).join('');
      }

      // 產業新聞
      if (data.industry_detail?.news) {
        document.getElementById('industry-news').innerHTML = data.industry_detail.news.map(item => `
          <div class="news-item">
            <span class="news-tag tag-${item.type}">${item.tag}</span>
            <div class="news-body">
              <div class="news-text">${item.text}</div>
              <div class="news-footer">
                <span class="news-time">${item.time}</span>
                <span class="news-impact">${item.impact}</span>
              </div>
            </div>
          </div>
        `).join('');
      }

      // 前十大公司
      if (data.industry_detail?.top_companies) {
        document.getElementById('top-companies').innerHTML = data.industry_detail.top_companies.map((c, i) => `
          <div class="company-item">
            <div class="company-rank">#${i + 1}</div>
            <div class="company-info">
              <div class="company-header">
                <div>
                  <div class="company-name">${c.name}</div>
                  <div class="company-ticker">${c.ticker} · ${c.industry}</div>
                </div>
                <span class="event-tag event-${c.event_type}">${c.event_label}</span>
              </div>
              <div class="company-note">${c.note}</div>
            </div>
          </div>
        `).join('');
      }

      // 股務事件
      if (data.industry_detail?.corp_events) {
        document.getElementById('corp-events').innerHTML = data.industry_detail.corp_events.map(e => `
          <div class="event-item">
            <div class="event-date">${e.date}</div>
            <div class="event-title">${e.title}</div>
            <div class="event-desc">${e.desc}</div>
          </div>
        `).join('');
      }

      // 輪動洞察
      if (data.industry_detail?.rotation) {
        document.getElementById('rotation-insight').innerHTML = data.industry_detail.rotation.map(r => `
          <div style="padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
              <span style="font-size:13px; font-weight:600; color:var(--text-primary);">${r.from} → ${r.to}</span>
              <span style="font-size:10px; color:var(--accent-orange);">${r.strength}</span>
            </div>
            <div style="font-size:12px; color:var(--text-secondary); line-height:1.5;">${r.reason}</div>
          </div>
        `).join('');
      }
    }

    function filterByIndustry(name) {
      document.querySelectorAll('.radar-card').forEach(el => el.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
    }

    loadIndustryData();
  </script>
</body>
</html>
