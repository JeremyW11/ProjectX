<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project X · 全球產業追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7;
  --red-700:#b91c1c; --red-600:#dc2626; --red-100:#fee2e2;
  --amber-700:#b45309; --amber-600:#d97706; --amber-100:#fef3c7;

  /* JS 相容變數 */
  --bg-base:#f7f8fc; --bg-card:#ffffff; --bg-card-hover:#f1f5f9;
  --border:#e2e8f0; --text-primary:#0f172a; --text-secondary:#475569;
  --text-muted:#94a3b8; --accent-blue:#2563eb; --accent-purple:#7c3aed;
  --accent-green:#16a34a; --accent-red:#dc2626; --accent-orange:#d97706;
  --accent-teal:#0891b2;

  --font-en:'DM Sans',sans-serif; --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
  --shadow-hover:0 4px 24px rgba(15,23,42,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-zh);background:radial-gradient(1120px 640px at 94% -14%, rgba(37,99,235,.46), transparent 64%),radial-gradient(940px 720px at -10% 4%, rgba(51,65,85,.40), transparent 64%),radial-gradient(820px 620px at 50% 118%, rgba(29,78,216,.28), transparent 66%),linear-gradient(160deg, #dbe2ef 0%, #f4f6fb 56%);background-attachment:fixed;color:var(--text-primary);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;font-family:inherit;}
ul{list-style:none;}

/* ── TOPBAR ── */
nav{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:200;}
.logo{display:flex;align-items:center;gap:10px;margin-right:36px;flex-shrink:0;}
.logo-mark{width:32px;height:32px;background:var(--navy-700);border-radius:8px;display:grid;place-items:center;transition:transform .3s;}
.logo-mark:hover{transform:rotate(45deg) scale(1.05);}
.logo-main{font-family:var(--font-en);font-size:13.5px;font-weight:600;color:var(--navy-800);letter-spacing:.05em;}
.logo-sub{font-size:9.5px;color:var(--gray-400);letter-spacing:.08em;font-family:var(--font-en);}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;}
.nav-links a{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-sm);font-size:13.5px;color:var(--gray-500);font-weight:400;transition:all .15s;white-space:nowrap;font-family:var(--font-zh);border-bottom:none;}
.nav-links a:hover{background:var(--navy-50);color:var(--navy-700);}
.nav-links a.active{background:var(--navy-50);color:var(--navy-600);font-weight:500;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-400);display:inline-block;}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green-100);color:var(--green-600);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:var(--font-en);}
.live-dot{width:5px;height:5px;background:var(--green-600);border-radius:50%;animation:pulse 2s infinite;display:inline-block;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header-time{font-family:var(--font-en);font-size:12px;color:var(--gray-400);}
.btn{padding:7px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:var(--font-en);}
.btn-ghost{background:var(--white);border:1px solid var(--gray-300);color:var(--gray-700);}
.btn-ghost:hover{border-color:var(--navy-400);color:var(--navy-700);}
.btn-glow{background:var(--navy-700);color:var(--white);border:none;}
.btn-glow:hover{background:var(--navy-600);transform:translateY(-1px);}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;}
.hamburger span{display:block;width:22px;height:2px;background:var(--gray-700);border-radius:2px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.mobile-menu{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);z-index:199;padding:24px;flex-direction:column;gap:4px;overflow-y:auto;border-top:1px solid var(--gray-200);}
.mobile-menu.open{display:flex;}
.mobile-menu a{color:var(--gray-600);font-size:20px;font-weight:500;padding:13px 0;border-bottom:1px solid var(--gray-100);font-family:var(--font-zh);}
.mobile-menu a.active{color:var(--navy-600);}
.mobile-menu-btns{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
.mobile-menu-btns .btn{width:100%;padding:12px;font-size:14px;text-align:center;}

/* ── PAGE ── */
main{margin-top:56px;max-width:1440px;margin-left:auto;margin-right:auto;padding:28px 24px 60px;}
.top-bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;}
.top-bar h1{font-family:var(--font-display);font-size:26px;color:var(--navy-950);}
.top-bar .meta{font-size:12px;color:var(--gray-400);text-align:right;line-height:1.8;font-family:var(--font-en);}

/* ── SIGNAL RADAR ── */
.signal-radar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:22px;}
.radar-item{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:13px 10px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-card);}
.radar-item:hover{border-color:var(--navy-300);box-shadow:var(--shadow-hover);transform:translateY(-1px);}
.radar-item.active{border-color:var(--navy-400);background:var(--navy-50);}
.radar-icon{font-size:20px;margin-bottom:5px;}
.radar-name{font-size:12px;color:var(--gray-500);margin-bottom:7px;font-weight:500;line-height:1.3;font-family:var(--font-zh);}
.radar-signal{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.04em;font-family:var(--font-en);}
.bull{background:var(--green-100);color:var(--green-700);border:1px solid #bbf7d0;}
.bear{background:var(--red-100);color:var(--red-700);border:1px solid #fecaca;}
.watch{background:var(--amber-100);color:var(--amber-700);border:1px solid #fde68a;}
.neutral{background:var(--gray-100);color:var(--gray-500);border:1px solid var(--gray-200);}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:24px;}
.filter-label{font-size:12px;color:var(--gray-400);font-family:var(--font-zh);}
.filter-active{font-size:12px;color:var(--navy-600);font-weight:600;font-family:var(--font-zh);}
.filter-clear{font-size:11px;color:var(--gray-500);cursor:pointer;padding:2px 8px;border-radius:20px;border:1px solid var(--gray-200);background:var(--white);font-family:var(--font-en);transition:all .15s;}
.filter-clear:hover{border-color:var(--navy-300);color:var(--navy-600);}

/* ── LAYOUT ── */
.industry-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* ── CARDS ── */
.glass-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:18px 20px;backdrop-filter:none;margin-bottom:12px;box-shadow:var(--shadow-card);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--gray-100);}
.card-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--gray-900);font-family:var(--font-zh);}
.card-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;font-family:var(--font-en);}
.badge-free{background:var(--green-100);color:var(--green-700);}
.news-count{font-size:11px;color:var(--gray-400);font-family:var(--font-en);}

/* ── INDUSTRY NEWS ── */
.ind-news-item{display:flex;gap:9px;padding:10px 4px;border-bottom:1px solid var(--gray-100);border-radius:var(--r-sm);cursor:pointer;transition:all .15s;margin:0 -4px;}
.ind-news-item:last-child{border-bottom:none;}
.ind-news-item:hover{background:var(--navy-50);}
.ind-news-item.open{background:var(--navy-50);}
.ind-news-item.hidden{display:none;}
.ind-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;height:fit-content;margin-top:2px;letter-spacing:.04em;font-family:var(--font-en);}
.tag-semi{background:var(--navy-50);color:var(--navy-600);border:1px solid var(--navy-100);}
.tag-ai{background:#fdf4ff;color:#7e22ce;border:1px solid #e9d5ff;}
.tag-energy{background:var(--amber-100);color:var(--amber-700);border:1px solid #fde68a;}
.tag-tw{background:#ccfbf1;color:#0f766e;border:1px solid #99f6e4;}
.tag-shipping{background:var(--green-100);color:var(--green-700);border:1px solid #bbf7d0;}
.tag-finance{background:var(--red-100);color:var(--red-700);border:1px solid #fecaca;}
.ind-body{flex:1;min-width:0;}
.ind-text{font-size:13.5px;color:var(--gray-700);line-height:1.65;font-family:var(--font-zh);}
.ind-footer{display:flex;justify-content:space-between;margin-top:3px;flex-wrap:wrap;gap:3px;}
.ind-time{font-size:11px;color:var(--gray-400);font-family:var(--font-en);}
.ind-impact{font-size:11px;font-weight:600;color:var(--amber-600);font-family:var(--font-zh);}
.expand-arrow{font-size:13px;color:var(--gray-400);transition:transform .3s;flex-shrink:0;align-self:flex-start;margin-top:2px;}
.ind-expand{max-height:0;overflow:hidden;transition:max-height .4s ease,opacity .3s;opacity:0;}
.ind-news-item.open .ind-expand{max-height:280px;opacity:1;}
.expand-divider{height:1px;background:var(--gray-100);margin:8px 0;}
.expand-row{display:flex;justify-content:space-between;align-items:flex-start;padding:3px 0;gap:10px;}
.expand-label{font-size:10px;font-weight:600;color:var(--gray-400);letter-spacing:.05em;text-transform:uppercase;flex-shrink:0;margin-top:2px;font-family:var(--font-en);}
.expand-value{font-size:12.5px;color:var(--gray-600);line-height:1.6;font-family:var(--font-zh);}

/* ── ROTATION ── */
.rotation-item{padding:10px 0;border-bottom:1px solid var(--gray-100);}
.rotation-item:last-child{border-bottom:none;}
.rotation-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.rot-from{font-size:13px;color:var(--red-600);font-weight:700;font-family:var(--font-en);}
.rot-arrow{color:var(--gray-400);font-size:13px;}
.rot-to{font-size:13px;color:var(--green-600);font-weight:700;font-family:var(--font-en);}
.rot-strength{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--amber-100);color:var(--amber-700);font-family:var(--font-en);}
.rot-reason{font-size:12.5px;color:var(--gray-500);line-height:1.5;font-family:var(--font-zh);}

/* ── CORP EVENTS ── */
.corp-event-item{padding:10px 0;border-bottom:1px solid var(--gray-100);display:flex;gap:12px;align-items:flex-start;}
.corp-event-item:last-child{border-bottom:none;}
.corp-event-date-col{text-align:center;flex-shrink:0;min-width:36px;}
.corp-event-month{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-en);}
.corp-event-day{font-size:20px;font-weight:600;color:var(--gray-900);line-height:1;font-family:var(--font-en);}
.corp-event-body{flex:1;}
.corp-event-title{font-size:13.5px;font-weight:600;color:var(--gray-800);margin-bottom:2px;font-family:var(--font-zh);}
.corp-event-desc{font-size:12.5px;color:var(--gray-500);line-height:1.5;font-family:var(--font-zh);}

/* ── TOP COMPANIES ── */
.company-item{padding:11px 4px;border-bottom:1px solid var(--gray-100);border-radius:var(--r-sm);cursor:pointer;transition:background .15s;margin:0 -4px;}
.company-item:last-child{border-bottom:none;}
.company-item:hover{background:var(--navy-50);}
.company-item.open{background:var(--navy-50);}
.company-main{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.company-left{flex:1;min-width:0;}
.company-name{font-size:13.5px;font-weight:700;color:var(--gray-900);font-family:var(--font-zh);}
.company-ticker{font-size:11px;color:var(--gray-400);font-weight:400;font-family:var(--font-en);}
.company-note{font-size:12.5px;color:var(--gray-600);line-height:1.5;margin-top:2px;font-family:var(--font-zh);}
.event-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;flex-shrink:0;font-family:var(--font-en);}
.event-watch{background:var(--navy-50);color:var(--navy-600);border:1px solid var(--navy-100);}
.event-earnings{background:var(--green-100);color:var(--green-700);border:1px solid #bbf7d0;}
.event-expand{background:var(--amber-100);color:var(--amber-700);border:1px solid #fde68a;}
.company-expand{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .3s;opacity:0;}
.company-item.open .company-expand{max-height:240px;opacity:1;}
.company-expand-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100);}
.ce-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:600;font-family:var(--font-en);}
.ce-value{font-size:12.5px;color:var(--gray-600);line-height:1.5;font-family:var(--font-zh);}
.ce-risk{color:var(--red-600);}
.ce-action{color:var(--amber-600);font-weight:600;}

/* ── RESPONSIVE ── */
@media(max-width:1024px){.signal-radar{grid-template-columns:repeat(4,1fr);}}
@media(max-width:768px){
  nav{padding:0 16px;}
  .nav-links,.nav-right{display:none;}
  .hamburger{display:flex;}
  main{padding:16px 16px 40px;}
  .top-bar{flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:14px;}
  .top-bar .meta{text-align:left;font-size:11px;}
  .signal-radar{grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;}
  .radar-icon{font-size:15px;margin-bottom:3px;}
  .radar-name{font-size:11px;}
  .industry-layout{grid-template-columns:1fr;gap:0;}
  .glass-card{padding:14px 16px;margin-bottom:10px;}
  .company-expand-grid{grid-template-columns:1fr;}
  .corp-event-item{gap:9px;}
}

.logo-link{transition:opacity .2s,transform .2s;display:inline-flex;}
.logo-link:hover{opacity:.75;transform:scale(1.04);}
#stale-banner{display:none;align-items:center;justify-content:center;gap:6px;background:#fef3c7;border-bottom:1px solid #fcd34d;padding:7px 24px;font-size:12px;color:#92400e;font-family:var(--font-zh);position:fixed;top:56px;left:0;right:0;z-index:99;}
</style>
  <script src="/shared/nav.js"></script>
  <script src="/shared/footer.js"></script>
</head>
<body>

<nav>
  <a href="https://projectxbrief.netlify.app/" class="logo-link" style="text-decoration:none;"><div class="logo">
    <svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="40" height="40" rx="9" ry="9" fill="#07090f"/>
      <line x1="10" y1="10" x2="30" y2="30" stroke="white" stroke-width="6" stroke-linecap="round"/>
      <line x1="30" y1="10" x2="10" y2="30" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="3" fill="#2563eb"/>
      <circle cx="20" cy="20" r="1.5" fill="#93c5fd"/>
      <text x="48" y="26" font-family="-apple-system,system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="0.3" fill="#0f172a">PROJECT </text>
      <text x="148" y="26" font-family="-apple-system,system-ui,sans-serif" font-size="18" font-weight="700" fill="#2563eb">X</text>

  </div></a>
  <ul class="nav-links" data-active="industry"></ul>

    <div class="live-badge"><span class="live-dot"></span>LIVE</div>

</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="/brief.html">總覽</a>

    <button class="btn btn-glow">訂閱 Pro</button>
  </div>
</div>

<main>
  <div class="top-bar">
    <div>
      <h1>全球產業追蹤</h1>
      <div style="font-size:11px;color:var(--gray-400);margin-top:3px;font-family:var(--font-zh);">產業面分析 + 全球前十大公司動向</div>
    </div>
    <div class="meta" id="ind-date"></div>
  </div>

  <!-- 信號雷達 — inject target -->

  <!-- 篩選提示 -->

    <span class="filter-label">篩選：</span>

  <div class="industry-layout">
    <div>
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">📰 產業重大事件</div>
          <span class="news-count" id="news-count"></span>
        </div>
        <!-- inject target -->
        <div id="industry-news"></div>
      </div>
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">🔄 產業輪動洞察</div>
          <span class="card-badge badge-free">FREE</span>
        </div>

      </div>
      <div class="glass-card">

          <div class="card-title">🏢 全球前十大公司動向</div>
        </div>
        <!-- inject target -->

      </div>
    </div>
  </div>
</main>

<script>
// Clock
function tick(){
  const t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  const el=document.getElementById('clock');
  if(el) el.textContent=t+' CST';
}
tick(); setInterval(tick,1000);

// Mobile menu
function toggleMenu(){
  var menu=document.getElementById('mobile-menu');
  var hamburger=document.getElementById('hamburger');
  menu.classList.toggle('open');
  hamburger.classList.toggle('open');
  document.body.style.overflow=menu.classList.contains('open')?'hidden':'';
}
document.getElementById('mobile-menu').querySelectorAll('a').forEach(function(a){
  a.addEventListener('click',function(){
    document.getElementById('mobile-menu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
    document.body.style.overflow='';
  });
});
window.addEventListener('scroll',function(){
  document.querySelector('nav').style.boxShadow=window.scrollY>10?'0 2px 20px rgba(15,23,42,.08)':'';
});
</script>

<!-- 原有 JS 邏輯完整保留 -->
<script>
function toggleNews(el){
  var isOpen=el.classList.contains('open');
  document.querySelectorAll('.ind-news-item.open').forEach(function(item){
    item.classList.remove('open');
    var arrow=item.querySelector('.expand-arrow');
    if(arrow) arrow.style.transform='rotate(0deg)';
  });
  if(!isOpen){
    el.classList.add('open');
    var arrow=el.querySelector('.expand-arrow');
    if(arrow) arrow.style.transform='rotate(90deg)';
  }
}

function toggleCompany(el){
  var isOpen=el.classList.contains('open');
  document.querySelectorAll('.company-item.open').forEach(function(item){item.classList.remove('open');});
  if(!isOpen) el.classList.add('open');
}

var currentFilter=null;
var radarIcons={'半導體 / AI':'💾','加密貨幣':'🪙','能源':'⚡','雲端 / 資料中心':'☁️','金融':'🏦','航運':'🚢','消費':'🛒'};
var signalTypeMap={'半導體 / AI':'semi','加密貨幣':'crypto','能源':'energy','雲端 / 資料中心':'ai','金融':'finance','航運':'shipping','消費':'tw','生技 / 醫療':'biotech'};

function filterNews(signalName){
  var typeKey=signalTypeMap[signalName];
  currentFilter=typeKey;
  document.querySelectorAll('.radar-item').forEach(function(item){item.classList.remove('active');});
  event.currentTarget.classList.add('active');
  var items=document.querySelectorAll('.ind-news-item');
  var visibleCount=0;
  items.forEach(function(item){
    var tag=item.getAttribute('data-type');
    if(tag===typeKey){item.classList.remove('hidden');visibleCount++;}
    else{item.classList.add('hidden');}
  });
  var filterBar=document.getElementById('filter-bar');
  var filterLabel=document.getElementById('filter-active-label');
  filterBar.style.display='flex';
  filterLabel.textContent=signalName+'（'+visibleCount+' 則）';
  var countEl=document.getElementById('news-count');
  if(countEl) countEl.textContent='顯示 '+visibleCount+' 則';
}

function clearFilter(){
  currentFilter=null;
  document.querySelectorAll('.ind-news-item').forEach(function(item){item.classList.remove('hidden');});
  document.querySelectorAll('.radar-item').forEach(function(item){item.classList.remove('active');});
  document.getElementById('filter-bar').style.display='none';
  var countEl=document.getElementById('news-count');
  if(countEl) countEl.textContent='';
}

var allData=null;

function checkDataStaleness(dateStr){var today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date());if(dateStr&&dateStr!==today){var b=document.getElementById('stale-banner');if(b){b.style.display='flex';b.querySelector('.stale-date').textContent=dateStr;}}}

async function loadData(){
  var res=await fetch('../data/daily.json?t='+Date.now());
  allData=await res.json();
  checkDataStaleness(allData.date);

  var d=new Date(allData.date);
  document.getElementById('ind-date').innerHTML=
    d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'<br>UTC+8 台北時間';

  if(allData.signals){
    document.getElementById('signal-radar').innerHTML=allData.signals.map(function(s){
      return '<div class="radar-item" onclick="filterNews(\''+s.name+'\')">'+
        '<div class="radar-icon">'+(radarIcons[s.name]||'📊')+'</div>'+
        '<div class="radar-name">'+s.name+'</div>'+
        '<span class="radar-signal '+s.signal+'">'+s.label+'</span>'+
      '</div>';
    }).join('');
  }

  if(allData.industry_detail){
    if(allData.industry_detail.news){
      document.getElementById('industry-news').innerHTML=allData.industry_detail.news.map(function(item){
        var expandContent=
          '<div class="expand-divider"></div>'+
          '<div class="expand-row" style="align-items:flex-start;gap:10px;"><span class="expand-label" style="flex-shrink:0;margin-top:2px;">深度分析</span><span class="expand-value">'+(item.expand_analysis||'—')+'</span></div>';
        if(item.expand_impact_pos||item.expand_impact_neg){
          expandContent+=
            '<div class="expand-row" style="align-items:flex-start;gap:10px;">'+
              '<span class="expand-label" style="flex-shrink:0;margin-top:2px;">市場影響</span>'+
              '<span class="expand-value">'+
                (item.expand_impact_pos?'<span style="color:var(--green-600);">▲ '+item.expand_impact_pos+'</span>':'')+
                (item.expand_impact_pos&&item.expand_impact_neg?'<br>':'')+
                (item.expand_impact_neg?'<span style="color:var(--red-600);">▼ '+item.expand_impact_neg+'</span>':'')+
              '</span>'+
            '</div>';
        }
        expandContent+='<div class="expand-row"><span class="expand-label">關注標的</span><span class="expand-value">'+(item.expand_tickers||'—')+'</span></div>';
        if(item.expand_action){
          expandContent+=
            '<div class="expand-row" style="align-items:flex-start;gap:10px;">'+
              '<span class="expand-label" style="flex-shrink:0;margin-top:2px;">操作建議</span>'+
              '<span class="expand-value" style="color:var(--amber-600);font-weight:600;">'+item.expand_action+'</span>'+
            '</div>';
        }
        expandContent+='<div class="expand-row" style="align-items:flex-start;gap:10px;"><span class="expand-label" style="flex-shrink:0;margin-top:2px;">持續追蹤</span><span class="expand-value">'+(item.expand_watch||'—')+'</span></div>';
        return '<div class="ind-news-item" data-type="'+item.type+'" onclick="toggleNews(this)">'+
          '<span class="ind-tag tag-'+item.type+'">'+item.tag+'</span>'+
          '<div class="ind-body">'+
            '<div class="ind-text">'+item.text+'</div>'+
            '<div class="ind-footer"><span class="ind-time">'+item.time+'</span><span class="ind-impact">'+item.impact+'</span></div>'+
            '<div class="ind-expand">'+expandContent+'</div>'+
          '</div>'+
          '<div class="expand-arrow">›</div>'+
        '</div>';
      }).join('');
    }

    if(allData.industry_detail.rotation){
      document.getElementById('rotation-list').innerHTML=allData.industry_detail.rotation.map(function(r){
        return '<div class="rotation-item">'+
          '<div class="rotation-row">'+
            '<span class="rot-from">'+r.from+'</span>'+
            '<span class="rot-arrow">→</span>'+
            '<span class="rot-to">'+r.to+'</span>'+
            '<span class="rot-strength">'+r.strength+'</span>'+
          '</div>'+
          '<div class="rot-reason">'+r.reason+'</div>'+
        '</div>';
      }).join('');
    }

    if(allData.industry_detail.corp_events){
      document.getElementById('corp-events').innerHTML=allData.industry_detail.corp_events.map(function(e){
        var dateParts=e.date?e.date.split('-'):['--','--','--'];
        var month=dateParts[1]?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(dateParts[1])-1]:'--';
        var day=dateParts[2]||'--';
        return '<div class="corp-event-item">'+
          '<div class="corp-event-date-col">'+
            '<div class="corp-event-month">'+month+'</div>'+
            '<div class="corp-event-day">'+day+'</div>'+
          '</div>'+
          '<div class="corp-event-body">'+
            '<div class="corp-event-title">'+e.title+'</div>'+
            '<div class="corp-event-desc">'+e.desc+'</div>'+
          '</div>'+
        '</div>';
      }).join('');
    }

    if(allData.industry_detail.top_companies){
      document.getElementById('top-companies').innerHTML=allData.industry_detail.top_companies.map(function(c){
        var eventClass=c.event_type==='earnings'?'event-earnings':c.event_type==='expand'?'event-expand':'event-watch';
        return '<div class="company-item" onclick="toggleCompany(this)">'+
          '<div class="company-main">'+
            '<div class="company-left">'+
              '<div class="company-name">'+c.name+' <span class="company-ticker">'+c.ticker+'</span></div>'+
              '<div class="company-note" style="margin-top:2px;">'+c.note+'</div>'+
            '</div>'+
            '<span class="event-badge '+eventClass+'">'+c.event_label+'</span>'+
          '</div>'+
          '<div class="company-expand">'+
            '<div class="company-expand-grid">'+
              '<div><div class="ce-label">核心業務</div><div class="ce-value">'+(c.core_business||'—')+'</div></div>'+
              '<div><div class="ce-label">近期事件</div><div class="ce-value">'+(c.recent_event||'—')+'</div></div>'+
              '<div><div class="ce-label">產業影響</div><div class="ce-value">'+(c.industry_impact||'—')+'</div></div>'+
              '<div><div class="ce-label">投資風險</div><div class="ce-value ce-risk">'+(c.risk_note||'—')+'</div></div>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join('');
    }
  }
}

loadData();
</script>
