<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX — 機構報告</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root {
      --bg-base: #05060f; --bg-card: rgba(255,255,255,0.04); --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08); --text-primary: #f0f0f5; --text-secondary: #8888aa;
      --text-muted: #44445a; --accent-blue: #4da6ff; --accent-purple: #9f7aea;
      --accent-green: #48bb78; --accent-red: #fc8181; --accent-orange: #f6ad55; --accent-teal: #38b2ac;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-base); color: var(--text-primary); min-height: 100vh; background-image: radial-gradient(ellipse 80% 50% at 20% 0%, rgba(77,99,255,0.07) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 0%, rgba(159,122,234,0.06) 0%, transparent 50%); }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 60px; border-bottom: 1px solid var(--border); background: rgba(5,6,15,0.95); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 200; }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #4da6ff, #9f7aea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); padding-bottom: 2px; }
    .nav-right { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-glow { background: linear-gradient(135deg, #4da6ff, #9f7aea); color: #fff; box-shadow: 0 0 20px rgba(77,166,255,0.3); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--text-primary); border-radius: 2px; transition: all 0.3s; }
    .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
    .mobile-menu { display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 0; background: rgba(5,6,15,0.98); backdrop-filter: blur(20px); z-index: 199; padding: 24px; flex-direction: column; gap: 8px; overflow-y: auto; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { color: var(--text-secondary); text-decoration: none; font-size: 18px; font-weight: 600; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .mobile-menu a.active { color: var(--accent-blue); }
    .mobile-menu-btns { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .mobile-menu-btns .btn { width: 100%; padding: 12px; font-size: 15px; text-align: center; }
    main { max-width: 1440px; margin: 0 auto; padding: 28px 40px 60px; }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
    .top-bar h1 { font-size: 20px; font-weight: 600; }
    .top-bar .meta { font-size: 12px; color: var(--text-muted); text-align: right; line-height: 1.8; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab-btn { padding: 10px 24px; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; background: transparent; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { color: var(--text-secondary); }
    .tab-btn.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .glass-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .card-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .icon { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .icon-blue { background: rgba(77,166,255,0.15); }
    .icon-green { background: rgba(72,187,120,0.15); }

    /* 篩選按鈕 */
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-btn { padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .filter-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .filter-btn.active { background: rgba(77,166,255,0.1); border-color: var(--accent-blue); color: var(--accent-blue); }
    .filter-btn.bull-filter.active { background: rgba(72,187,120,0.1); border-color: var(--accent-green); color: var(--accent-green); }
    .filter-btn.bear-filter.active { background: rgba(252,129,129,0.1); border-color: var(--accent-red); color: var(--accent-red); }
    .filter-btn.hold-filter.active { background: rgba(246,173,85,0.08); border-color: var(--accent-orange); color: var(--accent-orange); }

    /* 機構研報 */
    .report-item { display: flex; gap: 14px; padding: 14px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; transition: background 0.2s; margin: 0 -6px; }
    .report-item:last-child { border-bottom: none; }
    .report-item:hover { background: rgba(255,255,255,0.02); }
    .report-item.open { background: rgba(255,255,255,0.02); }
    .report-item.hidden { display: none; }
    .report-left { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; }
    .report-rating { font-size: 10px; font-weight: 700; padding: 5px 8px; border-radius: 6px; white-space: nowrap; letter-spacing: 0.5px; width: 100%; text-align: center; }
    .rating-buy { background: rgba(72,187,120,0.15); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.25); }
    .rating-sell { background: rgba(252,129,129,0.15); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.25); }
    .rating-hold { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.2); }
    .rating-outperform { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.2); }
    .rating-neutral { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border); }
    .rating-change-up { font-size: 11px; color: var(--accent-green); font-weight: 700; }
    .rating-change-down { font-size: 11px; color: var(--accent-red); font-weight: 700; }
    .rating-change-hold { font-size: 11px; color: var(--text-muted); }
    .report-body { flex: 1; min-width: 0; }
    .report-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
    .report-ticker { font-size: 15px; font-weight: 700; }
    .report-firm { font-size: 12px; color: var(--accent-blue); font-weight: 600; margin-top: 3px; }
    .report-firm-bg { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-style: italic; }
    .report-target-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .report-target { font-size: 13px; color: var(--accent-green); font-weight: 700; }
    .report-prev-target { font-size: 11px; color: var(--text-muted); text-decoration: line-through; }
    .report-note { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-top: 6px; }
    .report-date { font-size: 10px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .report-expand { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease; opacity: 0; }
    .report-item.open .report-expand { max-height: 360px; opacity: 1; }
    .expand-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px 0; }
    .expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
    .expand-cell-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
    .expand-cell-value { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
    .expand-cell-value.green { color: var(--accent-green); font-weight: 700; }
    .expand-cell-value.red { color: var(--accent-red); }
    .expand-cell-value.blue { color: var(--accent-blue); }
    .expand-full { margin-top: 8px; }
    .expand-full-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
    .expand-full-value { font-size: 12px; color: var(--text-secondary); line-height: 1.6; padding: 8px 10px; background: rgba(255,255,255,0.02); border-radius: 6px; border-left: 2px solid var(--accent-blue); }
    .expand-full-value.risk { border-left-color: var(--accent-red); color: #ff9999; }
    .expand-full-value.action { border-left-color: var(--accent-orange); color: var(--accent-orange); font-weight: 600; }
    .expand-arrow { font-size: 14px; color: var(--text-muted); transition: transform 0.3s ease; flex-shrink: 0; margin-left: 6px; align-self: flex-start; margin-top: 4px; }

    /* 財報 */
    .earnings-section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; padding: 12px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.04); margin-bottom: 4px; }
    .earnings-item { padding: 14px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; transition: background 0.2s; margin: 0 -6px; }
    .earnings-item:last-child { border-bottom: none; }
    .earnings-item:hover { background: rgba(255,255,255,0.02); }
    .earnings-item.open { background: rgba(255,255,255,0.02); }
    .earnings-item.reported { border-left: 2px solid rgba(72,187,120,0.3); padding-left: 10px; }
    .earnings-item.upcoming { border-left: 2px solid rgba(77,166,255,0.2); padding-left: 10px; }
    .earnings-item.today-report { border-left: 2px solid rgba(246,173,85,0.4); padding-left: 10px; }
    .earnings-main { display: grid; grid-template-columns: 130px 1fr 110px 110px 80px 20px; gap: 12px; align-items: center; }
    .earnings-header-row { display: grid; grid-template-columns: 130px 1fr 110px 110px 80px 20px; gap: 12px; padding: 8px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .earnings-header-row span { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
    .earn-ticker { font-size: 14px; font-weight: 700; }
    .earn-name { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .earn-note { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .earn-eps { font-size: 13px; font-weight: 700; }
    .earn-est { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .earn-surprise { font-size: 10px; font-weight: 700; margin-top: 2px; }
    .beat { color: var(--accent-green); }
    .miss { color: var(--accent-red); }
    .inline { color: var(--accent-orange); }
    .status-pill { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px; display: inline-block; }
    .status-reported { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.2); }
    .status-upcoming { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.15); }
    .status-today { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.2); }
    .earnings-expand { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.3s ease; opacity: 0; }
    .earnings-item.open .earnings-expand { max-height: 220px; opacity: 1; margin-top: 12px; }
    .earnings-expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,0.02); border-radius: 8px; padding: 12px; }
    .earnings-expand-full { grid-column: 1 / -1; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.04); margin-top: 4px; }

    @media (max-width: 768px) {
      nav { padding: 0 16px; }
      .nav-links { display: none; } .nav-right { display: none; }
      .hamburger { display: flex; }
      main { padding: 16px 16px 40px; }
      .top-bar { flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 16px; }
      .top-bar .meta { text-align: left; font-size: 11px; }
      .tabs { overflow-x: auto; }
      .tab-btn { padding: 10px 14px; font-size: 12px; }
      .glass-card { padding: 14px; border-radius: 12px; }
      .report-left { min-width: 52px; }
      .report-rating { font-size: 9px; padding: 4px 6px; }
      .report-item.open .report-expand { max-height: 420px; }
      .expand-grid { grid-template-columns: 1fr; gap: 8px; }
      .earnings-header-row { display: none; }
      .earnings-main { grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 6px; }
      .earn-ticker-col { grid-column: 1; }
      .earn-status-col { grid-column: 2; text-align: right; }
      .earn-note-col { grid-column: 1 / -1; }
      .earn-eps-col, .earn-rev-col, .earn-arrow-col { display: none; }
      .earnings-item.open .earnings-expand { max-height: 280px; }
      .earnings-expand-grid { grid-template-columns: 1fr; }
      .filter-row { gap: 6px; }
      .filter-btn { padding: 4px 10px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">PROJECT X</div>
    <ul class="nav-links">
      <li><a href="/index.html">總覽</a></li>
      <li><a href="/pages/market.html">市場</a></li>
      <li><a href="/pages/industry.html">產業</a></li>
      <li><a href="/pages/institutional.html" class="active">機構報告</a></li>
      <li><a href="/pages/calendar.html">市場日曆</a></li>
      <li><a href="/pages/targets.html">標的追蹤</a></li>
    </ul>
    <div class="nav-right">
      <a href="/pages/login.html" class="btn btn-ghost" style="text-decoration:none;">登入</a>
      <button class="btn btn-glow">訂閱 Pro</button>
    </div>
    <button class="hamburger" onclick="toggleMenu()" id="hamburger">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <a href="/index.html">📊 總覽</a>
    <a href="/pages/market.html">📈 市場</a>
    <a href="/pages/industry.html">🏭 產業</a>
    <a href="/pages/institutional.html" class="active">🏛 機構報告</a>
    <a href="/pages/calendar.html">📅 市場日曆</a>
    <a href="/pages/targets.html">🎯 標的追蹤</a>
    <div class="mobile-menu-btns">
      <a href="/pages/login.html" class="btn btn-ghost" style="text-decoration:none;">登入</a>
      <button class="btn btn-glow">訂閱 Pro</button>
    </div>
  </div>

  <main>
    <div class="top-bar">
      <div>
        <h1>機構報告</h1>
        <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">機構研報 + 公司財報追蹤</div>
      </div>
      <div class="meta" id="inst-date"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('research', this)">🏛 機構研報</button>
      <button class="tab-btn" onclick="switchTab('earnings', this)">📈 公司財報</button>
    </div>

    <div id="tab-research" class="tab-content active">
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title"><div class="icon icon-blue">🏛</div>最新機構評級</div>
        </div>
        <div class="filter-row">
          <button class="filter-btn active" onclick="filterReports('all', this)">全部</button>
          <button class="filter-btn bull-filter" onclick="filterReports('bull', this)">▲ 看多</button>
          <button class="filter-btn bear-filter" onclick="filterReports('bear', this)">▼ 看空</button>
          <button class="filter-btn hold-filter" onclick="filterReports('hold', this)">— 中性</button>
          <button class="filter-btn" onclick="filterReports('up', this)">⬆ 上調</button>
          <button class="filter-btn" onclick="filterReports('down', this)">⬇ 下調</button>
        </div>
        <div id="research-list"></div>
      </div>
    </div>

    <div id="tab-earnings" class="tab-content">
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title"><div class="icon icon-green">📈</div>財報追蹤</div>
        </div>
        <div id="earnings-reported-section" style="display:none;">
          <div class="earnings-section-title">✅ 已公布財報</div>
          <div class="earnings-header-row">
            <span>標的</span><span>重點觀察</span><span>EPS</span><span>營收</span><span>狀態</span><span></span>
          </div>
          <div id="earnings-reported"></div>
        </div>
        <div id="earnings-upcoming-section" style="display:none;">
          <div class="earnings-section-title" style="margin-top:16px;">📅 即將公布財報</div>
          <div class="earnings-header-row">
            <span>標的</span><span>重點觀察</span><span>EPS 預期</span><span>營收預期</span><span>狀態</span><span></span>
          </div>
          <div id="earnings-upcoming"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function toggleMenu() {
      var menu = document.getElementById('mobile-menu');
      var hamburger = document.getElementById('hamburger');
      menu.classList.toggle('open');
      hamburger.classList.toggle('open');
      document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
      document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');
    }

    function toggleReport(el) {
      var isOpen = el.classList.contains('open');
      document.querySelectorAll('.report-item.open').forEach(function(item) {
        item.classList.remove('open');
        var arrow = item.querySelector('.expand-arrow');
        if (arrow) arrow.style.transform = 'rotate(0deg)';
      });
      if (!isOpen) {
        el.classList.add('open');
        var arrow = el.querySelector('.expand-arrow');
        if (arrow) arrow.style.transform = 'rotate(90deg)';
      }
    }

    function toggleEarnings(el) {
      var isOpen = el.classList.contains('open');
      document.querySelectorAll('.earnings-item.open').forEach(function(item) { item.classList.remove('open'); });
      if (!isOpen) el.classList.add('open');
    }

    function filterReports(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');

      var items = document.querySelectorAll('.report-item');
      items.forEach(function(item) {
        if (type === 'all') {
          item.classList.remove('hidden');
        } else if (type === 'bull') {
          var ratingType = item.getAttribute('data-rating-type');
          var isBull = ['buy', 'outperform', 'overweight'].includes(ratingType);
          item.classList.toggle('hidden', !isBull);
        } else if (type === 'bear') {
          var ratingType = item.getAttribute('data-rating-type');
          var isBear = ['sell', 'underperform', 'underweight'].includes(ratingType);
          item.classList.toggle('hidden', !isBear);
        } else if (type === 'hold') {
          var ratingType = item.getAttribute('data-rating-type');
          var isHold = ['hold', 'neutral', 'equalweight'].includes(ratingType);
          item.classList.toggle('hidden', !isHold);
        } else if (type === 'up') {
          var change = item.getAttribute('data-change');
          item.classList.toggle('hidden', change !== '上調');
        } else if (type === 'down') {
          var change = item.getAttribute('data-change');
          item.classList.toggle('hidden', change !== '下調');
        }
      });
    }

    function renderEarningsItem(e) {
      var statusClass = e.status_type === 'reported' ? 'reported' : e.status_type === 'today' ? 'today-report' : 'upcoming';
      return '<div class="earnings-item ' + statusClass + '" onclick="toggleEarnings(this)">' +
        '<div class="earnings-main">' +
          '<div class="earn-ticker-col"><div class="earn-ticker">' + e.ticker + '</div><div class="earn-name">' + e.name + '</div></div>' +
          '<div class="earn-note-col earn-note">' + e.note + '</div>' +
          '<div class="earn-eps-col">' +
            '<div class="earn-eps ' + (e.eps_result || '') + '">' + (e.eps || e.eps_est || '--') + '</div>' +
            (e.eps_est && e.eps_result && e.eps_est !== e.eps ? '<div class="earn-est">預期 ' + e.eps_est + '</div>' : '') +
            (e.eps_surprise ? '<div class="earn-surprise ' + e.eps_result + '">' + e.eps_surprise + '</div>' : '') +
          '</div>' +
          '<div class="earn-rev-col">' +
            '<div class="earn-eps">' + (e.revenue || e.rev_est || '--') + '</div>' +
            (e.rev_est && e.revenue && e.rev_est !== e.revenue ? '<div class="earn-est">預期 ' + e.rev_est + '</div>' : '') +
          '</div>' +
          '<div class="earn-status-col"><span class="status-pill status-' + (e.status_type || 'upcoming') + '">' + e.status + '</span></div>' +
          '<div class="earn-arrow-col expand-arrow">›</div>' +
        '</div>' +
        '<div class="earnings-expand">' +
          '<div class="earnings-expand-grid">' +
            '<div><div class="expand-cell-label">' + (e.status_type === 'reported' ? '下季指引' : '發布日期') + '</div><div class="expand-cell-value">' + (e.guidance || e.status || '—') + '</div></div>' +
            '<div><div class="expand-cell-label">市場反應</div><div class="expand-cell-value ' + (e.market_reaction && e.market_reaction.includes('漲') ? 'green' : e.market_reaction && e.market_reaction.includes('跌') ? 'red' : '') + '">' + (e.market_reaction || '待公布') + '</div></div>' +
            '<div><div class="expand-cell-label">' + (e.eps_result ? 'EPS 超預期' : 'EPS 預期') + '</div><div class="expand-cell-value ' + (e.eps_result || '') + '">' + (e.eps_surprise || e.eps_est || '—') + '</div></div>' +
            '<div><div class="expand-cell-label">關鍵指標</div><div class="expand-cell-value">' + (e.key_metric || '—') + '</div></div>' +
            '<div class="earnings-expand-full"><div class="expand-cell-label">財報重點</div><div class="expand-cell-value" style="margin-top:4px;">' + e.note + '</div></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    async function loadData() {
      var res = await fetch('../data/daily.json');
      var data = await res.json();

      var d = new Date(data.date);
      document.getElementById('inst-date').innerHTML =
        d.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) + '<br>UTC+8 台北時間';

      if (data.institutional && data.institutional.research) {
        document.getElementById('research-list').innerHTML = data.institutional.research.map(function(r) {
          var changeClass = r.rating_change === '上調' ? 'rating-change-up' : r.rating_change === '下調' ? 'rating-change-down' : 'rating-change-hold';
          var changeIcon = r.rating_change === '上調' ? '▲ 上調' : r.rating_change === '下調' ? '▼ 下調' : '— 維持';
          return '<div class="report-item" data-rating-type="' + (r.rating_type || '') + '" data-change="' + (r.rating_change || '') + '" onclick="toggleReport(this)">' +
            '<div class="report-left">' +
              '<span class="report-rating rating-' + r.rating_type + '">' + r.rating + '</span>' +
              '<span class="' + changeClass + '">' + changeIcon + '</span>' +
            '</div>' +
            '<div class="report-body">' +
              '<div class="report-header">' +
                '<div>' +
                  '<div class="report-ticker">' + r.ticker + ' <span style="font-size:11px;font-weight:400;color:var(--text-muted);">' + r.name + '</span></div>' +
                  '<div class="report-firm">' + r.firm + '</div>' +
                  (r.firm_background ? '<div class="report-firm-bg">' + r.firm_background + '</div>' : '') +
                  '<div class="report-target-row">' +
                    '<span class="report-target">' + r.target + '</span>' +
                    (r.prev_target ? '<span class="report-prev-target">' + r.prev_target + '</span>' : '') +
                  '</div>' +
                '</div>' +
                '<div class="report-date">' + r.date + '</div>' +
              '</div>' +
              '<div class="report-note">' + r.note + '</div>' +
              '<div class="report-expand">' +
                '<div class="expand-divider"></div>' +
                '<div class="expand-grid">' +
                  '<div><div class="expand-cell-label">評級機構</div><div class="expand-cell-value blue">' + r.firm + '</div></div>' +
                  '<div><div class="expand-cell-label">目標價</div><div class="expand-cell-value green">' + r.target + '</div></div>' +
                  '<div><div class="expand-cell-label">評級變化</div><div class="expand-cell-value ' + (r.rating_change === '上調' ? 'green' : r.rating_change === '下調' ? 'red' : '') + '">' + changeIcon + '</div></div>' +
                  '<div><div class="expand-cell-label">機構背景</div><div class="expand-cell-value">' + (r.firm_background || r.firm) + '</div></div>' +
                '</div>' +
                '<div class="expand-full"><div class="expand-full-label">核心投資邏輯</div><div class="expand-full-value">' + (r.core_logic || r.note) + '</div></div>' +
                (r.action ? '<div class="expand-full" style="margin-top:8px;"><div class="expand-full-label">操作建議</div><div class="expand-full-value action">' + r.action + '</div></div>' : '') +
                '<div class="expand-full" style="margin-top:8px;"><div class="expand-full-label">風險提示</div><div class="expand-full-value risk">' + (r.risk_note || '—') + '</div></div>' +
              '</div>' +
            '</div>' +
            '<div class="expand-arrow">›</div>' +
          '</div>';
        }).join('');
      }

      if (data.institutional && data.institutional.earnings) {
        var reported = data.institutional.earnings.filter(function(e) { return e.status_type === 'reported' || e.status_type === 'today'; });
        var upcoming = data.institutional.earnings.filter(function(e) { return e.status_type === 'upcoming'; });

        if (reported.length > 0) {
          document.getElementById('earnings-reported-section').style.display = 'block';
          document.getElementById('earnings-reported').innerHTML = reported.map(renderEarningsItem).join('');
        }
        if (upcoming.length > 0) {
          document.getElementById('earnings-upcoming-section').style.display = 'block';
          document.getElementById('earnings-upcoming').innerHTML = upcoming.map(renderEarningsItem).join('');
        }
      }
    }

    loadData();
  </script>
</body>
</html>
