<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7; --green-50:#f0fdf4;
  --red-700:#b91c1c; --red-600:#dc2626; --red-100:#fee2e2;
  --amber-600:#d97706; --amber-100:#fef3c7;
  --pro-gold:#c9a84c; --pro-gold-light:#f5e9c8; --pro-gold-dark:#8a6a1f;
  --font-en:'DM Sans',sans-serif;
  --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{background:radial-gradient(1120px 640px at 94% -14%, rgba(37,99,235,.46), transparent 64%),radial-gradient(940px 720px at -10% 4%, rgba(51,65,85,.40), transparent 64%),radial-gradient(820px 620px at 50% 118%, rgba(29,78,216,.28), transparent 66%),linear-gradient(160deg, #dbe2ef 0%, #f4f6fb 56%);background-attachment:fixed;color:var(--gray-900);font-family:var(--font-zh);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:10px;margin-right:36px;}
.header-nav{display:flex;align-items:center;gap:2px;flex:1;}
.nav-item{font-size:var(--fs-4);color:var(--gray-600);padding:6px 12px;border-radius:var(--r-sm);font-weight:500;display:flex;align-items:center;gap:6px;transition:all .15s;}
.nav-item:hover{background:var(--gray-100);color:var(--navy-700);}
.nav-item.active{background:var(--navy-50);color:var(--navy-700);font-weight:600;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-500);}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--navy-50);color:var(--navy-600);font-size:var(--fs-2);font-weight:500;padding:3px 9px;border-radius:var(--r-xl);font-family:var(--font-en);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--navy-600);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.header-time{font-size:var(--fs-3);color:var(--gray-400);font-family:var(--font-en);}
.btn-login{padding:7px 16px;background:var(--navy-700);color:var(--white);border-radius:var(--r-sm);font-size:var(--fs-3);font-weight:500;font-family:var(--font-en);}

.page{max-width:860px;margin:0 auto;padding:88px 24px 64px;}
.page-header{margin-bottom:20px;}
.page-title{font-size:var(--fs-7);font-weight:600;color:var(--navy-900);font-family:var(--font-zh);}
.page-title-sub{font-size:var(--fs-4);color:var(--gray-400);font-family:var(--font-en);font-weight:400;margin-left:8px;}
.page-update{font-size:var(--fs-3);color:var(--gray-500);margin-top:4px;}

/* PRO GATE */
.pro-gate{background:linear-gradient(135deg,var(--navy-900),var(--navy-800));border-radius:var(--r-xl);padding:48px 40px;text-align:center;color:var(--white);margin-bottom:20px;}
.pro-gate-icon{font-size:var(--fs-8);color:var(--pro-gold);margin-bottom:12px;}
.pro-gate-title{font-size:var(--fs-6);font-weight:600;margin-bottom:10px;}
.pro-gate-title em{color:var(--pro-gold);font-style:normal;}
.pro-gate-desc{font-size:var(--fs-4);color:rgba(255,255,255,.7);max-width:520px;margin:0 auto 24px;line-height:1.7;}
.btn-pro-upgrade{display:inline-block;padding:12px 28px;background:var(--pro-gold);color:var(--navy-900);border-radius:var(--r-md);font-size:var(--fs-4);font-weight:700;white-space:nowrap;}

/* PRO TEASER — real content rendered + blurred/faded, not an empty shell */
.columns-view.teaser{max-height:600px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 52%,transparent 90%);mask-image:linear-gradient(180deg,#000 0%,#000 52%,transparent 90%);}
.columns-view.teaser .ib-prose,.columns-view.teaser .thesis-box{filter:blur(4px);user-select:none;}
.teaser-convert{position:relative;margin-top:-88px;z-index:5;display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--navy-900),var(--navy-800));border-radius:var(--r-xl);padding:18px 26px;color:var(--white);box-shadow:0 20px 50px rgba(10,15,30,.35);flex-wrap:wrap;}
.teaser-convert-txt{flex:1 1 220px;min-width:0;}
.teaser-convert-txt b{font-size:var(--fs-4);display:block;margin-bottom:3px;font-weight:600;}
.teaser-convert-txt b em{color:var(--pro-gold);font-style:normal;}
.teaser-convert-txt span{font-size:var(--fs-3);color:rgba(255,255,255,.68);}
.teaser-proof{font-family:var(--font-en);text-align:center;padding:0 16px;border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15);flex-shrink:0;}
.teaser-proof b{font-size:var(--fs-5);color:var(--pro-gold);display:block;}
.teaser-proof span{font-size:var(--fs-1);color:rgba(255,255,255,.6);letter-spacing:.05em;}

/* COLUMNS */
.columns-view{display:none;}
.columns-view.active{display:flex;align-items:flex-start;gap:24px;}
.persona-sidebar{flex:0 0 264px;position:sticky;top:20px;}
.columns-main{flex:1 1 auto;min-width:0;}
@media(max-width:760px){
  .columns-view.active{flex-direction:column;gap:18px;}
  .persona-sidebar{position:static;flex-basis:auto;width:100%;}

/* persona tabs */
.persona-tabs{display:flex;flex-direction:column;gap:8px;}
.persona-tab{position:relative;display:flex;flex-direction:row;align-items:center;gap:13px;width:100%;padding:12px 16px;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-md);box-shadow:var(--shadow-card);transition:all .15s;text-align:left;}
.persona-tab:hover{border-color:var(--navy-300);transform:translateX(2px);}
.persona-tab.active{border-color:var(--navy-500);background:var(--navy-50);box-shadow:0 2px 10px rgba(37,99,235,.12);}
.persona-tab.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--navy-500);}
.pt-ava{flex-shrink:0;width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--gray-100);border:2px solid var(--white);box-shadow:0 1px 4px rgba(15,23,42,.12);}
.persona-tab.active .pt-ava{border-color:var(--navy-300);box-shadow:0 2px 8px rgba(37,99,235,.25);}
.pt-meta{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;}
.pt-name{font-size:var(--fs-5);font-weight:700;color:var(--navy-900);line-height:1.25;}
.pt-focus{font-size:var(--fs-2);color:var(--gray-500);font-family:var(--font-zh);line-height:1.3;}

/* sub-category tabs (三日分析 / 名人專刊) */
.cat-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--gray-200);}
.cat-tab{padding:9px 16px;font-size:var(--fs-4);font-weight:600;color:var(--gray-500);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.cat-tab:hover{color:var(--navy-700);}
.cat-tab.active{color:var(--navy-700);border-bottom-color:var(--navy-500);}
.cat-tab .ct-count{font-size:var(--fs-2);color:var(--gray-400);font-family:var(--font-en);margin-left:5px;}

/* issue list */
.issue-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);margin-bottom:14px;box-shadow:var(--shadow-card);overflow:hidden;}
.issue-head{display:flex;align-items:flex-start;gap:10px;padding:18px 22px;cursor:pointer;flex-wrap:wrap;}
.issue-head:hover{background:var(--gray-50);}
.ih-main{flex:1;min-width:200px;}
.ih-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.ih-date{font-size:var(--fs-3);color:var(--gray-400);font-family:var(--font-en);font-weight:600;}
.ih-badge{font-size:var(--fs-2);font-weight:700;padding:2px 9px;border-radius:var(--r-xl);font-family:var(--font-zh);}
.ih-badge.serial{background:var(--navy-50);color:var(--navy-600);}
.ih-badge.special{background:var(--amber-100);color:var(--amber-600);}
.ih-badge.sample{background:var(--gray-100);color:var(--gray-500);}
.ih-title{font-size:var(--fs-5);font-weight:600;color:var(--navy-900);line-height:1.5;}
.ih-toggle{font-size:var(--fs-3);color:var(--gray-400);font-family:var(--font-en);align-self:center;}
.issue-body{display:none;padding:0 22px 22px;border-top:1px solid var(--gray-100);}
.issue-body.open{display:block;}
.ib-trigger{font-size:var(--fs-3);color:var(--amber-600);background:var(--amber-100);border-radius:var(--r-sm);padding:6px 10px;margin:14px 0 4px;}
.ib-prose{font-size:var(--fs-4);color:var(--gray-700);line-height:1.85;padding-top:14px;}
.ib-prose p{margin-bottom:12px;}
.thesis-box{margin-top:18px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:14px 16px;}
.thesis-title{font-size:var(--fs-3);font-weight:700;color:var(--navy-700);margin-bottom:8px;letter-spacing:.03em;}
.thesis-row{font-size:var(--fs-3);color:var(--gray-700);line-height:1.6;margin-bottom:4px;}
.thesis-row b{color:var(--navy-900);font-weight:600;}
.ib-disclaimer{font-size:var(--fs-2);color:var(--gray-400);line-height:1.6;margin-top:16px;border-top:1px dashed var(--gray-200);padding-top:12px;}
.loading{font-size:var(--fs-3);color:var(--gray-400);padding:14px 0;}
.empty-box{background:var(--white);border:1px dashed var(--gray-300);border-radius:var(--r-lg);padding:48px 24px;text-align:center;color:var(--gray-400);font-size:var(--fs-4);}
@media(max-width:768px){.header-nav{display:none;}}
</style>

<script>
// Clock
function tick(){
  var t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  var el=document.getElementById('clock'); if(el) el.textContent=t+' CST';
}
tick(); setInterval(tick,1000);

// ── Supabase Auth ──
var SUPABASE_URL='https://eezhmeccakaeiprviqra.supabase.co';
var SUPABASE_KEY='sb_publishable_qb__g5BMRYLiV2Bin6b1Bw_LwmVARqM';
var _supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:false,persistSession:true}});

function initAuth(){
  _supabase.auth.onAuthStateChange(function(event,session){
    if(event==='INITIAL_SESSION'||event==='SIGNED_IN'||event==='TOKEN_REFRESHED'){
      setAuthState(session?session.user:null);
    } else if(event==='SIGNED_OUT'){
      setAuthState(null);
    }
  });
}

function setAuthState(user){
  var viewEl=document.getElementById('columns-view');
  var btnEl=document.getElementById('auth-btn');
  if(viewEl) viewEl.classList.add('active');
  if(user){
    if(btnEl){ btnEl.textContent='登出'; btnEl.href='#'; btnEl.onclick=function(e){e.preventDefault();signOutUser();}; }
    checkProStatus(user, viewEl);
  } else {
    renderTeaser(viewEl, false);
    if(btnEl){ btnEl.textContent='登入'; btnEl.href='/pages/login.html'; btnEl.onclick=null; }
  }
}

async function checkProStatus(user, viewEl){
  var isAdmin = user.email === 'jermy831102@gmail.com';
  var isPro = isAdmin;
  if(!isPro){
    var result = await _supabase.from('profiles').select('is_pro').eq('id', user.id).single();
    isPro = result.data && result.data.is_pro === true;
  }
  if(isPro){
    if(viewEl) viewEl.classList.remove('teaser');
    var wrap=document.getElementById('teaser-convert-wrap');
    if(wrap) wrap.innerHTML='';
    loadColumns();
  } else {
    renderTeaser(viewEl, true);
  }
}

async function renderTeaser(viewEl, loggedIn){
  if(viewEl) viewEl.classList.add('teaser');
  loadColumns();
  var wrap=document.getElementById('teaser-convert-wrap');
  if(!wrap) return;
  var proof='';
  try{
    var r=await fetch('/data/performance.json?v='+Math.floor(Date.now()/300000));
    var p=await r.json();
    var pr=p.predictions||{};
    if(pr.hit_rate_weighted!=null){
      proof='<div class="teaser-proof"><b>'+pr.hit_rate_weighted+'%</b><span>加權命中率</span></div>'+
            '<div class="teaser-proof" style="border-right:none;"><b>'+pr.resolved+'</b><span>已驗證研判</span></div>';
    }
  }catch(e){}
  var cta=loggedIn
    ? '<a href="/pages/credits.html" class="btn-pro-upgrade">升級 Pro →</a>'
    : '<a href="/pages/login.html" class="btn-pro-upgrade">登入解鎖 →</a>';
  wrap.innerHTML='<div class="teaser-convert">'+
    '<div class="teaser-convert-txt"><b>用<em>名家的思維框架</em>讀今天的市場</b><span>升級 Pro 解鎖完整三日分析與名人專刊</span></div>'+
    proof+cta+
  '</div>';
}

async function signOutUser(){
  await _supabase.auth.signOut();
  window.location.reload();
}

// ── Render persona columns ──
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

var COL_STATE={ personas:[], feed:[], active:null, activeCat:'serial', issueCache:{} };
var CAT_LABEL={ serial:'三日分析（短期）', special:'名人專刊（長期）' };

function currentIssues(){
  return COL_STATE.feed
    .filter(function(f){ return f.persona===COL_STATE.active && (f.type==='special'?'special':'serial')===COL_STATE.activeCat; })
    .slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
}

async function loadColumns(){
  var tabsEl=document.getElementById('persona-tabs');
  var listEl=document.getElementById('issue-list');
  if(!listEl) return;
  var idx={};
  try{
    var res=await fetch('/data/columns/index.json?v='+Math.floor(Date.now()/300000));
    idx=await res.json();
  }catch(e){ idx={}; }

  COL_STATE.feed=Array.isArray(idx.feed)?idx.feed:[];
  // 從 feed 推導人格清單（personas 欄若有則優先）
  var personas=Array.isArray(idx.personas)&&idx.personas.length?idx.personas:[];
  if(!personas.length){
    var seen={};
    COL_STATE.feed.forEach(function(f){ if(!seen[f.persona]){ seen[f.persona]=1; personas.push({persona:f.persona,display_name:f.display_name,series_focus:''}); } });
  }
  COL_STATE.personas=personas;

  if(!personas.length){
    tabsEl.innerHTML='';
    listEl.innerHTML='<div class="empty-box">名家觀點即將開刊。各人格的三日分析與名人專刊產出後，會在這裡串成可反覆閱讀的脈絡。</div>';
    return;
  }

  COL_STATE.active=personas[0].persona;
  COL_STATE.activeCat='serial';
  renderTabs();
  renderCatTabs();
  renderIssueList();
}

function renderTabs(){
  var tabsEl=document.getElementById('persona-tabs');
  tabsEl.innerHTML=COL_STATE.personas.map(function(p){
    var active=p.persona===COL_STATE.active?' active':'';
    return '<button class="persona-tab'+active+'" data-persona="'+esc(p.persona)+'">'+
      '<img class="pt-ava" src="/assets/personas/'+esc(p.persona)+'.png" alt="'+esc(p.display_name||p.persona)+'" loading="lazy" onerror="this.style.display=\'none\'">'+
      '<span class="pt-meta">'+
        '<span class="pt-name">'+esc(p.display_name||p.persona)+'</span>'+
        (p.series_focus?'<span class="pt-focus">'+esc(p.series_focus)+'</span>':'')+
      '</span>'+
    '</button>';
  }).join('');
  Array.prototype.forEach.call(tabsEl.querySelectorAll('.persona-tab'),function(b){
    b.onclick=function(){ COL_STATE.active=b.dataset.persona; COL_STATE.activeCat='serial'; renderTabs(); renderCatTabs(); renderIssueList(); };
  });
}

function renderCatTabs(){
  var el=document.getElementById('cat-tabs');
  var counts={ serial:0, special:0 };
  COL_STATE.feed.forEach(function(f){ if(f.persona===COL_STATE.active){ counts[f.type==='special'?'special':'serial']++; } });
  el.innerHTML=['serial','special'].map(function(cat){
    var active=cat===COL_STATE.activeCat?' active':'';
    return '<button class="cat-tab'+active+'" data-cat="'+cat+'">'+CAT_LABEL[cat]+
      '<span class="ct-count">'+counts[cat]+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('.cat-tab'),function(b){
    b.onclick=function(){ COL_STATE.activeCat=b.dataset.cat; renderCatTabs(); renderIssueList(); };
  });
}

function renderIssueList(){
  var listEl=document.getElementById('issue-list');
  var issues=currentIssues();
  if(!issues.length){
    var msg=COL_STATE.activeCat==='special'?'這位名家目前沒有名人專刊。名家在每日資料蒐集後自行判斷，遇到值得一講的長期轉折才會加發。':'這位名家尚未開始三日分析。';
    listEl.innerHTML='<div class="empty-box">'+msg+'</div>';
    return;
  }
  listEl.innerHTML=issues.map(function(f,i){
    var isSpecial=f.type==='special';
    var badge=isSpecial?'<span class="ih-badge special">名人專刊</span>':'<span class="ih-badge serial">三日分析</span>';
    return '<div class="issue-card" data-persona="'+esc(f.persona)+'" data-date="'+esc(f.date)+'">'+
      '<div class="issue-head" data-i="'+i+'">'+
        '<div class="ih-main">'+
          '<div class="ih-meta"><span class="ih-date">'+esc(f.date)+'</span>'+badge+'</div>'+
          '<div class="ih-title">'+esc(f.title||'（未命名）')+'</div>'+
        '</div>'+
        '<span class="ih-toggle" id="tg-'+i+'">'+(i===0?'收合 ▲':'展開 ▼')+'</span>'+
      '</div>'+
      '<div class="issue-body" id="body-'+i+'"></div>'+
    '</div>';
  }).join('');
  Array.prototype.forEach.call(listEl.querySelectorAll('.issue-head'),function(h){
    h.onclick=function(){ toggleIssue(parseInt(h.dataset.i,10)); };
  });
  // 最新一期預設展開
  toggleIssue(0, true);
}

async function toggleIssue(i, forceOpen){
  var bodyEl=document.getElementById('body-'+i);
  var tgEl=document.getElementById('tg-'+i);
  if(!bodyEl) return;
  var isOpen=bodyEl.classList.contains('open');
  if(isOpen && !forceOpen){
    bodyEl.classList.remove('open');
    if(tgEl) tgEl.textContent='展開 ▼';
    return;
  }
  var issues=currentIssues();
  var f=issues[i];
  if(!f) return;
  bodyEl.classList.add('open');
  if(tgEl) tgEl.textContent='收合 ▲';
  if(bodyEl.dataset.loaded){ return; }
  bodyEl.innerHTML='<div class="loading">載入中…</div>';
  var key=f.persona+'/'+f.date;
  var data=COL_STATE.issueCache[key];
  if(!data){
    try{
      var res=await fetch('/data/columns/'+encodeURIComponent(f.persona)+'/'+encodeURIComponent(f.date)+'.json?v='+Math.floor(Date.now()/300000));
      data=await res.json();
      COL_STATE.issueCache[key]=data;
    }catch(e){ bodyEl.innerHTML='<div class="loading">這期內容載入失敗。</div>'; return; }
  }
  bodyEl.innerHTML=renderIssueBody(data);
  bodyEl.dataset.loaded='1';
}

function renderIssueBody(d){
  var html='';
  if(d.is_sample){ html+='<div class="ib-trigger" style="background:var(--gray-100);color:var(--gray-500);">範例稿：用於預覽版面，首次正式產出後即由真實內容取代。</div>'; }
  if(d.type==='special' && d.trigger){ html+='<div class="ib-trigger">名人專刊 · 加發原因：'+esc(d.trigger)+'</div>'; }
  var paras=String(d.body||'').split(/\n+/).filter(function(p){return p.trim();});
  html+='<div class="ib-prose">'+paras.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div>';
  if(d.thesis && (d.thesis.core||d.thesis.vars||d.thesis.change)){
    html+='<div class="thesis-box">'+
      '<div class="thesis-title">本期持續論點</div>'+
      (d.thesis.core?'<div class="thesis-row"><b>核心判斷：</b>'+esc(d.thesis.core)+'</div>':'')+
      (d.thesis.vars?'<div class="thesis-row"><b>關鍵變數：</b>'+esc(d.thesis.vars)+'</div>':'')+
      (d.thesis.change?'<div class="thesis-row"><b>相對上期：</b>'+esc(d.thesis.change)+'</div>':'')+
    '</div>';
  }
  if(d.disclaimer){ html+='<div class="ib-disclaimer">'+esc(d.disclaimer)+'</div>'; }
  return html;
}

initAuth();
</script>
