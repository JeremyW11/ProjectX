<html lang="zh-TW">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7; --green-50:#f0fdf4;
  --red-700:#b91c1c; --red-600:#dc2626; --red-100:#fee2e2;
  --amber-600:#d97706; --amber-100:#fef3c7;
  --pro-gold:#c9a84c; --pro-gold-light:#f5e9c8; --pro-gold-dark:#8a6a1f;
  --font-en:'DM Sans',sans-serif;
  --font-zh:'Noto Sans TC',sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{background:radial-gradient(1120px 640px at 94% -14%, rgba(37,99,235,.46), transparent 64%),radial-gradient(940px 720px at -10% 4%, rgba(51,65,85,.40), transparent 64%),radial-gradient(820px 620px at 50% 118%, rgba(29,78,216,.28), transparent 66%),linear-gradient(160deg, #dbe2ef 0%, #f4f6fb 56%);background-attachment:fixed;color:var(--gray-900);font-family:var(--font-zh);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}

.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:10px;margin-right:36px;}
.header-nav{display:flex;align-items:center;gap:2px;flex:1;}
.nav-item{font-size:13.5px;color:var(--gray-600);padding:6px 12px;border-radius:var(--r-sm);font-weight:500;display:flex;align-items:center;gap:6px;transition:all .15s;}
.nav-item:hover{background:var(--gray-100);color:var(--navy-700);}
.nav-item.active{background:var(--navy-50);color:var(--navy-700);font-weight:600;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-500);}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green-100);color:var(--green-600);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:var(--font-en);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green-600);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.header-time{font-size:12px;color:var(--gray-400);font-family:var(--font-en);}
.btn-login{padding:7px 16px;background:var(--navy-700);color:var(--white);border-radius:var(--r-sm);font-size:13px;font-weight:500;font-family:var(--font-en);}
@media(max-width:768px){.header-nav{display:none;}}

.page{max-width:960px;margin:0 auto;padding:88px 24px 64px;}
.page-header{margin-bottom:24px;}
.page-title{font-size:26px;font-weight:600;color:var(--navy-900);}
.page-title-sub{font-size:14px;color:var(--gray-400);font-family:var(--font-en);font-weight:400;margin-left:8px;}
.page-update{font-size:12.5px;color:var(--gray-500);margin-top:4px;}

.pro-gate{background:linear-gradient(135deg,var(--navy-900),var(--navy-800));border-radius:var(--r-xl);padding:48px 40px;text-align:center;color:var(--white);margin-bottom:20px;}
.pro-gate-icon{font-size:36px;color:var(--pro-gold);margin-bottom:12px;}
.pro-gate-title{font-size:24px;font-weight:600;margin-bottom:10px;}
.pro-gate-title em{color:var(--pro-gold);font-style:normal;}
.pro-gate-desc{font-size:14px;color:rgba(255,255,255,.7);max-width:520px;margin:0 auto 24px;line-height:1.7;}
.btn-pro-upgrade{display:inline-block;padding:12px 28px;background:var(--pro-gold);color:var(--navy-900);border-radius:var(--r-md);font-size:14px;font-weight:700;}

#perf-view{display:none;}
#perf-view.active{display:block;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-card);}
.stat-label{font-size:12px;color:var(--gray-500);margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:600;font-family:var(--font-en);color:var(--navy-900);}
.stat-value.green{color:var(--green-600);} .stat-value.red{color:var(--red-600);}
.stat-foot{font-size:11.5px;color:var(--gray-400);margin-top:4px;}

.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow-card);margin-bottom:20px;}
.card h2{font-size:16px;font-weight:600;color:var(--navy-900);margin-bottom:4px;}
.card .desc{font-size:12.5px;color:var(--gray-500);margin-bottom:16px;}
svg text{font-family:var(--font-en);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11.5px;color:var(--gray-500);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--gray-200);}
td{padding:9px 10px;border-bottom:1px solid var(--gray-100);color:var(--gray-700);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.tk{font-family:var(--font-en);font-weight:600;color:var(--navy-700);white-space:nowrap;}
.pct{font-family:var(--font-en);font-weight:600;white-space:nowrap;}
.pct.up{color:var(--green-600);} .pct.dn{color:var(--red-600);}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.badge.hit{background:var(--green-100);color:var(--green-700);}
.badge.miss{background:var(--red-100);color:var(--red-700);}
.badge.partial{background:var(--amber-100);color:var(--amber-600);}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:720px){.split{grid-template-columns:1fr;}}
.case{border:1px solid var(--gray-200);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;}
.case .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px;}
.case .title{font-size:13.5px;font-weight:600;color:var(--navy-900);}
.case .note{font-size:12px;color:var(--gray-500);line-height:1.6;}
.method-note{font-size:12px;color:var(--gray-400);margin-top:18px;line-height:1.7;}
.empty-box{background:var(--white);border:1px dashed var(--gray-300);border-radius:var(--r-lg);padding:36px;text-align:center;color:var(--gray-500);font-size:13.5px;}
</style>
</head>
<body>

<header class="topbar">
  <a href="/index.html"><div class="topbar-logo">
    <svg width="170" height="40" viewBox="0 0 200 40">
      <line x1="10" y1="10" x2="30" y2="30" stroke="white" stroke-width="6" stroke-linecap="round"/>
      <line x1="30" y1="10" x2="10" y2="30" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="3" fill="#2563eb"/>
      <circle cx="20" cy="20" r="1.5" fill="#93c5fd"/>
      <text x="48" y="26" font-family="-apple-system,system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="0.3" fill="#0f172a">PROJECT </text>
      <text x="148" y="26" font-family="-apple-system,system-ui,sans-serif" font-size="18" font-weight="700" fill="#2563eb">X</text>
    </svg>
  </div></a>
  <nav class="header-nav" data-active="performance"></nav>

</header>

<script src="/shared/nav.js"></script>
<script src="/shared/footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<main class="page">

  <div class="page-header">
    <h1 class="page-title">歷史戰績 <span class="page-title-sub">Track Record</span></h1>
    <div class="page-update" id="perf-updated">事件預判命中率與不對稱機會實際報酬 · Pro 會員專屬 · 每日更新</div>

      <div><a href="/pages/login.html" class="btn-pro-upgrade">✦ 登入體驗 Pro</a></div>
    </div>
  </div>

  <div id="perf-view"></div>

</main>

<script>
function tick(){
  var t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  var el=document.getElementById('clock'); if(el) el.textContent=t+' CST';
}
tick(); setInterval(tick,1000);

var SUPABASE_URL='https://eezhmeccakaeiprviqra.supabase.co';
var SUPABASE_KEY='sb_publishable_qb__g5BMRYLiV2Bin6b1Bw_LwmVARqM';
var ADMIN_EMAIL='jermy831102@gmail.com';
var _supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function initAuth(){
  _supabase.auth.onAuthStateChange(function(event,session){
    if(event==='INITIAL_SESSION'||event==='SIGNED_IN'||event==='TOKEN_REFRESHED'){
      setAuthState(session?session.user:null);
    } else if(event==='SIGNED_OUT'){ setAuthState(null); }
  });
}
function setAuthState(user){
  var gateEl=document.getElementById('pro-gate-view');
  var viewEl=document.getElementById('perf-view');
  var btnEl=document.getElementById('auth-btn');
  if(user){
    if(btnEl){ btnEl.textContent='登出'; btnEl.href='#'; btnEl.onclick=function(e){e.preventDefault();signOutUser();}; }
    checkProStatus(user, gateEl, viewEl);
  } else {
    if(gateEl) gateEl.style.display='block';
    if(viewEl) viewEl.classList.remove('active');
    if(btnEl){ btnEl.textContent='登入'; btnEl.href='/pages/login.html'; btnEl.onclick=null; }
  }
}
async function checkProStatus(user, gateEl, viewEl){
  var isPro = (user.email===ADMIN_EMAIL);
  if(!isPro){
    var result = await _supabase.from('profiles').select('is_pro').eq('id', user.id).single();
    isPro = result.data && result.data.is_pro === true;
  }
  if(isPro){
    if(gateEl) gateEl.style.display='none';
    if(viewEl) viewEl.classList.add('active');
    loadPerformance();
  } else {
    if(gateEl) gateEl.style.display='block';
    if(viewEl) viewEl.classList.remove('active');
  }
}
async function signOutUser(){ await _supabase.auth.signOut(); window.location.reload(); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pctCell(v){
  if(v==null) return '<span class="pct" style="color:var(--gray-400);">—</span>';
  return '<span class="pct '+(v>=0?'up':'dn')+'">'+(v>=0?'+':'')+v.toFixed(2)+'%</span>';
}

function buildSeriesSVG(series){
  var pts=series.filter(function(s){return s.rate!=null;});
  if(pts.length<2) return '<div class="empty-box">驗證樣本累積中，命中率走勢將在數日後出現。</div>';
  var W=860,H=220,L=50,R=20,T=16,B=34;
  var min=Math.min.apply(null,pts.map(function(p){return p.rate;}));
  var max=Math.max.apply(null,pts.map(function(p){return p.rate;}));
  min=Math.max(0,Math.floor((min-8)/10)*10); max=Math.min(100,Math.ceil((max+8)/10)*10);
  if(max-min<20){max=Math.min(100,min+20);}
  var x=function(i){return L+(W-L-R)*(pts.length===1?0.5:i/(pts.length-1));};
  var y=function(v){return T+(H-T-B)*(1-(v-min)/(max-min));};
  var grid='',labels='';
  for(var g=0;g<=3;g++){
    var gv=min+(max-min)*g/3, gy=y(gv);
    grid+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#e2e8f0" stroke-width="1"/>';
    labels+='<text x="10" y="'+(gy+4)+'" fill="#94a3b8" font-size="11">'+Math.round(gv)+'%</text>';
  }
  var poly=pts.map(function(p,i){return x(i).toFixed(1)+','+y(p.rate).toFixed(1);}).join(' ');
  var last=pts[pts.length-1];
  var xticks='';
  var step=Math.max(1,Math.floor(pts.length/4));
  for(var i=0;i<pts.length;i+=step){ xticks+='<text x="'+(x(i)-16)+'" y="'+(H-12)+'" fill="#94a3b8" font-size="11">'+esc(pts[i].date.slice(5))+'</text>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="220">'+grid+labels+
    '<polyline fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" points="'+poly+'"/>'+
    '<circle cx="'+x(pts.length-1)+'" cy="'+y(last.rate)+'" r="4" fill="#2563eb"/>'+
    '<text x="'+(x(pts.length-1)-44)+'" y="'+(y(last.rate)-10)+'" fill="#1d2d5a" font-size="12" font-weight="600">'+last.rate+'%</text>'+
    xticks+'</svg>';
}

function buildDistSVG(items){
  var vals=items.filter(function(e){return e.r7!=null;}).slice(0,42).reverse().map(function(e){return e.r7;});
  if(!vals.length) return '<div class="empty-box">尚無已到期的機會報酬。</div>';
  var W=860,H=180,mid=90,L=34;
  var maxAbs=Math.max.apply(null,vals.map(Math.abs));
  var scale=Math.min(75/Math.max(maxAbs,1),12);
  var bw=Math.min(16,(W-L-10)/vals.length-4);
  var bars=vals.map(function(v,i){
    var h=Math.max(2,Math.abs(v)*scale), bx=L+i*((W-L-10)/vals.length);
    return '<rect x="'+bx.toFixed(1)+'" width="'+bw.toFixed(1)+'" y="'+(v>=0?mid-h:mid).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+(v>=0?'#16a34a':'#dc2626')+'" opacity=".85"/>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="180">'+
    '<line x1="'+(L-6)+'" y1="'+mid+'" x2="'+(W-6)+'" y2="'+mid+'" stroke="#cbd5e1" stroke-width="1"/>'+
    '<text x="2" y="'+(mid+4)+'" fill="#94a3b8" font-size="11">0%</text>'+bars+'</svg>';
}

function caseHTML(c){
  var v=(c.r30!=null?c.r30:c.r7);
  return '<div class="case"><div class="head">'+
    '<span class="title"><span class="tk">'+esc(c.ticker)+'</span> '+esc(c.name||'')+'</span>'+pctCell(v)+
    '</div><div class="note">'+esc(c.date)+' 提出'+(c.thesis?' · '+esc(c.thesis):'')+(c.r30!=null?'（30日）':'（7日）')+'</div></div>';
}

async function loadPerformance(){
  var viewEl=document.getElementById('perf-view');
  if(!viewEl) return;
  var perf=null, acc=null;
  try{
    var r1=await fetch('/data/performance.json?t='+Date.now()); perf=await r1.json();
  }catch(e){}
  try{
    var r2=await fetch('/data/accumulated.json?t='+Date.now()); acc=await r2.json();
  }catch(e){}
  if(!perf){ viewEl.innerHTML='<div class="empty-box">戰績資料尚未生成，下次早報後將自動出現。</div>'; return; }

  var P=perf.predictions||{}, O=perf.opportunities||{};
  document.getElementById('perf-updated').textContent='資料截至 '+(perf.updated||'—')+' · 報酬以 7／30 日後實際收盤價計算 · Pro 會員專屬';

  var resolvedTxt=(P.hit||0)+' 命中 / '+(P.partial||0)+' 部分 / '+(P.miss||0)+' 未中';
  var html='<div class="stat-grid">'+
    '<div class="stat-card"><div class="stat-label">事件預判命中率（加權）</div><div class="stat-value '+((P.hit_rate_weighted||0)>=50?'green':'red')+'">'+(P.hit_rate_weighted!=null?P.hit_rate_weighted+'%':'—')+'</div><div class="stat-foot">'+resolvedTxt+'（部分命中計 0.5）</div></div>'+
    '<div class="stat-card"><div class="stat-label">機會 7 日平均報酬</div><div class="stat-value '+((O.avg_r7||0)>=0?'green':'red')+'">'+(O.avg_r7!=null?(O.avg_r7>=0?'+':'')+O.avg_r7+'%':'—')+'</div><div class="stat-foot">已評估 '+(O.evaluated7||0)+' 筆 · 勝率 '+(O.win7!=null?O.win7+'%':'—')+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">機會 30 日平均報酬</div><div class="stat-value '+((O.avg_r30||0)>=0?'green':'red')+'">'+(O.avg_r30!=null?(O.avg_r30>=0?'+':'')+O.avg_r30+'%':'—')+'</div><div class="stat-foot">'+(O.evaluated30?('已評估 '+O.evaluated30+' 筆 · 勝率 '+(O.win30!=null?O.win30+'%':'—')):'樣本累積中（30日後陸續到期）')+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">追蹤中機會</div><div class="stat-value">'+(O.tracked||0)+'</div><div class="stat-foot">驗證樣本共 '+(P.resolved||0)+' 項預判</div></div>'+
  '</div>';

  html+='<div class="card"><h2>預判命中率走勢</h2><div class="desc">每日驗證的事件預判滾動 14 日加權命中率（命中=1、部分=0.5）</div>'+buildSeriesSVG(P.series||[])+'</div>';
  html+='<div class="card"><h2>機會 7 日報酬分布</h2><div class="desc">每筆不對稱機會自提出日起 7 日的實際收盤報酬（最近 '+Math.min(42,(O.items||[]).filter(function(e){return e.r7!=null;}).length)+' 筆）</div>'+buildDistSVG(O.items||[])+'</div>';

  var best=(O.best||[]).filter(function(c){return (c.r30!=null?c.r30:c.r7)!=null;});
  var worst=(O.worst||[]).filter(function(c){return (c.r30!=null?c.r30:c.r7)!=null;});
  if(best.length||worst.length){
    html+='<div class="split">'+
      '<div class="card"><h2>最佳案例</h2><div class="desc">依已實現報酬排序</div>'+best.map(caseHTML).join('')+'</div>'+
      '<div class="card"><h2>最差案例</h2><div class="desc">誠實揭露：失準的判斷</div>'+worst.map(caseHTML).join('')+'</div>'+
    '</div>';
  }

  var ph=(acc&&Array.isArray(acc.prediction_history))?acc.prediction_history:[];
  var recent=ph.filter(function(p){return ['hit','partial','miss'].indexOf(p.accuracy)>=0;})
    .sort(function(a,b){return (b.verified_at||b.date||'').localeCompare(a.verified_at||a.date||'');}).slice(0,10);
  if(recent.length){
    var BADGE={hit:'<span class="badge hit">命中</span>',partial:'<span class="badge partial">部分</span>',miss:'<span class="badge miss">未中</span>'};
    html+='<div class="card"><h2>近期已驗證預判</h2><div class="desc">事件預判 vs 隔日實際結果</div><table>'+
      '<tr><th>預判日</th><th>事件</th><th>實際結果</th><th>結果</th></tr>'+
      recent.map(function(p){
        return '<tr><td style="white-space:nowrap;">'+esc((p.date||'').slice(5))+'</td><td>'+esc(p.event_title||'')+'</td><td>'+esc(p.actual_result||'')+'</td><td>'+(BADGE[p.accuracy]||'')+'</td></tr>';
      }).join('')+'</table></div>';
  }

  html+='<div class="method-note">計算方式：機會報酬＝提出日收盤 → 7／30 個日曆日後最近交易日收盤（Yahoo Finance 實際行情），不含交易成本與滑價；題材型（無單一代號）機會不納入報酬統計。預判驗證由隔日報告比對實際市場結果，部分命中計 0.5。歷史樣本自 2026-05-15 起累積。</div>';

  viewEl.innerHTML=html;
}

initAuth();
</script>
