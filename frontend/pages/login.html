<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela · 登入</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-200:#c7d7fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7;
  --red-600:#dc2626; --red-100:#fee2e2;
  --font-en:'DM Sans',sans-serif;
  --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{
  font-family:var(--font-zh);
  color:var(--gray-900);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background-attachment:fixed;
  background:
    radial-gradient(1120px 640px at 94% -14%, rgba(37,99,235,.46), transparent 64%),
    radial-gradient(940px 720px at -10% 4%, rgba(51,65,85,.40), transparent 64%),
    radial-gradient(820px 620px at 50% 118%, rgba(29,78,216,.28), transparent 66%),
    linear-gradient(160deg, #dbe2ef 0%, #f4f6fb 56%);
}

.container{width:100%;max-width:420px;padding:24px;}

/* Logo */
.logo-wrap{text-align:center;margin-bottom:12px;}
.logo-wrap svg{transition:transform .3s;}
.logo-wrap a:hover svg{transform:translateY(-1px);}
.subtitle{
  text-align:center;font-size:var(--fs-3);color:var(--gray-400);
  margin-bottom:28px;font-family:var(--font-zh);
}

/* Card */
.card{
  background:var(--white);border:1px solid var(--gray-200);
  border-radius:20px;padding:28px 30px;
  box-shadow:0 4px 24px rgba(15,23,42,.08);
}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--gray-200);}
.tab-btn{
  flex:1;padding:9px;font-size:var(--fs-4);font-weight:500;cursor:pointer;
  border:none;background:transparent;color:var(--gray-400);
  border-bottom:2px solid transparent;transition:all .2s;
  font-family:var(--font-zh);
}
.tab-btn.active{color:var(--navy-600);border-bottom-color:var(--navy-500);}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* Form */
.form-group{margin-bottom:16px;}
label{
  display:block;font-size:var(--fs-3);font-weight:600;color:var(--gray-600);
  margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase;
  font-family:var(--font-en);
}
input{
  width:100%;padding:10px 13px;border-radius:8px;
  background:var(--white);border:1px solid var(--gray-300);
  color:var(--gray-900);font-size:var(--fs-4);font-family:var(--font-en);
  transition:all .15s;outline:none;
}
input:focus{border-color:var(--navy-400);box-shadow:0 0 0 3px rgba(59,130,246,.1);}
input::placeholder{color:var(--gray-400);}
.field-hint{margin-top:5px;font-size:var(--fs-2);line-height:1.6;color:var(--gray-500);}
.field-hint li{margin-left:14px;list-style:disc;}
.field-hint .ok{color:var(--navy-600);}
.field-hint .bad{color:var(--amber-700);}

/* Buttons */
.btn-primary{
  width:100%;padding:11px;border-radius:8px;font-size:var(--fs-4);font-weight:600;
  cursor:pointer;border:none;font-family:var(--font-en);
  background:var(--navy-700);color:var(--white);
  transition:all .2s;margin-top:6px;
}
.btn-primary:hover{background:var(--navy-600);transform:translateY(-1px);box-shadow:0 4px 14px rgba(29,45,90,.2);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}

/* Messages */
.msg{
  font-size:var(--fs-3);text-align:center;margin-top:12px;
  padding:9px;border-radius:7px;display:none;font-family:var(--font-zh);
}
.msg.success{background:var(--navy-50);color:var(--navy-700);border:1px solid var(--navy-100);}
.msg.error{background:var(--amber-50);color:var(--amber-700);border:1px solid #fde68a;}

/* Back link */
.back-link{
  text-align:center;margin-top:18px;font-size:var(--fs-3);color:var(--gray-400);
  font-family:var(--font-en);
}
.back-link a{color:var(--navy-500);text-decoration:none;}
.back-link a:hover{text-decoration:underline;}

/* Logged in view */
.user-info{text-align:center;}
.user-avatar{
  width:56px;height:56px;border-radius:50%;
  background:var(--navy-50);border:2px solid var(--navy-100);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-6);font-weight:700;color:var(--navy-600);
  margin:0 auto 10px;font-family:var(--font-en);
}
.user-email{font-size:var(--fs-3);color:var(--gray-500);margin-bottom:18px;font-family:var(--font-en);}
.btn-goto{
  display:block;width:100%;padding:10px;border-radius:8px;font-size:var(--fs-4);
  font-weight:500;cursor:pointer;border:1px solid var(--gray-200);
  background:var(--navy-50);color:var(--navy-700);
  font-family:var(--font-zh);transition:all .15s;text-align:center;
  text-decoration:none;margin-bottom:8px;
}
.btn-goto:hover{background:var(--navy-100);border-color:var(--navy-200,#c7d7fd);}
.btn-logout{
  width:100%;padding:10px;border-radius:8px;font-size:var(--fs-4);font-weight:500;
  cursor:pointer;border:1px solid var(--gray-200);background:var(--white);
  color:var(--gray-500);font-family:var(--font-zh);transition:all .15s;
}
.btn-logout:hover{border-color:#fecaca;color:var(--red-600);}

/* Loading */
#loading-view{text-align:center;padding:20px;color:var(--gray-400);font-size:var(--fs-3);font-family:var(--font-en);}
</style>
  <script src="/js/icons.js"></script>
</head>
<body>
<div class="container">

  <!-- Logo -->
  <div class="logo-wrap">
    <a href="/index.html" aria-label="VELA" style="display:inline-block;text-decoration:none;">
      <svg width="200" height="44" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(6,5) scale(0.62)">
          <path d="M 9 13 L 24 44 L 31.5 28.5" fill="none" stroke="#0B1F4D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="33" y="17" width="7" height="7" rx="1.2" fill="#147EFF"/>
          <rect x="36" y="11.5" width="6" height="6" rx="1" fill="#39D5FF"/>
          <rect x="39" y="6.5" width="5" height="5" rx="0.9" fill="#39D5FF"/>
        </g>
        <text x="42" y="27" font-family="'Poppins','DM Sans',-apple-system,system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="-1" fill="#0B1F4D">vela</text>
      </svg>
    </a>
  </div>
  <div class="subtitle">每日全球投資情報</div>

  <div class="card" id="auth-card">

    <!-- 載入中 -->
    <div id="loading-view">載入中...</div>

    <!-- 已登入 -->
    <div id="logged-in-view" style="display:none;">
      <div class="user-info">
        <div class="user-avatar" id="user-initial">U</div>
        <div id="user-email-display" class="user-email"></div>
        <a href="/pages/targets.html" class="btn-goto">✦ 前往會員專屬</a>
        <a href="/index.html" class="btn-goto"><span data-ico="chart"></span> 前往總覽</a>
        <button class="btn-logout" onclick="signOut()">登出</button>
      </div>
    </div>

    <!-- 未登入 -->
    <div id="logged-out-view" style="display:none;">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login',this)">登入</button>
        <button class="tab-btn" onclick="switchTab('signup',this)">註冊</button>
      </div>

      <!-- 登入 -->
      <div id="tab-login" class="tab-content active">
        <div class="form-group">
          <label>電子郵件</label>
          <input type="email" id="login-email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn-primary" onclick="signIn()">登入</button>
        <div style="text-align:center;margin-top:12px;">
          <a href="#" onclick="showForgot();return false;" style="font-size:var(--fs-3);color:var(--navy-600);text-decoration:none;">忘記密碼？</a>
        </div>
        <div class="msg" id="login-msg"></div>
      </div>

      <!-- 註冊 -->
      <div id="tab-signup" class="tab-content">
        <div class="form-group">
          <label>姓名 / 暱稱</label>
          <input type="text" id="signup-name" placeholder="您的稱呼" maxlength="40">
        </div>
        <div class="form-group">
          <label>手機號碼</label>
          <input type="tel" id="signup-phone" placeholder="0912345678" maxlength="20">
        </div>
        <div class="form-group">
          <label>生日</label>
          <input type="date" id="signup-birthday">
        </div>
        <div class="form-group">
          <label>電子郵件</label>
          <input type="email" id="signup-email" placeholder="your@email.com">
          <div class="field-hint">
            請使用真實有效的電子郵件，註冊後需收信點擊確認連結才能登入。
            <ul>
              <li>須為正確格式（含 @ 與網域，例：name@gmail.com）</li>
              <li>不支援測試／拋棄式信箱（如 example.com）</li>
            </ul>
          </div>
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input type="password" id="signup-password" placeholder="••••••••">
          <div class="field-hint">
            <ul>
              <li>至少 6 個字元</li>
              <li>區分大小寫；建議混用英文字母與數字</li>
            </ul>
          </div>
        </div>
        <div class="form-group">
          <label>確認密碼</label>
          <input type="password" id="signup-confirm" placeholder="••••••••">
          <div class="field-hint">需與上方密碼完全相同。</div>
        </div>
        <button class="btn-primary" onclick="signUp()">建立帳號</button>
        <div class="msg" id="signup-msg"></div>
      </div>
    </div>

    <!-- 忘記密碼 -->
    <div id="forgot-view" style="display:none;">
      <div class="form-group">
        <label>電子郵件</label>
        <input type="email" id="forgot-email" placeholder="your@email.com">
        <div class="field-hint">我們會寄送密碼重設連結到此信箱，點擊後即可設定新密碼。</div>
      </div>
      <button class="btn-primary" onclick="sendReset()">寄送重設連結</button>
      <div style="text-align:center;margin-top:12px;">
        <a href="#" onclick="backToLogin();return false;" style="font-size:var(--fs-3);color:var(--navy-600);text-decoration:none;">← 返回登入</a>
      </div>
      <div class="msg" id="forgot-msg"></div>
    </div>

    <!-- 設定新密碼（從信箱連結進入） -->
    <div id="reset-view" style="display:none;">
      <div class="form-group">
        <label>新密碼</label>
        <input type="password" id="reset-password" placeholder="至少 6 個字元">
      </div>
      <div class="form-group">
        <label>確認新密碼</label>
        <input type="password" id="reset-confirm" placeholder="再次輸入新密碼">
      </div>
      <button class="btn-primary" onclick="submitNewPassword()">更新密碼</button>
      <div class="msg" id="reset-msg"></div>
    </div>

  </div>

  <div class="back-link"><a href="/index.html">← 返回首頁</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 原有 Supabase auth 邏輯完整保留 -->
<script>
var SUPABASE_URL='https://eezhmeccakaeiprviqra.supabase.co';
var SUPABASE_KEY='sb_publishable_qb__g5BMRYLiV2Bin6b1Bw_LwmVARqM';
var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function switchTab(tab,btn){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(el){el.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}

function showMsg(id,text,type){
  var el=document.getElementById(id);
  el.textContent=text;
  el.className='msg '+type;
  el.style.display='block';
}

async function checkUser(){
  var session=await supabase.auth.getSession();
  var user=session.data.session?session.data.session.user:null;
  document.getElementById('loading-view').style.display='none';
  if(user){
    document.getElementById('logged-in-view').style.display='block';
    document.getElementById('user-email-display').textContent=user.email;
    document.getElementById('user-initial').textContent=user.email[0].toUpperCase();
  }else{
    document.getElementById('logged-out-view').style.display='block';
  }
}

async function signIn(){
  var email=document.getElementById('login-email').value.trim();
  var password=document.getElementById('login-password').value;
  if(!email||!password){showMsg('login-msg','請填寫所有欄位','error');return;}
  var btn=document.querySelector('#tab-login .btn-primary');
  btn.disabled=true;btn.textContent='登入中...';
  var result=await supabase.auth.signInWithPassword({email:email,password:password});
  if(result.error){
    showMsg('login-msg','登入失敗：'+result.error.message,'error');
    btn.disabled=false;btn.textContent='登入';
  }else{
    showMsg('login-msg','登入成功！跳轉中...','success');
    setTimeout(function(){window.location.href=(window.PX_postAuthDest?window.PX_postAuthDest():'/brief.html');},1000);
  }
}

function signupErrMsg(err){
  var m=((err&&err.message)||'').toLowerCase();
  if(m.includes('already registered')||m.includes('already been registered')||err.code==='user_already_exists') return '此電子郵件已被註冊，請改用「登入」或更換信箱';
  if(m.includes('password')&&m.includes('6')) return '密碼長度不足，至少需要 6 個字元';
  if(m.includes('password')&&(m.includes('weak')||m.includes('strength'))) return '密碼強度不足，請混用英文字母與數字';
  if(m.includes('invalid')&&m.includes('email')) return '此電子郵件無效或不被支援，請改用真實信箱（不支援測試／拋棄式網域）';
  if(m.includes('unable to validate email')) return '無法驗證此電子郵件，請確認格式正確';
  if(m.includes('rate limit')||m.includes('too many')) return '嘗試次數過多，請稍候幾分鐘再試';
  if(m.includes('database error')) return '系統暫時無法建立帳號，請稍後再試';
  return (err&&err.message)||'發生未知錯誤，請稍後再試';
}

async function signUp(){
  var name=document.getElementById('signup-name').value.trim();
  var phone=document.getElementById('signup-phone').value.trim();
  var birthday=document.getElementById('signup-birthday').value;
  var email=document.getElementById('signup-email').value.trim();
  var password=document.getElementById('signup-password').value;
  var confirm=document.getElementById('signup-confirm').value;
  if(!name||!phone||!birthday||!email||!password||!confirm){showMsg('signup-msg','請填寫所有欄位','error');return;}
  if(!/^[0-9+\-() ]{6,20}$/.test(phone)){showMsg('signup-msg','手機號碼格式不正確','error');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showMsg('signup-msg','電子郵件格式不正確，請輸入有效信箱（例：name@gmail.com）','error');return;}
  if(password.length<6){showMsg('signup-msg','密碼長度不足，至少需要 6 個字元','error');return;}
  if(password!==confirm){showMsg('signup-msg','兩次輸入的密碼不一致','error');return;}
  var btn=document.querySelector('#tab-signup .btn-primary');
  btn.disabled=true;btn.textContent='建立中...';
  var result=await supabase.auth.signUp({email:email,password:password,options:{data:{display_name:name,phone:phone,birthday:birthday}}});
  if(result.error){
    showMsg('signup-msg','註冊失敗：'+signupErrMsg(result.error),'error');
    btn.disabled=false;btn.textContent='建立帳號';
  }else{
    showMsg('signup-msg','✓ 註冊成功！請查看信箱確認連結','success');
    btn.disabled=false;btn.textContent='建立帳號';
  }
}

async function signOut(){
  await supabase.auth.signOut();
  window.location.reload();
}

// ── 忘記 / 重設密碼 ──────────────────────────────
function showForgot(){
  document.getElementById('logged-out-view').style.display='none';
  document.getElementById('forgot-view').style.display='block';
}
function backToLogin(){
  document.getElementById('forgot-view').style.display='none';
  document.getElementById('logged-out-view').style.display='block';
}
async function sendReset(){
  var email=document.getElementById('forgot-email').value.trim();
  if(!email){showMsg('forgot-msg','請輸入電子郵件','error');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showMsg('forgot-msg','電子郵件格式不正確','error');return;}
  var btn=document.querySelector('#forgot-view .btn-primary');
  btn.disabled=true;btn.textContent='寄送中...';
  var result=await supabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/pages/login.html'});
  btn.disabled=false;btn.textContent='寄送重設連結';
  if(result.error){
    showMsg('forgot-msg','寄送失敗：'+result.error.message,'error');
  }else{
    showMsg('forgot-msg','✓ 已寄送重設連結，請至信箱查收（含垃圾信匣）','success');
  }
}
async function submitNewPassword(){
  var p1=document.getElementById('reset-password').value;
  var p2=document.getElementById('reset-confirm').value;
  if(p1.length<6){showMsg('reset-msg','密碼至少需要 6 個字元','error');return;}
  if(p1!==p2){showMsg('reset-msg','兩次輸入的密碼不一致','error');return;}
  var btn=document.querySelector('#reset-view .btn-primary');
  btn.disabled=true;btn.textContent='更新中...';
  var result=await supabase.auth.updateUser({password:p1});
  if(result.error){
    showMsg('reset-msg','更新失敗：'+result.error.message,'error');
    btn.disabled=false;btn.textContent='更新密碼';
  }else{
    showMsg('reset-msg','✓ 密碼已更新，跳轉中...','success');
    setTimeout(function(){window.location.href=(window.PX_postAuthDest?window.PX_postAuthDest():'/brief.html');},1200);
  }
}

var recoveryMode=window.location.hash.indexOf('type=recovery')!==-1;
supabase.auth.onAuthStateChange(function(event){
  if(event==='PASSWORD_RECOVERY'){
    recoveryMode=true;
    document.getElementById('loading-view').style.display='none';
    document.getElementById('logged-in-view').style.display='none';
    document.getElementById('logged-out-view').style.display='none';
    document.getElementById('reset-view').style.display='block';
  }
});

if(recoveryMode){
  document.getElementById('loading-view').style.display='none';
  document.getElementById('reset-view').style.display='block';
}else{
  checkUser();
}
</script>
<script src="/shared/nav.js"></script>
<script src="/shared/footer.js"></script>
</body>
</html>
