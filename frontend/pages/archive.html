<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="/shared/footer.js"></script>
<link rel="stylesheet" href="/css/style.css">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7;
  --red-600:#dc2626; --red-100:#fee2e2;
  --amber-600:#d97706; --amber-100:#fef3c7;
  --font-en:'DM Sans',sans-serif;
  --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{background:radial-gradient(1120px 640px at 94% -14%, rgba(37,99,235,.46), transparent 64%),radial-gradient(940px 720px at -10% 4%, rgba(51,65,85,.40), transparent 64%),radial-gradient(820px 620px at 50% 118%, rgba(29,78,216,.28), transparent 66%),linear-gradient(160deg, #dbe2ef 0%, #f4f6fb 56%);background-attachment:fixed;color:var(--gray-900);font-family:var(--font-zh);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:10px;margin-right:36px;}
.header-nav{display:flex;align-items:center;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-sm);font-size:var(--fs-4);color:var(--gray-500);transition:all .15s;white-space:nowrap;font-family:var(--font-zh);}
.nav-item:hover{background:var(--navy-50);color:var(--navy-700);}
.nav-item.active{background:var(--navy-50);color:var(--navy-600);font-weight:500;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-400);opacity:0;}
.nav-item.active .nav-dot{opacity:1;}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--navy-50);color:var(--navy-600);font-size:var(--fs-2);font-weight:500;padding:3px 9px;border-radius:var(--r-xl);font-family:var(--font-en);}
.live-dot{width:5px;height:5px;background:var(--navy-600);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.header-time{font-family:var(--font-en);font-size:var(--fs-3);color:var(--gray-400);}
.btn-login{padding:7px 16px;background:var(--navy-700);color:var(--white);border-radius:var(--r-sm);font-size:var(--fs-3);font-weight:500;font-family:var(--font-en);}

/* ── LAYOUT ── */
.page{margin-top:56px;max-width:1200px;margin-left:auto;margin-right:auto;padding:28px 24px 60px;}
.page-header{margin-bottom:24px;}
.page-title{font-family:var(--font-display);font-size:var(--fs-7);color:var(--navy-950);}
.page-title-sub{font-size:var(--fs-3);color:var(--gray-400);margin-top:4px;font-family:var(--font-zh);}

.archive-layout{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start;}
@media(max-width:768px){.archive-layout{grid-template-columns:1fr;}}

/* ── DATE LIST ── */
.date-list-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card);position:sticky;top:72px;}
.date-list-header{padding:12px 16px;border-bottom:1px solid var(--gray-100);font-size:var(--fs-2);font-weight:600;color:var(--gray-500);letter-spacing:.06em;font-family:var(--font-en);}
.date-list{max-height:calc(100vh - 180px);overflow-y:auto;}
.date-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--gray-100);transition:all .15s;}
.date-item:last-child{border-bottom:none;}
.date-item:hover{background:var(--navy-50);}
.date-item.active{background:var(--navy-50);border-left:3px solid var(--navy-500);}
.di-date{font-family:var(--font-en);font-size:var(--fs-3);font-weight:500;color:var(--gray-700);}
.di-wd{font-size:var(--fs-2);color:var(--gray-400);font-family:var(--font-en);}

/* ── REPORT PANEL ── */
.report-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:28px 32px;box-shadow:var(--shadow-card);}
.report-date-badge{display:inline-flex;align-items:center;gap:8px;background:var(--navy-50);border:1px solid var(--navy-100);border-radius:var(--r-xl);padding:4px 14px;font-family:var(--font-en);font-size:var(--fs-3);font-weight:600;color:var(--navy-700);margin-bottom:20px;}

/* Tickers row */
.ticker-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--gray-100);}
.ticker-chip{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:8px 14px;min-width:90px;}
.tc-label{font-size:var(--fs-1);color:var(--gray-400);font-family:var(--font-en);letter-spacing:.04em;}
.tc-val{font-variant-numeric:tabular-nums;font-size:var(--fs-4);font-weight:600;color:var(--gray-900);font-family:var(--font-en);margin-top:2px;}
.tc-chg{font-variant-numeric:tabular-nums;font-size:var(--fs-2);font-family:var(--font-en);}
.tc-chg.up{color:var(--green-600);}
.tc-chg.down{color:var(--red-600);}

/* Morning brief */
.section-label{font-size:var(--fs-2);font-weight:600;color:var(--gray-400);letter-spacing:.06em;text-transform:uppercase;font-family:var(--font-en);margin-bottom:10px;}
.morning-brief-text{font-size:var(--fs-4);line-height:1.9;color:var(--gray-700);font-family:var(--font-zh);white-space:pre-wrap;}

/* Signals */
.signals-row{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 24px;padding-bottom:20px;border-bottom:1px solid var(--gray-100);}
.signal-chip{padding:6px 14px;border-radius:var(--r-xl);font-size:var(--fs-3);font-weight:500;font-family:var(--font-zh);}
.signal-chip.bull{background:var(--green-100);color:var(--green-700);}
.signal-chip.bear{background:var(--red-100);color:var(--red-600);}
.signal-chip.neutral{background:var(--gray-100);color:var(--gray-600);}

/* Opportunities */
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px;}
.opp-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:14px 16px;}
.oc-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.oc-ticker{font-family:var(--font-en);font-size:var(--fs-3);font-weight:700;color:var(--navy-700);}
.oc-conf{font-size:var(--fs-1);font-weight:600;padding:2px 7px;border-radius:3px;font-family:var(--font-en);}
.conf-HIGH{background:var(--navy-50);color:var(--navy-700);}
.conf-MED{background:#fef3c7;color:#92400e;}
.conf-LOW{background:var(--gray-100);color:var(--gray-500);}
.oc-thesis{font-size:var(--fs-3);color:var(--gray-600);font-family:var(--font-zh);line-height:1.55;}
.oc-target{font-variant-numeric:tabular-nums;font-size:var(--fs-2);color:var(--navy-600);font-family:var(--font-en);margin-top:4px;font-weight:500;}

/* Empty / loading */
.empty-state{text-align:center;padding:60px 0;color:var(--gray-400);font-size:var(--fs-3);font-family:var(--font-zh);}
</style>
  <script src="/js/icons.js"></script>
</head>
<body>

<header class="topbar">
  <a href="/" style="text-decoration:none;display:flex;align-items:center;"><div class="topbar-logo">
    <svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(6,5) scale(0.62)">
        <path d="M 9 13 L 24 44 L 31.5 28.5" fill="none" stroke="#0B1F4D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="33" y="17" width="7" height="7" rx="1.2" fill="#147EFF"/>
        <rect x="36" y="11.5" width="6" height="6" rx="1" fill="#39D5FF"/>
        <rect x="39" y="6.5" width="5" height="5" rx="0.9" fill="#39D5FF"/>
      </g>
      <text x="42" y="27" font-family="'Poppins','DM Sans',-apple-system,system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="-1" fill="#0B1F4D">vela</text>
    </svg>
  </div></a>
  <nav class="header-nav" data-active="archive"></nav>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    <span class="header-time" id="clock">—</span>
    <a href="/pages/login.html" class="btn-login">登入</a>
  </div>
</header>

<main class="page">
  <div class="page-header">
    <div class="page-title">歷史報告 <span style="font-family:var(--font-en);font-size:var(--fs-5);font-weight:400;color:var(--gray-400);">Archive</span></div>
    <div class="page-title-sub">過去 30 天每日 Brief 完整記錄</div>
  </div>

  <div class="archive-layout">

    <!-- Date list -->
    <div class="date-list-card">
      <div class="date-list-header">AVAILABLE DATES</div>
      <div class="date-list" id="date-list">
        <div class="empty-state">載入中...</div>
      </div>
    </div>

    <!-- Report panel -->
    <div id="report-panel">
      <div class="empty-state" style="padding:80px 0;">← 選擇左側日期查看當日報告</div>
    </div>

  </div>
</main>

<script>
function tick(){
  var t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  var el=document.getElementById('clock');if(el)el.textContent=t+' CST';
}
tick(); setInterval(tick,1000);

var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function fmtDate(s){
  var d = new Date(s+'T00:00:00');
  return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function weekday(s){
  return DAYS[new Date(s+'T00:00:00').getDay()];
}

var API = 'https://projectx-backend-o2pl.onrender.com';
var currentDate = null;
var accessToken = null;     // Supabase access token；是否付費由後端權威判定

async function loadDateList(){
  var list = document.getElementById('date-list');
  try {
    var res = await fetch('../data/history-index.json');
    if(!res.ok) throw new Error('index not found');
    var dates = await res.json();
    list.innerHTML = dates.map(function(d){
      return '<div class="date-item" data-date="'+d+'" onclick="loadReport(\''+d+'\')">'+
        '<div><div class="di-date">'+fmtDate(d)+'</div><div class="di-wd">'+weekday(d)+'</div></div>'+
        '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></svg>'+
      '</div>';
    }).join('');
    if(dates.length) loadReport(dates[0]);
  } catch(e){
    list.innerHTML = '<div class="empty-state">無法載入日期列表</div>';
  }
}

function renderLock(){
  return '<div class="report-card" style="text-align:center;padding:64px 32px;">'+
    '<div style="font-size:40px;margin-bottom:16px;color:var(--navy-400);">'+ICO.lock+'</div>'+
    '<div style="font-size:var(--fs-5);font-weight:600;color:var(--navy-900);font-family:var(--font-zh);margin-bottom:8px;">歷史報告為付費會員專屬</div>'+
    '<div style="font-size:var(--fs-4);color:var(--gray-500);font-family:var(--font-zh);line-height:1.7;max-width:420px;margin:0 auto 24px;">升級為付費會員即可解鎖過去 30 天每日 Brief 的完整內容——機會標的、機構研報、市場摘要與事件預判。</div>'+
    '<a href="/pages/credits.html" style="display:inline-block;padding:11px 28px;background:var(--navy-700);color:#fff;border-radius:var(--r-sm);font-size:var(--fs-4);font-weight:600;font-family:var(--font-zh);">升級看完整報告</a>'+
  '</div>';
}

var reportCache = {};   // 已載入的日期 → 報告內容，重複點擊免重新請求
async function loadReport(date){
  currentDate = date;
  document.querySelectorAll('.date-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.date === date);
  });
  var panel = document.getElementById('report-panel');
  // 未登入 → 顯示鎖頭，不發內容請求（是否付費由後端判定）
  if(!accessToken){
    panel.innerHTML = renderLock();
    return;
  }
  // 快取命中 → 立即渲染，不打後端
  if(reportCache[date]){ panel.innerHTML = renderReport(reportCache[date]); return; }
  panel.innerHTML = '<div class="empty-state">載入中...</div>';
  // 後端為 Render 免費方案，閒置後首次請求需喚醒，顯示提示避免看起來像當掉
  var slowTimer = setTimeout(function(){
    if(currentDate === date) panel.innerHTML = '<div class="empty-state">伺服器喚醒中，首次載入約需 20–30 秒，請稍候…</div>';
  }, 4000);
  try {
    var res = await fetch(API+'/history/'+date, { headers: { 'Authorization': 'Bearer '+(accessToken||'') } });
    clearTimeout(slowTimer);
    if(res.status === 403){ panel.innerHTML = renderLock(); return; }
    if(!res.ok) throw new Error('not found');
    var d = await res.json();
    reportCache[date] = d;
    if(currentDate === date) panel.innerHTML = renderReport(d);   // 使用者可能已切換日期，避免覆蓋
  } catch(e){
    clearTimeout(slowTimer);
    if(currentDate === date) panel.innerHTML = '<div class="empty-state">無法載入 '+date+' 的報告</div>';
  }
}

function renderReport(d){
  var html = '<div class="report-card">';

  // Date badge
  html += '<div class="report-date-badge">'+ICO.cal+' '+fmtDate(d.date)+' &nbsp;·&nbsp; '+weekday(d.date)+'</div>';

  // Tickers
  if(d.tickers && d.tickers.length){
    html += '<div class="ticker-row">';
    d.tickers.forEach(function(t){
      var dir = t.dir==='up'?'up':t.dir==='down'?'down':'';
      html += '<div class="ticker-chip">'+
        '<div class="tc-label">'+t.label+'</div>'+
        '<div class="tc-val">'+t.value+'</div>'+
        '<div class="tc-chg '+dir+'">'+(dir==='up'?'▲ ':dir==='down'?'▼ ':'')+t.change+'</div>'+
      '</div>';
    });
    html += '</div>';
  }

  // Signals
  if(d.signals && d.signals.length){
    html += '<div class="section-label">訊號雷達</div>';
    html += '<div class="signals-row">';
    d.signals.forEach(function(s){
      html += '<span class="signal-chip '+(s.signal||'neutral')+'">'+s.name+' · '+s.label+'</span>';
    });
    html += '</div>';
  }

  // Morning brief
  if(d.morning_brief){
    html += '<div class="section-label">每日摘要</div>';
    html += '<div class="morning-brief-text">'+escHtml(d.morning_brief)+'</div>';
  }

  // Opportunities
  if(d.opportunities && d.opportunities.length){
    html += '<div class="section-label" style="margin-top:24px;">機會標的</div>';
    html += '<div class="opp-grid">';
    d.opportunities.forEach(function(o){
      html += '<div class="opp-card">'+
        '<div class="oc-header">'+
          '<span class="oc-ticker">'+o.ticker+'</span>'+
          '<span class="oc-conf conf-'+(o.confidence||'MED')+'">'+o.confidence+'</span>'+
          '<span style="font-size:var(--fs-2);color:var(--gray-400);font-family:var(--font-zh);">'+o.name+'</span>'+
        '</div>'+
        '<div class="oc-thesis">'+escHtml(o.thesis||'')+'</div>'+
        (o.target?'<div class="oc-target">目標：'+o.target+'</div>':'')+
      '</div>';
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function escHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 日期清單獨立載入，不依賴 Supabase（即使 CDN/驗證失敗，清單仍會出現）
loadDateList();
// 預熱：頁面載入即喚醒 Render 後端，讓冷啟動與使用者瀏覽清單時間重疊
fetch(API + '/health').catch(function(){});
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/header-user.js"></script>
<script>
(function(){
  var SUPABASE_URL='https://eezhmeccakaeiprviqra.supabase.co';
  var SUPABASE_KEY='sb_publishable_qb__g5BMRYLiV2Bin6b1Bw_LwmVARqM';
  var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  function updateLoginBtn(session){
    var btn=document.querySelector('.btn-login');
    if(!btn) return;
    if(session&&session.user){
      btn.textContent='登出';btn.href='#';
      btn.onclick=function(e){e.preventDefault();sb.auth.signOut().then(function(){window.location.reload();});};
    } else {
      btn.textContent='登入';btn.href='/pages/login.html';btn.onclick=null;
    }
  }

  // 每次取得 session 狀態：更新 token + 登入鈕，並重渲染當前日期（幂等）
  // 付費與否交由後端 /history/:date 用 service key 權威判定
  function applyAuth(session){
    accessToken = (session && session.user) ? session.access_token : null;
    updateLoginBtn(session);
    if(currentDate) loadReport(currentDate);
  }

  // onAuthStateChange 會在載入時以 INITIAL_SESSION 觸發，並涵蓋登入/登出
  sb.auth.onAuthStateChange(function(event,session){ applyAuth(session); });
  // 保險：直接讀一次目前 session，避免事件時序遺漏
  sb.auth.getSession().then(function(s){ applyAuth(s.data?s.data.session:null); });
})();
</script>
