<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX — 市場日曆</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-base: #05060f;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --text-muted: #44445a;
      --accent-blue: #4da6ff;
      --accent-purple: #9f7aea;
      --accent-green: #48bb78;
      --accent-red: #fc8181;
      --accent-orange: #f6ad55;
      --accent-teal: #38b2ac;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(77,99,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 0%, rgba(159,122,234,0.06) 0%, transparent 50%);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,6,15,0.85);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4da6ff, #9f7aea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); padding-bottom: 2px; }
    .nav-right { display: flex; gap: 10px; align-items: center; }

    .btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .btn-glow { background: linear-gradient(135deg, #4da6ff, #9f7aea); color: #fff; box-shadow: 0 0 20px rgba(77,166,255,0.3); }
    .btn-glow:hover { box-shadow: 0 0 30px rgba(77,166,255,0.5); transform: translateY(-1px); }

    main { max-width: 1440px; margin: 0 auto; padding: 28px 40px 60px; }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
    .top-bar h1 { font-size: 20px; font-weight: 600; }
    .top-bar .meta { font-size: 12px; color: var(--text-muted); text-align: right; line-height: 1.8; }

    .calendar-layout { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .icon { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .icon-blue { background: rgba(77,166,255,0.15); }
    .icon-orange { background: rgba(246,173,85,0.15); }
    .icon-purple { background: rgba(159,122,234,0.15); }
    .icon-red { background: rgba(252,129,129,0.15); }

    .event-item {
      display: flex;
      gap: 14px;
      padding: 14px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin: 0 -6px;
    }

    .event-item:last-child { border-bottom: none; }
    .event-item:hover { background: rgba(255,255,255,0.02); }
    .event-item.open { background: rgba(255,255,255,0.02); }

    .event-date-col {
      min-width: 72px;
      text-align: center;
      padding-top: 2px;
    }

    .event-month { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .event-day { font-size: 26px; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
    .event-weekday { font-size: 10px; color: var(--text-muted); }
    .event-time-label { font-size: 10px; color: var(--accent-blue); margin-top: 4px; font-weight: 600; }

    .event-body { flex: 1; }

    .event-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
    .event-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
    .event-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .event-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }

    .impact-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .impact-high { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.2); }
    .impact-mid { background: rgba(246,173,85,0.08); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }
    .impact-low { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border); }

    .type-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .type-fed { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.15); }
    .type-earnings { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.15); }
    .type-data { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.15); }
    .type-tw { background: rgba(56,178,172,0.1); color: var(--accent-teal); border: 1px solid rgba(56,178,172,0.15); }
    .type-crypto { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.15); }
    .type-geo { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }

    .event-expand {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .event-item.open .event-expand {
      max-height: 250px;
      opacity: 1;
    }

    .expand-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px 0; }

    .expand-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .expand-cell-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 3px; font-weight: 600; }
    .expand-cell-value { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .expand-cell-value.green { color: var(--accent-green); font-weight: 600; }
    .expand-cell-value.blue { color: var(--accent-blue); font-weight: 600; }
    .expand-cell-value.orange { color: var(--accent-orange); }

    .expand-full {
      margin-top: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.02);
      border-radius: 6px;
      border-left: 2px solid var(--accent-blue);
    }

    .expand-full.watch { border-left-color: var(--accent-orange); }

    .expand-arrow { font-size: 14px; color: var(--text-muted); transition: transform 0.3s ease; flex-shrink: 0; align-self: flex-start; margin-top: 4px; }

    .today-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(77,166,255,0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(77,166,255,0.3);
    }

    .high-impact-item {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(252,129,129,0.15);
      background: rgba(252,129,129,0.04);
      transition: all 0.2s;
    }

    .high-impact-item:hover { background: rgba(252,129,129,0.07); }
    .high-impact-item:last-child { margin-bottom: 0; }

    .hi-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .hi-date { font-size: 10px; color: var(--accent-red); font-weight: 600; letter-spacing: 0.5px; }
    .hi-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .hi-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .future-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .future-item:last-child { border-bottom: none; }
    .future-date { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .future-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
    .future-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  </style>
</head>
<body>

  <nav>
    <div class="logo">PROJECT X</div>
    <ul class="nav-links">
      <li><a href="/index.html">總覽</a></li>
      <li><a href="/pages/market.html">市場</a></li>
      <li><a href="/pages/industry.html">產業</a></li>
      <li><a href="/pages/institutional.html">機構報告</a></li>
      <li><a href="/pages/calendar.html" class="active">市場日曆</a></li>
      <li><a href="/pages/targets.html">標的追蹤</a></li>
    </ul>
    <div class="nav-right">
      <button class="btn btn-ghost">登入</button>
      <button class="btn btn-glow">訂閱 Pro</button>
    </div>
  </nav>

  <main>
    <div class="top-bar">
      <div>
        <h1>市場日曆</h1>
        <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">央行決策 · 財報日期 · 重要數據 · 台股股務事件</div>
      </div>
      <div class="meta" id="cal-date"></div>
    </div>

    <div class="calendar-layout">
      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-blue">📅</div>近期重要事件</div>
          </div>
          <div id="events-list"></div>
        </div>
      </div>

      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-red">⚡</div>高影響力事件</div>
          </div>
          <div id="high-impact-list"></div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-purple">🔭</div>遠期預告</div>
          </div>
          <div id="future-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function toggleEvent(el) {
      const isOpen = el.classList.contains('open');
      document.querySelectorAll('.event-item.open').forEach(item => {
        item.classList.remove('open');
        const arrow = item.querySelector('.expand-arrow');
        if (arrow) arrow.style.transform = 'rotate(0deg)';
      });
      if (!isOpen) {
        el.classList.add('open');
        const arrow = el.querySelector('.expand-arrow');
        if (arrow) arrow.style.transform = 'rotate(90deg)';
      }
    }

    function formatEventDate(dateStr) {
      try {
        const d = new Date(dateStr + 'T00:00:00');
        const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
        const weekdays = ['日','一','二','三','四','五','六'];
        return {
          month: months[d.getMonth()],
          day: d.getDate(),
          weekday: `週${weekdays[d.getDay()]}`
        };
      } catch(e) {
        return { month: '--', day: '--', weekday: '--' };
      }
    }

    function getTypeLabel(type) {
      const map = { 'fed':'Fed', 'earnings':'財報', 'data':'數據', 'tw':'台股', 'crypto':'加密', 'geo':'地緣' };
      return map[type] || type;
    }

    function getImpactLabel(impact) {
      const map = { 'high':'🔴 高度關注', 'mid':'🟡 中度關注', 'low':'⚪ 一般關注' };
      return map[impact] || impact;
    }

    async function loadData() {
      const res = await fetch('../data/daily.json');
      const data = await res.json();
      const today = data.date;

      const d = new Date(today + 'T00:00:00');
      document.getElementById('cal-date').innerHTML =
        d.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) +
        '<br>UTC+8 台北時間';

      if (data.calendar?.events) {
        document.getElementById('events-list').innerHTML = data.calendar.events.map(e => {
          const dt = formatEventDate(e.date);
          const isToday = e.date === today;

          return `
          <div class="event-item" onclick="toggleEvent(this)">
            <div class="event-date-col">
              <div class="event-month">${dt.month}</div>
              <div class="event-day">${dt.day}</div>
              <div class="event-weekday">${dt.weekday}</div>
              ${e.time ? `<div class="event-time-label">${e.time}</div>` : ''}
            </div>
            <div class="event-body">
              <div class="event-title-row">
                <span class="type-badge type-${e.type}">${getTypeLabel(e.type)}</span>
                ${isToday ? '<span class="today-badge">今日</span>' : ''}
                <span class="event-title">${e.title}</span>
              </div>
              <div class="event-desc">${e.desc}</div>
              <div class="event-expand">
                <div class="expand-divider"></div>
                <div class="expand-grid">
                  <div>
                    <div class="expand-cell-label">市場預期</div>
                    <div class="expand-cell-value green">${e.expect || '—'}</div>
                  </div>
                  <div>
                    <div class="expand-cell-label">前次數值</div>
                    <div class="expand-cell-value">${e.prev || '—'}</div>
                  </div>
                  <div>
                    <div class="expand-cell-label">受影響標的</div>
                    <div class="expand-cell-value blue">${e.affect_assets || '—'}</div>
                  </div>
                  <div>
                    <div class="expand-cell-label">影響程度</div>
                    <div class="expand-cell-value orange">${getImpactLabel(e.impact)}</div>
                  </div>
                </div>
                ${e.watch ? `
                <div class="expand-full watch" style="margin-top:10px;">
                  <div class="expand-cell-label" style="margin-bottom:4px;">持續觀察</div>
                  <div class="expand-cell-value">${e.watch}</div>
                </div>` : ''}
              </div>
            </div>
            <div class="expand-arrow">›</div>
          </div>`;
        }).join('');
      }

      if (data.calendar?.high_impact) {
        document.getElementById('high-impact-list').innerHTML = data.calendar.high_impact.map(e => `
          <div class="high-impact-item">
            <div class="hi-header">
              <div class="hi-date">📍 ${e.date}</div>
              <span class="impact-badge impact-${e.impact}">${e.impact === 'high' ? '高影響' : '中影響'}</span>
            </div>
            <div class="hi-title">${e.title}</div>
            <div class="hi-desc">${e.desc}</div>
          </div>
        `).join('');
      }

      if (data.calendar?.future) {
        document.getElementById('future-list').innerHTML = data.calendar.future.map(e => `
          <div class="future-item">
            <div class="future-date">${e.date}</div>
            <div class="future-title">${e.title}</div>
            <div class="future-desc">${e.desc}</div>
          </div>
        `).join('');
      }
    }

    loadData();
  </script>
</body>
</html>
