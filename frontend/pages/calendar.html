<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project X · 市場日曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7;
  --red-600:#dc2626; --red-100:#fee2e2;
  --amber-700:#b45309; --amber-600:#d97706; --amber-100:#fef3c7;
  --purple-700:#6d28d9; --purple-600:#7c3aed; --purple-100:#ede9fe;
  --blue-600:#2563eb; --blue-100:#dbeafe;
  --orange-600:#ea580c; --orange-100:#ffedd5;
  --font-en:'DM Sans',sans-serif;
  --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
  --shadow-hover:0 4px 24px rgba(15,23,42,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{background:radial-gradient(1120px 640px at 94% -14%, rgba(37,99,235,.46), transparent 64%),radial-gradient(940px 720px at -10% 4%, rgba(51,65,85,.40), transparent 64%),radial-gradient(820px 620px at 50% 118%, rgba(29,78,216,.28), transparent 66%),linear-gradient(160deg, #dbe2ef 0%, #f4f6fb 56%);background-attachment:fixed;color:var(--gray-900);font-family:var(--font-zh);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:10px;margin-right:36px;}
.logo-mark{width:32px;height:32px;background:var(--navy-700);border-radius:8px;display:grid;place-items:center;flex-shrink:0;transition:transform .3s;}
.logo-mark:hover{transform:rotate(45deg) scale(1.05);}
.logo-main{font-family:var(--font-en);font-size:13.5px;font-weight:600;color:var(--navy-800);letter-spacing:.05em;}
.logo-sub{font-size:9.5px;color:var(--gray-400);letter-spacing:.08em;font-family:var(--font-en);}
.header-nav{display:flex;align-items:center;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-sm);font-size:13.5px;color:var(--gray-500);transition:all .15s;white-space:nowrap;font-family:var(--font-zh);}
.nav-item:hover{background:var(--navy-50);color:var(--navy-700);}
.nav-item.active{background:var(--navy-50);color:var(--navy-600);font-weight:500;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-400);opacity:0;}
.nav-item.active .nav-dot{opacity:1;}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green-100);color:var(--green-600);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:var(--font-en);}
.live-dot{width:5px;height:5px;background:var(--green-600);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.header-time{font-family:var(--font-en);font-size:12px;color:var(--gray-400);}
.btn-login{padding:7px 16px;background:var(--navy-700);color:var(--white);border-radius:var(--r-sm);font-size:13px;font-weight:500;font-family:var(--font-en);}

/* ── PAGE ── */
.page{margin-top:56px;max-width:1280px;margin-left:auto;margin-right:auto;padding:28px 24px 60px;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;}
.page-title{font-family:var(--font-display);font-size:28px;color:var(--navy-950);}
.page-title-sub{font-family:var(--font-zh);font-size:13px;font-weight:300;color:var(--gray-400);margin-top:4px;}
.page-update{font-size:11.5px;color:var(--gray-400);font-family:var(--font-en);}

/* ── FILTER ROW ── */
.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.filter-chip{font-size:12px;padding:6px 14px;border-radius:20px;border:1px solid var(--gray-200);color:var(--gray-500);background:var(--white);cursor:pointer;transition:all .15s;font-family:var(--font-zh);display:flex;align-items:center;gap:5px;}
.filter-chip:hover{border-color:var(--navy-300);color:var(--navy-600);}
.filter-chip.active{background:var(--navy-700);border-color:var(--navy-700);color:var(--white);font-weight:500;}
.filter-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ── MAIN LAYOUT ── */
.cal-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}

/* ── TIMELINE ── */
.timeline{display:flex;flex-direction:column;gap:0;}

/* Date group header */
.date-group{margin-bottom:6px;}
.date-group-header{display:flex;align-items:center;gap:12px;padding:10px 0 8px;position:sticky;top:56px;background:#f7f8fc;z-index:10;}
.dg-date-pill{background:var(--navy-700);color:var(--white);font-family:var(--font-en);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;letter-spacing:.04em;flex-shrink:0;}
.dg-date-pill.today{background:var(--navy-500);}
.dg-date-pill.past{background:var(--gray-400);}
.dg-weekday{font-size:12px;color:var(--gray-400);font-family:var(--font-en);letter-spacing:.04em;}
.dg-today-badge{font-size:10px;font-weight:600;color:var(--navy-500);background:var(--navy-50);border:1px solid var(--navy-100);border-radius:4px;padding:2px 7px;font-family:var(--font-en);}
.dg-line{flex:1;height:1px;background:var(--gray-200);}

/* Event card */
.event-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:13px 16px;margin-bottom:6px;display:flex;gap:14px;align-items:flex-start;transition:all .15s;cursor:default;box-shadow:var(--shadow-card);}
.event-card:hover{border-color:var(--navy-300);box-shadow:var(--shadow-hover);}
.event-card.done{opacity:.55;}
.event-card.done .ec-title{text-decoration:line-through;color:var(--gray-400);}
.event-card.high-impact{border-left:3px solid var(--red-600);}
.event-card.med-impact{border-left:3px solid var(--amber-600);}
.event-card.low-impact{border-left:3px solid var(--green-600);}

/* Type dot */
.ec-type-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}

.ec-content{flex:1;min-width:0;}
.ec-meta{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap;}
.ec-type-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;font-family:var(--font-en);letter-spacing:.04em;}
.ec-time{font-size:11px;color:var(--gray-400);font-family:var(--font-en);}
.ec-market{font-size:10px;color:var(--gray-400);font-family:var(--font-en);letter-spacing:.04em;}
.ec-title{font-size:13.5px;font-weight:500;color:var(--gray-800);font-family:var(--font-zh);line-height:1.45;margin-bottom:3px;}
.ec-desc{font-size:12px;color:var(--gray-500);font-family:var(--font-zh);line-height:1.55;font-weight:300;}
.ec-tickers{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.ec-ticker{font-family:var(--font-en);font-size:10px;font-weight:600;padding:1px 7px;background:var(--gray-100);color:var(--navy-700);border-radius:3px;border:1px solid var(--gray-200);}

.ec-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.ec-impact-label{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:3px;font-family:var(--font-en);letter-spacing:.04em;}
.impact-high{background:var(--red-100);color:var(--red-600);}
.impact-med{background:var(--amber-100);color:var(--amber-700);}
.impact-low{background:var(--green-100);color:var(--green-700);}
.impact-info{background:var(--gray-100);color:var(--gray-500);}
.ec-done-badge{font-size:10px;color:var(--gray-400);font-family:var(--font-en);}
.ec-data-row{display:flex;gap:0;margin-top:8px;border:1px solid var(--gray-200);border-radius:var(--r-sm);overflow:hidden;}
.ec-data-cell{flex:1;padding:6px 10px;background:var(--gray-50);border-right:1px solid var(--gray-200);text-align:center;}
.ec-data-cell:last-child{border-right:none;}
.ec-data-actual{background:var(--navy-50);}
.ec-data-label{display:block;font-size:10px;color:var(--gray-400);font-family:var(--font-en);letter-spacing:.04em;margin-bottom:2px;}
.ec-data-val{font-size:13px;font-weight:600;color:var(--navy-800);font-family:var(--font-en);}
.ec-data-published{color:var(--green-600);}
.ec-data-pending{color:var(--gray-400);font-weight:400;font-size:11px;}

/* Sidebar econ data card */
.econ-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100);}
.econ-item:last-child{border-bottom:none;}
.econ-item-left{flex-shrink:0;width:34px;text-align:center;}
.econ-item-dot{width:6px;height:6px;border-radius:50%;margin:0 auto 4px;flex-shrink:0;}
.econ-item-day{font-family:var(--font-en);font-size:14px;font-weight:700;color:var(--navy-700);line-height:1;}
.econ-item-mon{font-family:var(--font-en);font-size:9px;color:var(--gray-400);letter-spacing:.06em;text-transform:uppercase;}
.econ-item-body{flex:1;min-width:0;}
.econ-item-meta{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.econ-item-badge{font-family:var(--font-en);font-size:9px;font-weight:600;letter-spacing:.05em;padding:1px 6px;border-radius:3px;}
.econ-item-tag-today{background:#fef3c7;color:#92400e;}
.econ-item-tag-yesterday{background:#f0fdf4;color:#166534;}
.econ-item-title{font-size:12.5px;font-weight:500;color:var(--gray-800);font-family:var(--font-zh);margin-bottom:6px;line-height:1.4;}
.econ-data-strip{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--gray-200);}
.econ-data-col{flex:1;padding:5px 4px;text-align:center;background:var(--gray-50);border-right:1px solid var(--gray-200);}
.econ-data-col:last-child{border-right:none;}
.econ-data-col.has-act{background:#f0fdf4;}
.econ-data-lbl{display:block;font-family:var(--font-en);font-size:8.5px;font-weight:600;letter-spacing:.06em;color:var(--gray-400);margin-bottom:2px;}
.econ-data-num{font-size:11px;font-weight:600;color:var(--navy-800);display:block;line-height:1.35;word-break:break-word;overflow-wrap:anywhere;}
.econ-data-act{color:#16a34a;}
.econ-data-tbd{color:var(--gray-400);font-weight:400;font-size:10px;}

/* Type badge colors */
.t-fed{background:#dbeafe;color:#1d4ed8;}
.t-econ{background:#f0fdf4;color:#166534;}
.t-earnings{background:#fef3c7;color:#92400e;}
.t-tw{background:#fdf4ff;color:#7e22ce;}
.t-crypto{background:#fff7ed;color:#9a3412;}
.t-opex{background:#fce7f3;color:#9d174d;}
.t-macro{background:#eff6ff;color:#1d4ed8;}
.t-call{background:#e0f2fe;color:#0369a1;}
.t-agm{background:#ede9fe;color:#6d28d9;}
.t-ipo{background:#fef9c3;color:#854d0e;}

/* ── SIDEBAR ── */
.sidebar-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-card);margin-bottom:14px;}
.sc-title{font-size:13px;font-weight:600;color:var(--gray-900);font-family:var(--font-zh);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.sc-title-en{font-family:var(--font-en);font-size:10px;font-weight:400;color:var(--gray-400);letter-spacing:.05em;}

/* Legend */
.legend-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--gray-100);}
.legend-row:last-child{border-bottom:none;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.legend-label{font-size:12px;color:var(--gray-600);font-family:var(--font-zh);}
.legend-count{font-size:11px;color:var(--gray-400);font-family:var(--font-en);margin-left:auto;}

/* This week summary */
.week-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100);}
.week-item:last-child{border-bottom:none;}
.wi-date{font-family:var(--font-en);font-size:11px;font-weight:600;color:var(--navy-700);width:44px;flex-shrink:0;padding-top:1px;}
.wi-text{font-size:12px;color:var(--gray-600);font-family:var(--font-zh);line-height:1.5;}

/* Countdown */
.countdown-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100);}
.countdown-item:last-child{border-bottom:none;}
.ci-left{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.ci-name{font-size:12.5px;color:var(--gray-700);font-family:var(--font-zh);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci-date{font-size:10.5px;color:var(--gray-400);font-family:var(--font-en);}
.ci-days{font-family:var(--font-en);font-size:13px;font-weight:600;color:var(--navy-700);}
.ci-days.soon{color:var(--red-600);}

@media(max-width:1024px){.cal-layout{grid-template-columns:1fr;}}
@media(max-width:768px){.header-nav{display:none;}}

/* ── MONTHLY CALENDAR GRID ── */
.month-cal-wrap {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--r-xl);
  padding: 20px 22px 16px;
  box-shadow: var(--shadow-card);
  margin-bottom: 22px;
}

.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.month-nav-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  color: var(--gray-500);
  font-size: 14px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all .15s;
}
.month-nav-btn:hover { background: var(--gray-100); color: var(--gray-900); }

.month-title {
  font-family: var(--font-en);
  font-size: 15px;
  font-weight: 600;
  color: var(--gray-900);
  letter-spacing: .02em;
}

.month-title em {
  font-style: normal;
  color: var(--navy-600);
}

/* Weekday headers */
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 6px;
}

.cal-wd {
  text-align: center;
  font-family: var(--font-en);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--gray-400);
  letter-spacing: .06em;
  padding: 4px 0;
}

.cal-wd:first-child { color: #ef4444; } /* SUN */
.cal-wd:last-child  { color: #6366f1; } /* SAT */

/* Day grid */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
  position: relative;
  min-height: 36px;
}

.cal-day:hover:not(.cal-day-empty):not(.cal-day-today) {
  background: var(--navy-50);
}

.cal-day-empty { cursor: default; }

.cal-day-num {
  font-family: var(--font-en);
  font-size: 13px;
  font-weight: 500;
  color: var(--gray-700);
  line-height: 1;
}

.cal-day.sun .cal-day-num { color: #ef4444; }
.cal-day.sat .cal-day-num { color: #6366f1; }
.cal-day.other-month .cal-day-num { color: var(--gray-300); }
.cal-day.past .cal-day-num { color: var(--gray-400); }

/* Today circle */
.cal-day-today {
  background: var(--navy-600) !important;
  border-radius: 10px;
}
.cal-day-today .cal-day-num { color: var(--white) !important; font-weight: 700; }

/* Has-event dots */
.cal-day-dots {
  display: flex;
  gap: 2px;
  margin-top: 3px;
  height: 5px;
  align-items: center;
}

.cal-event-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Active (clicked) state */
.cal-day.selected:not(.cal-day-today) {
  background: var(--navy-50);
  border: 1.5px solid var(--navy-300);
}

/* Impact legend strip under calendar */
.cal-legend-strip {
  display: flex;
  gap: 14px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--gray-100);
  flex-wrap: wrap;
}
.cls-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  color: var(--gray-500);
  font-family: var(--font-en);
}
.cls-dot { width: 6px; height: 6px; border-radius: 50%; }


/* ── COMPACT SIDEBAR CALENDAR ── */
.sc-cal-wrap {
  margin-top: 0;
}
.sc-cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.sc-cal-nav-btn {
  width: 22px; height: 22px;
  border-radius: 5px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  color: var(--gray-500);
  font-size: 12px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all .15s;
}
.sc-cal-nav-btn:hover { background: var(--gray-100); }
.sc-cal-month-title {
  font-family: var(--font-en);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--gray-800);
}
.sc-cal-month-title em { font-style: normal; color: var(--navy-600); }
.sc-cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 3px;
}
.sc-cal-wd {
  text-align: center;
  font-family: var(--font-en);
  font-size: 9px;
  font-weight: 600;
  color: var(--gray-400);
  letter-spacing: .04em;
  padding: 2px 0;
}
.sc-cal-wd:first-child { color: #ef4444; }
.sc-cal-wd:last-child  { color: #6366f1; }
.sc-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
}
.sc-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  cursor: default;
  transition: background .12s;
  position: relative;
  min-height: 0;
}
.sc-day.has-event { cursor: pointer; }
.sc-day.has-event:hover:not(.sc-day-today) { background: var(--navy-50); }
.sc-day-num {
  font-family: var(--font-en);
  font-size: 10.5px;
  font-weight: 400;
  color: var(--gray-600);
  line-height: 1;
}
.sc-day.sun .sc-day-num { color: #ef4444; }
.sc-day.sat .sc-day-num { color: #6366f1; }
.sc-day.other-month .sc-day-num { color: var(--gray-300); }
.sc-day.past-day .sc-day-num { color: var(--gray-400); }
.sc-day-today { background: var(--navy-600) !important; border-radius: 6px; }
.sc-day-today .sc-day-num { color: var(--white) !important; font-weight: 700; }
.sc-day.selected:not(.sc-day-today) {
  background: var(--navy-50);
  border: 1px solid var(--navy-300);
}
.sc-day-dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  margin-top: 2px;
}


.logo-link{transition:opacity .2s,transform .2s;display:inline-flex;}
.logo-link:hover{opacity:.75;transform:scale(1.04);}

<script>
// Clock
function tick(){
  const t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  document.getElementById('clock').textContent=t+' CST';
}
tick(); setInterval(tick,1000);

// ── CALENDAR DATA ──
let CAL_EVENTS = {}; // populated from daily.json via loadCalendarData()

const TYPE_COLOR = {
  fed:'#3b82f6', econ:'#16a34a', data:'#16a34a',
  earnings:'#d97706', earn:'#d97706', call:'#0369a1',
  agm:'#6d28d9', ipo:'#d97706',
  tw:'#7c3aed', corp:'#7c3aed', crypto:'#ea580c'
};
const IMPACT_COLOR = {high:'#dc2626', med:'#d97706', low:'#16a34a'};
const MONTH_NAMES = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];

const TODAY=new Date();TODAY.setHours(0,0,0,0);
let currentYear=TODAY.getFullYear(), currentMonth=TODAY.getMonth();

function buildCalendar(year,month){
  const grid=document.getElementById('sc-cal-grid');
  const titleEl=document.getElementById('sc-month-title');
  if(!grid||!titleEl) return;
  grid.innerHTML='';
  titleEl.innerHTML='<em>'+MONTH_NAMES[month].slice(0,3)+'</em> '+year;

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();

  for(let i=0;i<firstDay;i++){
    grid.appendChild(makeDay(year,month-1,daysInPrev-firstDay+1+i,true));
  }
  for(let d=1;d<=daysInMonth;d++){
    grid.appendChild(makeDay(year,month,d,false));
  }
  const total=firstDay+daysInMonth;
  const rem=total%7===0?0:7-(total%7);
  for(let d=1;d<=rem;d++) grid.appendChild(makeDay(year,month+1,d,true));
}

function makeDay(year,month,day,isOther){
  const cell=document.createElement('div');
  cell.className='sc-day';

  const rm=((month%12)+12)%12;
  const ry=year+Math.floor(month/12);
  const dow=new Date(ry,rm,day).getDay();
  if(dow===0) cell.classList.add('sun');
  if(dow===6) cell.classList.add('sat');
  if(isOther) cell.classList.add('other-month');

  const dateKey=`${ry}-${String(rm+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const cellDate=new Date(ry,rm,day);
  const isToday=cellDate.getTime()===TODAY.getTime();
  const isPast=cellDate<TODAY&&!isToday;

  if(isToday)  cell.classList.add('sc-day-today');
  if(isPast&&!isOther) cell.classList.add('past-day');

  const numEl=document.createElement('div');
  numEl.className='sc-day-num';
  numEl.textContent=day;
  cell.appendChild(numEl);

  const evs=CAL_EVENTS[dateKey];
  if(evs&&evs.length>0&&!isOther){
    cell.classList.add('has-event');
    // Single dot: highest impact color
    const sorted=[...evs].sort((a,b)=>({high:0,med:1,low:2}[a.impact]-{high:0,med:1,low:2}[b.impact]));
    const dot=document.createElement('div');
    dot.className='sc-day-dot';
    dot.style.background=sorted[0].impact==='high'?IMPACT_COLOR.high:TYPE_COLOR[sorted[0].type]||'#94a3b8';
    cell.appendChild(dot);

    cell.addEventListener('click',()=>{
      scrollToDate(dateKey);
      document.querySelectorAll('.sc-day.selected').forEach(el=>el.classList.remove('selected'));
      cell.classList.add('selected');
    });
  }
  return cell;
}

function changeMonth(delta){
  currentMonth+=delta;
  if(currentMonth>11){currentMonth=0;currentYear++;}
  if(currentMonth<0) {currentMonth=11;currentYear--;}
  buildCalendar(currentYear,currentMonth);
}

function scrollToDate(dateKey){
  const parts=dateKey.split('-');
  const code=parts[1]+parts[2];
  const group=document.querySelector('.date-group[data-date="'+code+'"]');
  if(group){
    group.scrollIntoView({behavior:'smooth',block:'start'});
    group.style.transition='background .3s';
    group.style.background='var(--navy-50)';
    setTimeout(()=>{group.style.background='';},1200);
  }
}

buildCalendar(currentYear,currentMonth);

// Filter
function initDateWindow(){
  const today=new Date();today.setHours(0,0,0,0);
  const yesterday=new Date(today); yesterday.setDate(today.getDate()-1);
  const future60=new Date(today); future60.setDate(today.getDate()+60);
  document.querySelectorAll('.date-group').forEach(function(group){
    const code=group.getAttribute('data-date');
    if(!code) return;
    const month=parseInt(code.slice(0,2))-1;
    const day=parseInt(code.slice(2,4));
    const year=code.length===8?parseInt(code.slice(4,8)):2026;
    const d=new Date(year,month,day);
    if(d<yesterday||d>future60) group.style.display='none';
  });
}
initDateWindow();

function filterEvents(type,el){
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.event-card').forEach(card=>{
    let show=false;
    if(type==='all') show=true;
    else if(type==='high') show=card.dataset.impact==='high';
    else show=card.dataset.type===type;
    card.style.display=show?'':'none';
  });
  document.querySelectorAll('.date-group').forEach(group=>{
    const visible=Array.from(group.querySelectorAll('.event-card')).some(c=>c.style.display!=='none');
    group.style.display=visible?'':'none';
  });
}

// ── DYNAMIC DATA ──────────────────────────────────────
function checkDataStaleness(dateStr){var today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date());if(dateStr&&dateStr!==today){var b=document.getElementById('stale-banner');if(b){b.style.display='flex';b.querySelector('.stale-date').textContent=dateStr;}}}

async function loadCalendarData(){
  try{
    var res = await fetch('../data/daily.json?t='+Date.now());
    var data = await res.json();
    checkDataStaleness(data.date);

    var cal = data.calendar || {};
    var allEvents = (cal.events||[]);

    // 更新日期顯示
    var d = new Date(data.date);
    var dateEl = document.querySelector('.page-update');
    if(dateEl) dateEl.textContent = '更新於 '+d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'})+' · UTC+8';

    if(!allEvents.length) return;

    // 按日期分組
    var groups = {};
    allEvents.forEach(function(ev){
      var key = ev.date || '';
      if(!key) return;
      if(!groups[key]) groups[key] = [];
      groups[key].push(ev);
    });

    // 排序日期
    var sortedDates = Object.keys(groups).sort();
    var todayStr = data.date;

    // type → CSS class / color / badge
    function typeInfo(type){
      var map = {
        'data':  {cls:'econ',   color:'#16a34a', badge:'總經數據'},
        'econ':  {cls:'econ',   color:'#16a34a', badge:'總經數據'},
        'fed':   {cls:'fed',    color:'#2563eb', badge:'央行'},
        'earnings':{cls:'earnings',color:'#d97706',badge:'財報'},
        'call':  {cls:'call',   color:'#0369a1', badge:'法說會'},
        'agm':   {cls:'agm',    color:'#6d28d9', badge:'股東會'},
        'ipo':   {cls:'ipo',    color:'#d97706', badge:'IPO'},
        'tw':    {cls:'tw',     color:'#7c3aed', badge:'台股事件'},
        'corp':  {cls:'tw',     color:'#7c3aed', badge:'企業事件'},
        'holiday':{cls:'tw',   color:'#94a3b8', badge:'休市'},
      };
      return map[(type||'').toLowerCase()] || {cls:'econ', color:'#64748b', badge:'事件'};
    }

    function impactClass(impact){
      var m = {'high':'high-impact','med':'med-impact','mid':'med-impact','low':'low-impact'};
      return m[(impact||'').toLowerCase()] || 'low-impact';
    }
    function impactLabel(impact){
      var m = {'high':'HIGH','med':'MED','mid':'MED','low':'LOW'};
      return m[(impact||'').toLowerCase()] || 'INFO';
    }
    function impactLabelClass(impact){
      var m = {'high':'impact-high','med':'impact-med','mid':'impact-med','low':'impact-low'};
      return m[(impact||'').toLowerCase()] || 'impact-info';
    }

    function weekday(dateStr){
      var days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
      var d=new Date(dateStr+'T00:00:00');
      return days[d.getDay()];
    }
    function datePill(dateStr){
      var months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      var d=new Date(dateStr+'T00:00:00');
      return months[d.getMonth()]+' '+d.getDate();
    }
    function isPast(dateStr){ return dateStr < todayStr; }
    function isToday(dateStr){ return dateStr === todayStr; }

    function renderEvent(ev){
      var ti = typeInfo(ev.type);
      var ic = impactClass(ev.impact);
      var il = impactLabel(ev.impact);
      var ilc = impactLabelClass(ev.impact);
      var past = isPast(ev.date) ? ' done' : '';
      var tickers = (ev.affect_assets||'').split(',').filter(Boolean).map(function(t){
        return '<span class="ec-ticker">'+t.trim()+'</span>';
      }).join('');
      return '<div class="event-card '+ic+past+'" data-type="'+ti.cls+'" data-impact="'+(ev.impact||'low').toLowerCase()+'">'+
        '<span class="ec-type-dot" style="background:'+ti.color+'"></span>'+
        '<div class="ec-content">'+
          '<div class="ec-meta">'+
            '<span class="ec-type-badge t-'+ti.cls+'">'+ti.badge+'</span>'+
            (ev.market?'<span class="ec-market">'+ev.market+'</span>':'')+
            (ev.time?'<span class="ec-time">'+ev.time+'</span>':'')+
          '</div>'+
          '<div class="ec-title">'+ev.title+'</div>'+
          (ev.desc?'<div class="ec-desc">'+ev.desc+'</div>':'')+
          (tickers?'<div class="ec-tickers">'+tickers+'</div>':'')+
          ((ev.type==='data'||ev.type==='econ'||ev.type==='fed')?
            '<div class="ec-data-row">'+
              '<div class="ec-data-cell"><span class="ec-data-label">前值</span><span class="ec-data-val">'+(ev.prev||'—')+'</span></div>'+
              '<div class="ec-data-cell"><span class="ec-data-label">預期</span><span class="ec-data-val">'+(ev.expect||'—')+'</span></div>'+
              '<div class="ec-data-cell ec-data-actual"><span class="ec-data-label">當期</span><span class="ec-data-val '+(ev.actual?'ec-data-published':'ec-data-pending')+'">'+(ev.actual||'待公布')+'</span></div>'+
            '</div>':'')+
          (ev.watch?'<div class="ec-desc" style="color:var(--amber-700);font-size:12px;">👁 觀察：'+ev.watch+'</div>':'')+
        '</div>'+
        '<div class="ec-right">'+
          '<span class="ec-impact-label '+ilc+'">'+il+'</span>'+
          (past?'<span class="ec-done-badge">✓ done</span>':'')+
        '</div>'+
      '</div>';
    }

    // 建立 timeline HTML
    var html = '';
    sortedDates.forEach(function(dateStr){
      var evs = groups[dateStr];
      var pillClass = isToday(dateStr)?'today':isPast(dateStr)?'past':'';
      html += '<div class="date-group" data-date="'+dateStr.replace(/-/g,'')+'">';
      html += '<div class="date-group-header">'+
        '<span class="dg-date-pill '+pillClass+'">'+datePill(dateStr)+'</span>'+
        '<span class="dg-weekday">'+weekday(dateStr)+'</span>'+
        (isToday(dateStr)?'<span class="dg-today-badge">TODAY</span>':'')+
        '<span class="dg-line"></span>'+
      '</div>';
      evs.forEach(function(ev){ html += renderEvent(ev); });
      html += '</div>';
    });

    var timeline = document.getElementById('timeline');
    if(timeline){
      if(html){
        timeline.innerHTML = html;
      } else {
        timeline.innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--gray-400);font-size:13px;font-family:var(--font-en);">今日暫無日曆事件</div>';
      }
    }

    // 動態更新 mini calendar 的事件標記
    CAL_EVENTS = {};
    allEvents.forEach(function(ev){
      if(!CAL_EVENTS[ev.date]) CAL_EVENTS[ev.date] = [];
      CAL_EVENTS[ev.date].push({type: ev.type, impact: ev.impact||'low'});
    });
    buildCalendar(currentYear, currentMonth);

    // 動態更新 sidebar
    updateLegendCounts(allEvents);
    updateEconDataSidebar(allEvents, todayStr);
    updateCountdownsDynamic(allEvents, todayStr);
    updateThisWeekDynamic(allEvents, todayStr);

  } catch(e){
    console.error('calendar loadData error',e);
    if(window.PX_showDataError)window.PX_showDataError();
    var tl = document.getElementById('timeline');
    if(tl) tl.innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--gray-400);font-size:13px;font-family:var(--font-zh);">資料載入失敗，請重新整理</div>';
  }
}

function updateEconDataSidebar(events, todayStr){
  var el = document.getElementById('econ-data-list');
  if(!el) return;
  var yesterday = new Date(todayStr+'T00:00:00');
  yesterday.setDate(yesterday.getDate()-1);
  var yesterdayStr = yesterday.toISOString().split('T')[0];
  var future14 = new Date(todayStr+'T00:00:00');
  future14.setDate(future14.getDate()+14);
  var future14Str = future14.toISOString().split('T')[0];

  var econEvs = events.filter(function(e){
    var t=(e.type||'').toLowerCase();
    return (t==='data'||t==='econ'||t==='fed') && e.date >= yesterdayStr && e.date <= future14Str;
  });
  econEvs.sort(function(a,b){ return a.date.localeCompare(b.date); });

  if(!econEvs.length){
    el.innerHTML='<div style="color:var(--gray-400);font-size:12px;padding:8px 0;text-align:center;font-family:var(--font-en);">No upcoming data</div>';
    return;
  }

  var months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var typeColor={'fed':'#2563eb','econ':'#16a34a','data':'#16a34a'};

  el.innerHTML = econEvs.map(function(e){
    var d = new Date(e.date+'T00:00:00');
    var t = (e.type||'data').toLowerCase();
    var dotColor = typeColor[t]||'#64748b';
    var isToday = e.date===todayStr;
    var isYesterday = e.date===yesterdayStr;
    var tagHtml = isToday
      ? '<span class="econ-item-badge econ-item-tag-today">TODAY</span>'
      : isYesterday
        ? '<span class="econ-item-badge econ-item-tag-yesterday">PUBLISHED</span>'
        : '';
    function truncVal(v){ if(!v) return '—'; return v.length>22 ? v.slice(0,21)+'…' : v; }
    var strip = '<div class="econ-data-strip">'
      +'<div class="econ-data-col"><span class="econ-data-lbl">PREV</span><span class="econ-data-num">'+truncVal(e.prev)+'</span></div>'
      +'<div class="econ-data-col"><span class="econ-data-lbl">EST</span><span class="econ-data-num">'+truncVal(e.expect)+'</span></div>'
      +'<div class="econ-data-col'+(e.actual?' has-act':'')+'"><span class="econ-data-lbl">ACT</span><span class="econ-data-num '+(e.actual?'econ-data-act':'econ-data-tbd')+'">'+(e.actual||'TBD')+'</span></div>'
      +'</div>';
    return '<div class="econ-item">'
      +'<div class="econ-item-left">'
        +'<div class="econ-item-dot" style="background:'+dotColor+'"></div>'
        +'<div class="econ-item-day">'+d.getDate()+'</div>'
        +'<div class="econ-item-mon">'+months[d.getMonth()]+'</div>'
      +'</div>'
      +'<div class="econ-item-body">'
        +'<div class="econ-item-meta">'+tagHtml+'</div>'
        +'<div class="econ-item-title">'+e.title+'</div>'
        +strip
      +'</div>'
      +'</div>';
  }).join('');
}

function updateCountdownsDynamic(events, todayStr){
  // 找 high impact 事件做 countdown
  var highEvents = events.filter(function(e){ return (e.impact||'').toLowerCase()==='high' && e.date >= todayStr; });
  highEvents.sort(function(a,b){ return a.date.localeCompare(b.date); });

  var countdownEl = document.getElementById('countdown-card');
  if(!countdownEl) return;

  var today = new Date(todayStr+'T00:00:00');
  var months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var cdHTML = '<div class="sc-title">重要倒數 <span class="sc-title-en">COUNTDOWN</span></div>';
  highEvents.slice(0,5).forEach(function(ev){
    var evDate = new Date(ev.date+'T00:00:00');
    var diff = Math.round((evDate-today)/(1000*60*60*24));
    var daysText = diff===0?'今天':diff+' 天';
    var soonClass = diff<=3?' soon':'';
    var dateLabel = months[evDate.getMonth()]+' '+evDate.getDate();
    var timeLabel = (ev.time && ev.time!=='全天') ? ' · '+ev.time : '';
    cdHTML += '<div class="countdown-item">'+
      '<div class="ci-left">'+
        '<div class="ci-name">'+ev.title+'</div>'+
        '<div class="ci-date">'+dateLabel+timeLabel+'</div>'+
      '</div>'+
      '<span class="ci-days'+soonClass+'">'+daysText+'</span>'+
    '</div>';
  });
  countdownEl.innerHTML = cdHTML;
}

function updateThisWeekDynamic(events, todayStr){
  var el = document.getElementById('this-week-card');
  if(!el) return;
  var today = new Date(todayStr+'T00:00:00');
  var days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  // get Mon-Sun of current week
  var dow = today.getDay();
  var weekStart = new Date(today); weekStart.setDate(today.getDate() - (dow===0?6:dow-1));
  var weekEnd   = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
  var pad = function(d){ return d<10?'0'+d:String(d); };
  var wsStr = weekStart.getFullYear()+'-'+pad(weekStart.getMonth()+1)+'-'+pad(weekStart.getDate());
  var weStr = weekEnd.getFullYear()+'-'+pad(weekEnd.getMonth()+1)+'-'+pad(weekEnd.getDate());
  var weekEvs = events.filter(function(e){
    return e.date >= wsStr && e.date <= weStr && (e.impact||'').toLowerCase() !== 'low';
  });
  weekEvs.sort(function(a,b){ return a.date.localeCompare(b.date); });
  var html = '<div class="sc-title">本週重點 <span class="sc-title-en">THIS WEEK</span></div>';
  if(!weekEvs.length){
    html += '<div style="padding:8px 0;color:var(--gray-400);font-size:12px;font-family:var(--font-zh);">本週暫無重要事件</div>';
  } else {
    weekEvs.slice(0,6).forEach(function(ev){
      var d = new Date(ev.date+'T00:00:00');
      var label = days[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();
      html += '<div class="week-item"><span class="wi-date">'+label+'</span><span class="wi-text">'+ev.title+'</span></div>';
    });
  }
  el.innerHTML = html;
}

function updateLegendCounts(events){
  var counts = {fed:0, econ:0, earnings:0, call:0, agm:0, ipo:0, tw:0, crypto:0};
  events.forEach(function(ev){
    var t = (ev.type||'').toLowerCase();
    if(t==='fed') counts.fed++;
    else if(t==='data'||t==='econ') counts.econ++;
    else if(t==='earnings') counts.earnings++;
    else if(t==='call') counts.call++;
    else if(t==='agm') counts.agm++;
    else if(t==='ipo') counts.ipo++;
    else if(t==='tw'||t==='corp') counts.tw++;
    else if(t==='crypto') counts.crypto++;
  });
  Object.keys(counts).forEach(function(k){
    var el = document.getElementById('lc-'+k);
    if(el) el.textContent = counts[k] || '–';
  });
}
