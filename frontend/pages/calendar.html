<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX — 市場日曆</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-base: #05060f;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --text-muted: #44445a;
      --accent-blue: #4da6ff;
      --accent-purple: #9f7aea;
      --accent-green: #48bb78;
      --accent-red: #fc8181;
      --accent-orange: #f6ad55;
      --accent-teal: #38b2ac;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(77,99,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 0%, rgba(159,122,234,0.06) 0%, transparent 50%);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,6,15,0.85);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4da6ff, #9f7aea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); padding-bottom: 2px; }
    .nav-right { display: flex; gap: 10px; align-items: center; }

    .btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .btn-glow { background: linear-gradient(135deg, #4da6ff, #9f7aea); color: #fff; box-shadow: 0 0 20px rgba(77,166,255,0.3); }
    .btn-glow:hover { box-shadow: 0 0 30px rgba(77,166,255,0.5); transform: translateY(-1px); }

    main { max-width: 1440px; margin: 0 auto; padding: 28px 40px 60px; }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
    .top-bar h1 { font-size: 20px; font-weight: 600; }
    .top-bar .meta { font-size: 12px; color: var(--text-muted); text-align: right; line-height: 1.8; }

    /* 主內容兩欄 */
    .content-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    /* 玻璃卡片 */
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .icon { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .icon-blue { background: rgba(77,166,255,0.15); }
    .icon-green { background: rgba(72,187,120,0.15); }
    .icon-purple { background: rgba(159,122,234,0.15); }
    .icon-orange { background: rgba(246,173,85,0.15); }
    .icon-teal { background: rgba(56,178,172,0.15); }

    /* 日曆事件 */
    .cal-group { margin-bottom: 24px; }

    .cal-date-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .cal-date-label.today {
      color: var(--accent-blue);
    }

    .cal-event {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      transition: all 0.2s;
    }

    .cal-event:hover { background: var(--bg-card-hover); }

    .cal-event.today-event {
      border-color: rgba(77,166,255,0.3);
      background: rgba(77,166,255,0.05);
    }

    .cal-event.high-impact {
      border-color: rgba(252,129,129,0.2);
      background: rgba(252,129,129,0.03);
    }

    .cal-time {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 50px;
      margin-top: 1px;
    }

    .cal-body { flex: 1; }
    .cal-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
    .cal-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .cal-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      height: fit-content;
      letter-spacing: 0.5px;
    }

    .tag-fed { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.2); }
    .tag-earnings { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.2); }
    .tag-data { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.2); }
    .tag-tw { background: rgba(56,178,172,0.1); color: var(--accent-teal); border: 1px solid rgba(56,178,172,0.2); }
    .tag-crypto { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.2); }
    .tag-geo { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.2); }

    /* 側欄：本週重點 */
    .highlight-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .highlight-item:last-child { border-bottom: none; }

    .highlight-date { font-size: 10px; color: var(--accent-blue); font-weight: 600; margin-bottom: 4px; }
    .highlight-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
    .highlight-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .impact-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .impact-high { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.2); }
    .impact-mid { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.2); }
    .impact-low { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border); }
  </style>
</head>
<body>

  <nav>
    <div class="logo">PROJECT X</div>
    <ul class="nav-links">
      <li><a href="/index.html">總覽</a></li>
      <li><a href="/pages/market.html">市場</a></li>
      <li><a href="/pages/industry.html">產業</a></li>
      <li><a href="/pages/institutional.html">機構報告</a></li>
      <li><a href="/pages/calendar.html" class="active">市場日曆</a></li>
      <li><a href="/pages/targets.html">標的追蹤</a></li>
    </ul>
    <div class="nav-right">
      <button class="btn btn-ghost">登入</button>
      <button class="btn btn-glow">訂閱 Pro</button>
    </div>
  </nav>

  <main>
    <div class="top-bar">
      <div>
        <h1>市場日曆</h1>
        <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">央行決策 · 財報日期 · 重要數據 · 台股股務事件</div>
      </div>
      <div class="meta" id="cal-date"></div>
    </div>

    <div class="content-layout">

      <!-- 左：日曆主體 -->
      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-blue">📅</div>近期重要事件</div>
          </div>
          <div id="calendar-main"></div>
        </div>
      </div>

      <!-- 右：本週重點 + 預告 -->
      <div>
        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-orange">⚡</div>高影響力事件</div>
          </div>
          <div id="high-impact-list"></div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <div class="card-title"><div class="icon icon-purple">🔭</div>遠期預告</div>
          </div>
          <div id="future-events"></div>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function loadData() {
      const res = await fetch('../data/daily.json');
      const data = await res.json();

      const today = data.date;
      const d = new Date(today);
      document.getElementById('cal-date').innerHTML =
        d.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) +
        '<br>UTC+8 台北時間';

      if (data.calendar?.events) {
        // 依日期分組
        const groups = {};
        data.calendar.events.forEach(e => {
          if (!groups[e.date]) groups[e.date] = [];
          groups[e.date].push(e);
        });

        const sortedDates = Object.keys(groups).sort();
        let html = '';

        sortedDates.forEach(date => {
          const isToday = date === today;
          const d = new Date(date);
          const label = isToday ? '今日 · ' + d.toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'long' }) :
            d.toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'long' });

          html += `<div class="cal-group">
            <div class="cal-date-label ${isToday ? 'today' : ''}">${label}</div>`;

          groups[date].forEach(e => {
            html += `
              <div class="cal-event ${isToday ? 'today-event' : ''} ${e.impact === 'high' ? 'high-impact' : ''}">
                <div class="cal-time">${e.time || '全天'}</div>
                <div class="cal-body">
                  <div class="cal-title">${e.title}</div>
                  <div class="cal-desc">${e.desc}</div>
                </div>
                <span class="cal-tag tag-${e.type}">${e.tag}</span>
              </div>`;
          });

          html += '</div>';
        });

        document.getElementById('calendar-main').innerHTML = html;
      }

      if (data.calendar?.high_impact) {
        document.getElementById('high-impact-list').innerHTML = data.calendar.high_impact.map(e => `
          <div class="highlight-item">
            <span class="impact-badge impact-${e.impact}">${e.impact === 'high' ? '高影響' : e.impact === 'mid' ? '中影響' : '低影響'}</span>
            <div class="highlight-date">${e.date}</div>
            <div class="highlight-title">${e.title}</div>
            <div class="highlight-desc">${e.desc}</div>
          </div>
        `).join('');
      }

      if (data.calendar?.future) {
        document.getElementById('future-events').innerHTML = data.calendar.future.map(e => `
          <div class="highlight-item">
            <div class="highlight-date">${e.date}</div>
            <div class="highlight-title">${e.title}</div>
            <div class="highlight-desc">${e.desc}</div>
          </div>
        `).join('');
      }
    }

    loadData();
  </script>
</body>
</html>
