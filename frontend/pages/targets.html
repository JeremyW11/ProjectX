<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project X · 標的追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7;
  --red-700:#b91c1c; --red-600:#dc2626; --red-100:#fee2e2;
  --amber-600:#d97706; --amber-100:#fef3c7;
  --purple-600:#7c3aed; --purple-100:#ede9fe;

  /* JS 相容變數 */
  --bg-base:#f7f8fc; --bg-card:#ffffff; --border:#e2e8f0;
  --text-primary:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
  --accent-blue:#2563eb; --accent-green:#16a34a; --accent-red:#dc2626;
  --accent-orange:#d97706; --accent-purple:#7c3aed;

  --font-en:'DM Sans',sans-serif; --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
  --shadow-hover:0 4px 24px rgba(15,23,42,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-zh);background:var(--bg-base);color:var(--text-primary);min-height:100vh;background-image:none;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;font-family:inherit;}
ul{list-style:none;}

/* ── TOPBAR ── */
nav{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:200;}
.logo{display:flex;align-items:center;gap:10px;margin-right:36px;flex-shrink:0;}
.logo-mark{width:32px;height:32px;background:var(--navy-700);border-radius:8px;display:grid;place-items:center;transition:transform .3s;}
.logo-mark:hover{transform:rotate(45deg) scale(1.05);}
.logo-main{font-family:var(--font-en);font-size:13.5px;font-weight:600;color:var(--navy-800);letter-spacing:.05em;}
.logo-sub{font-size:9.5px;color:var(--gray-400);letter-spacing:.08em;font-family:var(--font-en);}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;}
.nav-links a{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-sm);font-size:13.5px;color:var(--gray-500);font-weight:400;transition:all .15s;white-space:nowrap;font-family:var(--font-zh);border-bottom:none;}
.nav-links a:hover{background:var(--navy-50);color:var(--navy-700);}
.nav-links a.active{background:var(--navy-50);color:var(--navy-600);font-weight:500;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-400);display:inline-block;}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green-100);color:var(--green-600);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:var(--font-en);}
.live-dot{width:5px;height:5px;background:var(--green-600);border-radius:50%;animation:pulse 2s infinite;display:inline-block;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header-time{font-family:var(--font-en);font-size:12px;color:var(--gray-400);}
.btn{padding:7px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:var(--font-en);display:inline-block;}
.btn-ghost{background:var(--white);border:1px solid var(--gray-300);color:var(--gray-700);}
.btn-ghost:hover{border-color:var(--navy-400);color:var(--navy-700);}
.btn-glow{background:var(--navy-700);color:var(--white);border:none;box-shadow:none;}
.btn-glow:hover{background:var(--navy-600);transform:translateY(-1px);}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;}
.hamburger span{display:block;width:22px;height:2px;background:var(--gray-700);border-radius:2px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.mobile-menu{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);z-index:199;padding:24px;flex-direction:column;gap:4px;overflow-y:auto;border-top:1px solid var(--gray-200);}
.mobile-menu.open{display:flex;}
.mobile-menu a{color:var(--gray-600);font-size:16px;font-weight:500;padding:13px 0;border-bottom:1px solid var(--gray-100);font-family:var(--font-zh);}
.mobile-menu a.active{color:var(--navy-600);}
.mobile-menu-btns{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
.mobile-menu-btns .btn{width:100%;padding:12px;font-size:14px;text-align:center;}

/* ── PAGE ── */
main{margin-top:56px;max-width:1440px;margin-left:auto;margin-right:auto;padding:28px 24px 60px;}
.top-bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;}
.top-bar h1{font-family:var(--font-display);font-size:26px;color:var(--navy-950);}
.top-bar .meta{font-size:12px;color:var(--gray-400);text-align:right;line-height:1.8;font-family:var(--font-en);}

/* ── GLASS CARD ── */
.glass-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:18px 20px;backdrop-filter:none;margin-bottom:12px;box-shadow:var(--shadow-card);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--gray-100);}
.card-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--gray-900);font-family:var(--font-zh);}

/* ── LOGIN GATE ── */
.login-gate{max-width:440px;margin:60px auto;text-align:center;}
.login-gate .lock{font-size:48px;margin-bottom:18px;}
.login-gate h2{font-size:20px;font-weight:600;margin-bottom:8px;color:var(--gray-900);font-family:var(--font-display);}
.login-gate p{font-size:14px;color:var(--gray-500);line-height:1.7;margin-bottom:22px;font-family:var(--font-zh);}
.btn-login-gate{display:inline-block;padding:11px 26px;border-radius:var(--r-md);background:var(--navy-700);color:var(--white);font-weight:600;font-size:14px;text-decoration:none;transition:background .15s;font-family:var(--font-en);}
.btn-login-gate:hover{background:var(--navy-600);}

/* ── ADD FORM ── */
.add-section{margin-bottom:16px;}
.add-form{display:flex;gap:8px;flex-wrap:wrap;}
.add-input{flex:1;min-width:180px;padding:9px 13px;border-radius:var(--r-sm);background:var(--white);border:1px solid var(--gray-300);color:var(--gray-900);font-size:13.5px;font-family:var(--font-en);outline:none;transition:border-color .15s;}
.add-input:focus{border-color:var(--navy-400);box-shadow:0 0 0 3px rgba(59,130,246,.1);}
.add-input::placeholder{color:var(--gray-400);}
.market-select{padding:9px 13px;border-radius:var(--r-sm);background:var(--white);border:1px solid var(--gray-300);color:var(--gray-700);font-size:13.5px;font-family:var(--font-en);outline:none;cursor:pointer;}
.btn-add{padding:9px 18px;border-radius:var(--r-sm);background:var(--navy-700);border:none;color:var(--white);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-en);transition:background .15s;white-space:nowrap;}
.btn-add:hover{background:var(--navy-600);}

/* ── USER BAR ── */
.user-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--navy-50);border:1px solid var(--navy-100);border-radius:var(--r-md);margin-bottom:18px;}
.user-bar-info{font-size:13px;color:var(--gray-600);font-family:var(--font-zh);}
.user-bar-email{color:var(--navy-600);font-weight:600;font-family:var(--font-en);}
.btn-signout{font-size:12px;color:var(--gray-400);background:none;border:none;cursor:pointer;font-family:var(--font-en);transition:color .15s;}
.btn-signout:hover{color:var(--red-600);}

/* ── WATCHLIST GRID ── */
.watchlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.watch-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:16px 18px;position:relative;transition:all .2s;box-shadow:var(--shadow-card);}
.watch-card:hover{box-shadow:var(--shadow-hover);border-color:var(--gray-300);}
.watch-card.up{border-top:3px solid var(--green-600);}
.watch-card.down{border-top:3px solid var(--red-600);}
.watch-card.flat{border-top:3px solid var(--gray-300);}
.wc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.wc-symbol{font-size:16px;font-weight:700;color:var(--gray-900);font-family:var(--font-en);}
.wc-name{font-size:11px;color:var(--gray-400);margin-top:2px;font-family:var(--font-zh);}
.wc-market{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;background:var(--navy-50);color:var(--navy-600);border:1px solid var(--navy-100);font-family:var(--font-en);}
.wc-price{font-size:24px;font-weight:600;margin-bottom:3px;font-family:var(--font-en);letter-spacing:-.01em;}
.wc-change{font-size:13px;font-weight:600;margin-bottom:12px;font-family:var(--font-en);}
.wc-divider{height:1px;background:var(--gray-100);margin:10px 0;}
.wc-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.wc-detail-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:600;font-family:var(--font-en);}
.wc-detail-value{font-size:12.5px;color:var(--gray-600);line-height:1.5;font-family:var(--font-zh);}
.wc-signal{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--r-sm);background:var(--gray-50);border:1px solid var(--gray-200);margin-bottom:8px;}
.wc-signal-label{font-size:12px;color:var(--gray-500);font-family:var(--font-zh);}
.wc-signal-pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;font-family:var(--font-en);}
.bull{background:var(--green-100);color:var(--green-700);border:1px solid #bbf7d0;}
.bear{background:var(--red-100);color:var(--red-700);border:1px solid #fecaca;}
.watch-pill{background:var(--amber-100);color:var(--amber-600);border:1px solid #fde68a;}
.neutral{background:var(--gray-100);color:var(--gray-500);border:1px solid var(--gray-200);}
.wc-note{font-size:12.5px;color:var(--gray-600);line-height:1.6;padding:7px 10px;background:var(--navy-50);border-radius:var(--r-sm);border-left:2px solid var(--navy-300);margin-bottom:8px;font-family:var(--font-zh);}
.wc-analysis{font-size:12.5px;color:var(--gray-600);line-height:1.6;padding:10px 12px;background:var(--purple-100);border-radius:var(--r-sm);border-left:2px solid var(--purple-600);margin-bottom:8px;font-family:var(--font-zh);}
.wc-analysis-label{font-size:10px;color:var(--purple-600);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:5px;font-family:var(--font-en);}
.btn-delete{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--red-100);border:1px solid #fecaca;color:var(--red-600);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.btn-delete:hover{background:#fecaca;}
.btn-analyze{width:100%;padding:8px;border-radius:var(--r-sm);background:var(--purple-100);border:1px solid #ddd6fe;color:var(--purple-600);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-en);transition:all .15s;}
.btn-analyze:hover{background:#ddd6fe;}
.btn-analyze:disabled{opacity:.5;cursor:not-allowed;}
.up{color:var(--green-600);}
.down{color:var(--red-600);}
.flat{color:var(--gray-400);}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:50px 20px;color:var(--gray-400);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-text{font-size:13px;font-family:var(--font-zh);}

/* ── FETCHING ── */
.fetching-badge{font-size:11px;color:var(--gray-400);display:inline-flex;align-items:center;gap:4px;margin-bottom:7px;font-family:var(--font-en);}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:9px;height:9px;border:2px solid var(--gray-200);border-top-color:var(--navy-400);border-radius:50%;animation:spin .8s linear infinite;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  nav{padding:0 16px;}
  .nav-links,.nav-right{display:none;}
  .hamburger{display:flex;}
  main{padding:16px 16px 40px;}
  .top-bar{flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:14px;}
  .watchlist-grid{grid-template-columns:1fr;}
  .add-form{flex-direction:column;}
  .add-input{min-width:unset;}
}
</style>
</head>

<script>
// Clock
function tick(){
  const t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  const el=document.getElementById('clock');
  if(el) el.textContent=t+' CST';
}
tick(); setInterval(tick,1000);

// Mobile menu
function toggleMenu(){
  var menu=document.getElementById('mobile-menu');
  var hamburger=document.getElementById('hamburger');
  menu.classList.toggle('open');
  hamburger.classList.toggle('open');
  document.body.style.overflow=menu.classList.contains('open')?'hidden':'';
}
document.getElementById('mobile-menu').querySelectorAll('a').forEach(function(a){
  a.addEventListener('click',function(){
    document.getElementById('mobile-menu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
    document.body.style.overflow='';
  });
});
window.addEventListener('scroll',function(){
  document.querySelector('nav').style.boxShadow=window.scrollY>10?'0 2px 20px rgba(15,23,42,.08)':'';
});
</script>

    loadWatchlist();
  }else{
    document.getElementById('gate-view').style.display='block';
    document.getElementById('main-view').style.display='none';
  }
}

async function loadWatchlist(){
  var result=await sb.from('watchlist').select('*').order('created_at',{ascending:true});
  if(result.error){console.error(result.error);return;}
  renderWatchlist(result.data);
}

function getMarketData(symbol,market){
  if(!dailyData) return null;
  symbol=symbol.toUpperCase();
  if(market==='crypto'&&dailyData.market&&dailyData.market.crypto)
    return dailyData.market.crypto.find(function(c){return c.symbol===symbol;});
  if(market==='us'&&dailyData.market&&dailyData.market.us_stocks)
    return dailyData.market.us_stocks.find(function(s){return s.ticker===symbol;});
  if(market==='tw'&&dailyData.market&&dailyData.market.tw_stocks)
    return dailyData.market.tw_stocks.find(function(s){return s.ticker===symbol;});
  return null;
}

function renderWatchlist(items){
  var container=document.getElementById('watchlist-container');
  if(!items||items.length===0){
    container.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">還沒有自選標的，請新增你關注的標的</div></div>';
    return;
  }
  container.innerHTML='<div class="watchlist-grid">'+items.map(function(item){
    var mdata=getMarketData(item.symbol,item.market);
    var price=mdata?mdata.price:'--';
    var change=mdata?mdata.change:'--';
    var dir=mdata?mdata.dir:'flat';
    var dirClass=dir==='up'?'up':dir==='down'?'down':'flat';
    var dirIcon=dir==='up'?'▲':dir==='down'?'▼':'—';
    var marketLabel=item.market==='crypto'?'加密':item.market==='us'?'美股':'台股';
    var support=mdata&&mdata.support?mdata.support:'--';
    var resistance=mdata&&mdata.resistance?mdata.resistance:'--';
    var techNote=mdata&&mdata.tech_note?mdata.tech_note:'--';
    var watchNote=mdata&&mdata.watch_note?mdata.watch_note:'--';
    var note=mdata&&mdata.note?mdata.note:'';
    var signal=mdata&&mdata.signal?mdata.signal:'neutral';
    var signalLabel=mdata&&mdata.signal_label?mdata.signal_label:(mdata&&mdata.tag_label?mdata.tag_label:'—');
    var needsFetch=!mdata;
    return '<div class="watch-card '+dirClass+'" id="card-'+item.id+'">'+
      '<button class="btn-delete" onclick="deleteItem(\''+item.id+'\')" title="移除">×</button>'+
      '<div class="wc-header">'+
        '<div><div class="wc-symbol">'+item.symbol+'</div><div class="wc-name">'+item.name+'</div></div>'+
        '<span class="wc-market">'+marketLabel+'</span>'+
      '</div>'+
      (needsFetch?'<div class="fetching-badge"><div class="spinner"></div>即時搜尋中...</div>':'')+
      '<div class="wc-price '+dirClass+'" id="price-'+item.id+'">'+price+'</div>'+
      '<div class="wc-change '+dirClass+'" id="change-'+item.id+'">'+dirIcon+' '+change+'</div>'+
      '<div class="wc-signal" id="signal-'+item.id+'">'+
        '<span class="wc-signal-label">今日信號</span>'+
        '<span class="wc-signal-pill '+(signal==='bull'?'bull':signal==='bear'?'bear':signal==='watch'?'watch-pill':'neutral')+'">'+signalLabel+'</span>'+
      '</div>'+
      '<div class="wc-divider"></div>'+
      '<div class="wc-detail-grid" id="details-'+item.id+'">'+
        '<div><div class="wc-detail-label">支撐位</div><div class="wc-detail-value">'+support+'</div></div>'+
        '<div><div class="wc-detail-label">壓力位</div><div class="wc-detail-value">'+resistance+'</div></div>'+
        '<div><div class="wc-detail-label">技術面</div><div class="wc-detail-value">'+techNote+'</div></div>'+
        '<div><div class="wc-detail-label">觀察重點</div><div class="wc-detail-value">'+watchNote+'</div></div>'+
      '</div>'+
      (note?'<div class="wc-note" id="note-'+item.id+'">'+note+'</div>':'<div class="wc-note" id="note-'+item.id+'" style="display:none;"></div>')+
      '<div id="analysis-'+item.id+'"></div>'+
      '<button class="btn-analyze" onclick="analyzeItem(\''+item.id+'\',\''+item.symbol+'\',\''+item.market+'\')" id="btn-analyze-'+item.id+'">🤖 AI 深度分析</button>'+
    '</div>';
  }).join('')+'</div>';
  items.forEach(function(item){
    var mdata=getMarketData(item.symbol,item.market);
    if(!mdata) fetchTickerData(item.id,item.symbol,item.market);
  });
}

async function fetchTickerData(id,symbol,market){
  try{
    var response=await fetch(BACKEND_URL+'/search-ticker',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol:symbol,market:market})
    });
    var result=await response.json();
    if(!result.success) throw new Error(result.error);
    var d=result.data;
    var card=document.getElementById('card-'+id);
    if(!card) return;
    var dirClass=d.dir==='up'?'up':d.dir==='down'?'down':'flat';
    var dirIcon=d.dir==='up'?'▲':d.dir==='down'?'▼':'—';
    card.className='watch-card '+dirClass;
    var fetchBadge=card.querySelector('.fetching-badge');
    if(fetchBadge) fetchBadge.remove();
    var priceEl=document.getElementById('price-'+id);
    var changeEl=document.getElementById('change-'+id);
    if(priceEl){priceEl.textContent=d.price;priceEl.className='wc-price '+dirClass;}
    if(changeEl){changeEl.textContent=dirIcon+' '+d.change;changeEl.className='wc-change '+dirClass;}
    var signalEl=document.getElementById('signal-'+id);
    if(signalEl){
      signalEl.querySelector('.wc-signal-pill').textContent=d.signal_label||'—';
      signalEl.querySelector('.wc-signal-pill').className='wc-signal-pill '+(d.signal==='bull'?'bull':d.signal==='bear'?'bear':d.signal==='watch'?'watch-pill':'neutral');
    }
    var detailsEl=document.getElementById('details-'+id);
    if(detailsEl){
      var vals=detailsEl.querySelectorAll('.wc-detail-value');
      if(vals[0]) vals[0].textContent=d.support||'--';
      if(vals[1]) vals[1].textContent=d.resistance||'--';
      if(vals[2]) vals[2].textContent=d.tech_note||'--';
      if(vals[3]) vals[3].textContent=d.watch_note||'--';
    }
    var noteEl=document.getElementById('note-'+id);
    if(noteEl&&d.note){noteEl.textContent=d.note;noteEl.style.display='block';}
  }catch(e){
    var card=document.getElementById('card-'+id);
    if(card){var badge=card.querySelector('.fetching-badge');if(badge) badge.innerHTML='⚠️ 搜尋失敗';}
    console.error('fetchTickerData 失敗：',e.message);
  }
}

async function addWatchItem(){
  var symbol=document.getElementById('add-symbol').value.trim().toUpperCase();
  var name=document.getElementById('add-name').value.trim();
  var market=document.getElementById('add-market').value;
  if(!symbol||!name){showAddMsg('請填寫代號和名稱','error');return;}
  var result=await sb.from('watchlist').insert([{user_id:currentUser.id,symbol:symbol,name:name,market:market}]);
  if(result.error){showAddMsg('新增失敗：'+result.error.message,'error');}
  else{
    document.getElementById('add-symbol').value='';
    document.getElementById('add-name').value='';
    showAddMsg('✅ 已新增 '+symbol,'success');
    loadWatchlist();
  }
}

async function deleteItem(id){
  await sb.from('watchlist').delete().eq('id',id);
  loadWatchlist();
}

async function analyzeItem(id,symbol,market){
  var btn=document.getElementById('btn-analyze-'+id);
  var analysisDiv=document.getElementById('analysis-'+id);
  btn.disabled=true;
  btn.textContent='🤖 分析中...';
  analysisDiv.innerHTML='<div style="font-size:12px;color:var(--gray-400);padding:8px 0;font-family:var(--font-zh);">AI 正在分析，請稍候...</div>';
  var mdata=getMarketData(symbol,market);
  var context=mdata?JSON.stringify(mdata):'無即時數據，請參考宏觀背景進行分析';
  var marketContext=dailyData?JSON.stringify({macro:dailyData.macro,signals:dailyData.signals}):'';
  try{
    var response=await fetch(BACKEND_URL+'/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol:symbol,market:market,context:context,marketContext:marketContext})
    });
    var data=await response.json();
    var text=data.analysis||'分析失敗';
    var html=text
      .replace(/### (.*?)(\n|$)/g,'<div style="font-size:10px;font-weight:700;color:var(--purple-600);text-transform:uppercase;letter-spacing:.05em;margin:7px 0 3px;font-family:var(--font-en);">$1</div>')
      .replace(/\*\*(.*?)\*\*/g,'<strong style="color:var(--gray-900);">$1</strong>')
      .replace(/\n/g,'<br>');
    analysisDiv.innerHTML='<div class="wc-analysis"><div class="wc-analysis-label">🤖 AI 深度分析</div>'+html+'</div>';
  }catch(e){
    analysisDiv.innerHTML='<div style="font-size:12px;color:var(--red-600);padding:8px 0;">分析失敗，請稍後再試</div>';
  }
  btn.disabled=false;
  btn.textContent='🤖 重新分析';
}

function showAddMsg(text,type){
  var el=document.getElementById('add-msg');
  el.textContent=text;
  el.style.color=type==='error'?'var(--red-600)':'var(--green-600)';
  el.style.display='block';
  setTimeout(function(){el.style.display='none';},3000);
}

async function signOut(){
  await sb.auth.signOut();
  window.location.href='/pages/login.html';
}

init();
</script>
