<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project X · 市場數據</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7; --green-50:#f0fdf4;
  --red-700:#b91c1c; --red-600:#dc2626; --red-100:#fee2e2; --red-50:#fef2f2;
  --amber-600:#d97706; --amber-100:#fef3c7; --amber-50:#fffbeb;
  --orange-500:#f97316;
  --font-en:'DM Sans',sans-serif;
  --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
  --shadow-hover:0 4px 24px rgba(15,23,42,.10);
  --ease:cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{background:#f7f8fc;color:var(--gray-900);font-family:var(--font-zh);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:100;gap:0;}
.topbar-logo{display:flex;align-items:center;gap:10px;margin-right:36px;}
.logo-mark{width:32px;height:32px;background:var(--navy-700);border-radius:8px;display:grid;place-items:center;flex-shrink:0;transition:transform .3s;}
.logo-mark:hover{transform:rotate(45deg) scale(1.05);}
.logo-main{font-family:var(--font-en);font-size:13.5px;font-weight:600;color:var(--navy-800);letter-spacing:.05em;}
.logo-sub{font-size:9.5px;color:var(--gray-400);letter-spacing:.08em;font-family:var(--font-en);}
.header-nav{display:flex;align-items:center;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-sm);font-size:13.5px;color:var(--gray-500);font-weight:400;transition:all .15s;white-space:nowrap;font-family:var(--font-zh);}
.nav-item:hover{background:var(--navy-50);color:var(--navy-700);}
.nav-item.active{background:var(--navy-50);color:var(--navy-600);font-weight:500;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-400);opacity:0;transition:opacity .15s;}
.nav-item.active .nav-dot{opacity:1;}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green-100);color:var(--green-600);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:var(--font-en);letter-spacing:.04em;}
.live-dot{width:5px;height:5px;background:var(--green-600);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.header-time{font-family:var(--font-en);font-size:12px;color:var(--gray-400);}
.btn-login{padding:7px 16px;background:var(--navy-700);color:var(--white);border-radius:var(--r-sm);font-size:13px;font-weight:500;font-family:var(--font-en);transition:background .15s;}
.btn-login:hover{background:var(--navy-600);}

/* ── PAGE BODY ── */
.page{margin-top:56px;max-width:1280px;margin-left:auto;margin-right:auto;padding:28px 24px 60px;}

/* ── PAGE HEADER ── */
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;}
.page-title{font-family:var(--font-display);font-size:28px;color:var(--navy-950);line-height:1.2;}
.page-title-sub{font-family:var(--font-zh);font-size:13px;font-weight:300;color:var(--gray-400);margin-top:4px;font-style:normal;}
.page-update{font-size:11.5px;color:var(--gray-400);font-family:var(--font-en);}

/* ── TAB BAR ── */
.tab-bar{display:flex;gap:0;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:5px;margin-bottom:24px;box-shadow:var(--shadow-card);width:fit-content;}
.tab-btn{display:flex;align-items:center;gap:7px;padding:9px 22px;border-radius:var(--r-md);font-size:14px;font-weight:500;color:var(--gray-500);font-family:var(--font-zh);transition:all .2s;cursor:pointer;white-space:nowrap;}
.tab-btn:hover{color:var(--navy-700);background:var(--navy-50);}
.tab-btn.active{background:var(--navy-700);color:var(--white);box-shadow:0 2px 8px rgba(29,45,90,.2);}
.tab-icon{font-size:15px;line-height:1;}

/* ── TAB PANELS ── */
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── SUMMARY STRIP (top of each tab) ── */
.summary-strip{display:grid;gap:10px;margin-bottom:22px;}
.summary-strip.cols-3{grid-template-columns:repeat(3,1fr);}
.summary-strip.cols-4{grid-template-columns:repeat(4,1fr);}
.summary-strip.cols-5{grid-template-columns:repeat(5,1fr);}

.sum-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow-card);transition:all .2s;}
.sum-card:hover{border-color:var(--navy-300);box-shadow:var(--shadow-hover);}
.sum-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sum-tag{font-family:var(--font-en);font-size:10px;font-weight:600;color:var(--gray-400);letter-spacing:.08em;background:var(--gray-100);padding:2px 7px;border-radius:4px;}
.sum-category{font-size:9.5px;color:var(--gray-400);font-family:var(--font-en);}
.sum-name{font-size:11.5px;color:var(--gray-500);font-family:var(--font-zh);margin-bottom:2px;}
.sum-price{font-family:var(--font-en);font-size:22px;font-weight:600;color:var(--gray-900);letter-spacing:-.02em;line-height:1.15;}
.sum-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
.sum-chg{font-family:var(--font-en);font-size:12.5px;font-weight:500;}
.sum-chg.up{color:var(--green-600);}
.sum-chg.dn{color:var(--red-600);}
.sum-chg.flat{color:var(--gray-400);}
.sum-extra{font-size:11px;color:var(--gray-400);font-family:var(--font-en);}

/* ── SECTION BLOCK ── */
.section-block{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card);margin-bottom:16px;}
.section-block-header{padding:14px 20px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;}
.sbh-title{font-size:13px;font-weight:600;color:var(--gray-900);font-family:var(--font-zh);display:flex;align-items:center;gap:7px;}
.sbh-title-en{font-family:var(--font-en);font-size:11px;font-weight:400;color:var(--gray-400);letter-spacing:.05em;}
.sbh-right{display:flex;align-items:center;gap:8px;}
.sbh-badge{font-size:10px;font-weight:600;font-family:var(--font-en);padding:2px 8px;border-radius:4px;letter-spacing:.04em;}
.section-block-body{padding:0;}

/* ── DATA TABLE ── */
.data-table{width:100%;border-collapse:collapse;}
.data-table th{padding:10px 18px;font-size:11px;font-weight:600;color:var(--gray-400);letter-spacing:.06em;font-family:var(--font-en);text-align:left;background:var(--gray-50);border-bottom:1px solid var(--gray-100);}
.data-table th.r{text-align:right;}
.data-table td{padding:12px 18px;font-size:13.5px;color:var(--gray-700);border-bottom:1px solid var(--gray-100);vertical-align:middle;}
.data-table td.r{text-align:right;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr{transition:background .12s;cursor:default;}
.data-table tr:hover td{background:var(--navy-50);}

.dt-sym{font-family:var(--font-en);font-size:13px;font-weight:600;color:var(--gray-900);letter-spacing:.02em;}
.dt-name{font-size:11.5px;color:var(--gray-400);font-family:var(--font-zh);margin-top:1px;}
.dt-price{font-family:var(--font-en);font-size:14px;font-weight:600;color:var(--gray-900);}
.dt-chg{font-family:var(--font-en);font-size:13px;font-weight:500;}
.dt-chg.up{color:var(--green-600);}
.dt-chg.dn{color:var(--red-600);}
.dt-chg.flat{color:var(--gray-400);}
.dt-val{font-family:var(--font-en);font-size:13px;color:var(--gray-500);}
.dt-badge{font-size:10px;font-weight:600;font-family:var(--font-en);padding:2px 7px;border-radius:4px;letter-spacing:.04em;}
.b-buy{background:var(--green-100);color:var(--green-700);}
.b-hold{background:var(--amber-100);color:var(--amber-600);}
.b-sell{background:var(--red-100);color:var(--red-700);}
.b-beat{background:var(--green-100);color:var(--green-700);}
.b-miss{background:var(--red-100);color:var(--red-700);}

/* Mini bar inside table */
.mini-bar-wrap{display:flex;align-items:center;gap:8px;}
.mini-bar-track{flex:1;max-width:80px;height:4px;background:var(--gray-100);border-radius:2px;overflow:hidden;}
.mini-bar-fill{height:100%;border-radius:2px;}
.bar-green{background:var(--green-600);}
.bar-red{background:var(--red-600);}
.bar-blue{background:var(--navy-400);}
.bar-amber{background:var(--amber-600);}

/* Sentiment chip */
.sent-chip{font-size:10px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:var(--font-en);}
.s-bull{background:var(--green-100);color:var(--green-700);}
.s-bear{background:var(--red-100);color:var(--red-700);}
.s-neut{background:var(--amber-100);color:var(--amber-600);}

/* ── TWO COLUMN LAYOUT ── */
.two-col{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start;}
.full-col{grid-column:1/-1;}

/* ── SIGNAL CARD ── */
.signal-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-card);}
.signal-card-title{font-size:13px;font-weight:600;color:var(--gray-900);font-family:var(--font-zh);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.signal-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100);}
.signal-row:last-child{border-bottom:none;}
.sr-label{font-size:13px;color:var(--gray-600);font-family:var(--font-zh);}
.sr-val{font-family:var(--font-en);font-size:13px;font-weight:500;}
.sr-val.up{color:var(--green-600);}
.sr-val.dn{color:var(--red-600);}
.sr-val.flat{color:var(--gray-500);}

/* ── CRYPTO EXTRAS ── */
.crypto-metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px;}
.cm-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:12px 14px;}
.cm-label{font-size:10.5px;color:var(--gray-500);font-family:var(--font-en);letter-spacing:.04em;margin-bottom:4px;}
.cm-val{font-family:var(--font-en);font-size:17px;font-weight:600;color:var(--gray-900);}
.cm-sub{font-size:11px;color:var(--gray-400);font-family:var(--font-en);margin-top:2px;}
.cm-badge{display:inline-block;margin-top:4px;font-size:10px;font-weight:600;font-family:var(--font-en);padding:2px 7px;border-radius:4px;}

/* ── COIN DETAIL PANEL ── */
.coin-tabs{display:flex;gap:4px;padding:14px 16px 0;border-bottom:1px solid var(--gray-100);}
.coin-tab{font-size:13px;font-weight:500;color:var(--gray-400);padding:7px 14px;border-bottom:2px solid transparent;font-family:var(--font-en);cursor:pointer;transition:all .15s;}
.coin-tab:hover{color:var(--navy-600);}
.coin-tab.active{color:var(--navy-700);border-bottom-color:var(--navy-700);}
.coin-panel{display:none;padding:16px;}
.coin-panel.active{display:block;}

/* funding rate bar */
.fr-bar-wrap{display:flex;align-items:center;gap:10px;margin-top:6px;}
.fr-bar-track{flex:1;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;position:relative;}
.fr-bar-center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--gray-300);}
.fr-bar-fill{position:absolute;top:0;bottom:0;border-radius:3px;}

/* ── SECTOR RADAR ── */
.sector-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px;}
.sector-item{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:10px 12px;transition:all .15s;cursor:default;}
.sector-item:hover{border-color:var(--navy-300);background:var(--navy-50);}
.sector-name{font-size:11.5px;color:var(--gray-600);font-family:var(--font-zh);margin-bottom:6px;}
.sector-chg-row{display:flex;align-items:center;justify-content:space-between;}
.sector-chg{font-family:var(--font-en);font-size:13px;font-weight:600;}
.sector-bar{width:100%;height:3px;border-radius:2px;margin-top:6px;}

/* ── FOREIGN FLOW ── */
.flow-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--gray-100);}
.flow-row:last-child{border-bottom:none;}
.flow-sym{font-family:var(--font-en);font-size:12px;font-weight:600;color:var(--gray-700);width:44px;flex-shrink:0;}
.flow-name{font-size:12px;color:var(--gray-500);font-family:var(--font-zh);flex:1;}
.flow-bar-wrap{width:120px;flex-shrink:0;}
.flow-bar-track{height:5px;background:var(--gray-100);border-radius:3px;overflow:hidden;}
.flow-bar-fill{height:100%;border-radius:3px;}
.flow-val{font-family:var(--font-en);font-size:12px;font-weight:600;width:64px;text-align:right;flex-shrink:0;}
.flow-val.up{color:var(--green-600);}
.flow-val.dn{color:var(--red-600);}

/* ── MINI CHART PLACEHOLDER ── */
.mini-chart{height:48px;display:flex;align-items:flex-end;gap:2px;padding:0 2px;}
.mc-bar{flex:1;border-radius:2px 2px 0 0;min-width:3px;transition:opacity .2s;}
.mc-bar:hover{opacity:.7;}

/* ── RESPONSIVE ── */
@media(max-width:1024px){.two-col{grid-template-columns:1fr;}}
@media(max-width:768px){
  .summary-strip.cols-5,.summary-strip.cols-4{grid-template-columns:repeat(2,1fr);}
  .summary-strip.cols-3{grid-template-columns:repeat(2,1fr);}
  .sector-grid{grid-template-columns:repeat(2,1fr);}
  .header-nav{display:none;}
  .crypto-metric-grid{grid-template-columns:1fr;}
}

/* ── NEWS LIST ── */
.news-list{display:flex;flex-direction:column;gap:0;}
.news-item{display:flex;gap:14px;align-items:flex-start;padding:13px 18px;border-bottom:1px solid var(--gray-100);transition:background .12s;cursor:default;}
.news-item:last-child{border-bottom:none;}
.news-item:hover{background:var(--navy-50);}
.news-num{font-family:var(--font-en);font-size:11px;font-weight:600;color:var(--gray-300);width:16px;flex-shrink:0;margin-top:2px;}
.news-content{flex:1;min-width:0;}
.news-meta{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap;}
.news-badge{font-family:var(--font-en);font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;letter-spacing:.04em;}
.news-source{font-size:10.5px;color:var(--gray-400);font-family:var(--font-en);}
.news-time{font-size:10.5px;color:var(--gray-300);font-family:var(--font-en);}
.news-headline{font-size:13.5px;font-weight:500;color:var(--gray-800);font-family:var(--font-zh);line-height:1.5;margin-bottom:3px;}
.news-body{font-size:12px;color:var(--gray-500);line-height:1.6;font-family:var(--font-zh);font-weight:300;}
.news-tickers{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.news-chip{font-family:var(--font-en);font-size:10px;font-weight:600;padding:1px 7px;background:var(--gray-100);color:var(--navy-700);border-radius:3px;border:1px solid var(--gray-200);letter-spacing:.03em;}
.b-us-n{background:#f0fdf4;color:#166534;}
.b-tw-n{background:#fdf4ff;color:#7e22ce;}
.b-cr-n{background:#fef3c7;color:#92400e;}
.b-mac-n{background:#eff6ff;color:#1d4ed8;}

</style>
</head>

<!-- PAGE -->
<main>
  <div class="top-bar">
    <div>
      <h1>市場數據 <span style="font-family:var(--font-en);font-size:14px;font-weight:400;color:var(--gray-400);">Market Data</span></h1>
      <div style="font-size:11px;color:var(--gray-400);margin-top:3px;font-family:var(--font-en);">

      </div>

  <div id="tab-us" class="tab-content active">

      <div>

          <div class="card-header"><div class="card-title">🏆 重點追蹤標的</div></div>

            <span>標的</span><span>今日重點</span><span>股價</span><span>漲跌幅</span><span>板塊</span><span></span>
          </div>
          <div id="us-stocks-list"></div>
        </div>
      </div>
      <div>
        <div class="glass-card">
          <div class="card-header"><div class="card-title">📰 今日美股新聞</div></div>
          <div id="us-news-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 台股 -->
  <div id="tab-tw" class="tab-content">
    <div id="tw-index-grid" class="index-grid"></div>
    <div id="tw-sentiment-bar" class="sentiment-bar-tw"></div>
    <div class="two-col">
      <div>
        <div class="glass-card">
          <div class="card-header"><div class="card-title">🏆 重點追蹤標的</div></div>
          <div class="stock-header-row">
            <span>標的</span><span>今日重點</span><span>股價</span><span>漲跌幅</span><span>板塊</span><span></span>
          </div>
          <div id="tw-stocks-list"></div>
        </div>
      </div>
      <div>
        <div class="glass-card">
          <div class="card-header"><div class="card-title">📰 今日台股新聞</div></div>
          <div id="tw-news-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 加密貨幣 -->
  <div id="tab-crypto" class="tab-content">
    <div id="crypto-sentiment-bar" class="sentiment-bar-crypto"></div>
    <div class="glass-card">
      <div class="card-header"><div class="card-title">₿ 加密貨幣行情</div></div>
      <div class="crypto-grid" id="crypto-grid"></div>
    </div>
    <div class="two-col">
      <div class="glass-card">
        <div class="card-header"><div class="card-title">📰 今日加密新聞</div></div>
        <div id="crypto-news-list"></div>
      </div>
      <div class="glass-card">
        <div class="card-header"><div class="card-title">💥 清算詳情</div></div>
        <div id="crypto-liquidation"></div>
      </div>
    </div>
  </div>
</main>

<script>
function tick(){
  const t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  const el=document.getElementById('clock');
  if(el) el.textContent=t+' CST';
}
tick(); setInterval(tick,1000);

function toggleMenu(){
  var menu=document.getElementById('mobile-menu');
  var hamburger=document.getElementById('hamburger');
  menu.classList.toggle('open');
  hamburger.classList.toggle('open');
  document.body.style.overflow=menu.classList.contains('open')?'hidden':'';
}

window.addEventListener('scroll',function(){
  document.querySelector('nav').style.boxShadow=window.scrollY>10?'0 2px 20px rgba(15,23,42,.08)':'';
});

function switchTab(tab,btn){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(el){el.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}

function toggleStock(el){
  var isOpen=el.classList.contains('open');
  document.querySelectorAll('.stock-item.open').forEach(function(item){
    item.classList.remove('open');
    var arrow=item.querySelector('.expand-arrow');
    if(arrow) arrow.style.transform='rotate(0deg)';
  });
  if(!isOpen){
    el.classList.add('open');
    var arrow=el.querySelector('.expand-arrow');
    if(arrow) arrow.style.transform='rotate(90deg)';
  }
}

function toggleCrypto(el){
  var isOpen=el.classList.contains('open');
  document.querySelectorAll('.crypto-card.open').forEach(function(item){item.classList.remove('open');});
  if(!isOpen) el.classList.add('open');
}

function renderStocks(containerId,stocks){
  var container=document.getElementById(containerId);
  if(!container||!stocks) return;
  container.innerHTML=stocks.map(function(s){
    var dirClass=s.dir==='up'?'up':s.dir==='down'?'down':'flat';
    var dirIcon=s.dir==='up'?'▲':s.dir==='down'?'▼':'—';
    return '<div class="stock-item" onclick="toggleStock(this)">'+
      '<div class="s-ticker-col"><div><div class="s-ticker">'+s.ticker+'</div><div class="s-name">'+s.name+'</div></div></div>'+
      '<div class="s-note-col s-note">'+s.note+'</div>'+
      '<div class="s-price '+dirClass+'">'+s.price+'</div>'+
      '<div class="s-change '+dirClass+'">'+dirIcon+' '+s.change+'</div>'+
      '<div><span class="s-tag tag-'+(s.tag||'ai')+'">'+(s.tag_label||s.tag)+'</span></div>'+
      '<div class="s-arrow-col expand-arrow">›</div>'+
      '<div class="stock-expand" style="grid-column:1/-1;">'+
        '<div class="stock-expand-inner">'+
          '<div><div class="se-label">觀察重點</div><div class="se-value">'+(s.watch_note||'—')+'</div></div>'+
          '<div><div class="se-label">技術面</div><div class="se-value">'+(s.tech_note||'—')+'</div></div>'+
          (s.action?'<div style="grid-column:1/-1;margin-top:8px;padding:8px 12px;background:var(--amber-100);border-radius:8px;border-left:2px solid var(--amber-600);"><div class="se-label" style="color:var(--amber-700);margin-bottom:3px;">操作建議</div><div class="se-value" style="color:var(--amber-700);font-weight:600;">'+s.action+'</div></div>':'')+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function renderNews(containerId,newsItems){
  var container=document.getElementById(containerId);
  if(!container||!newsItems) return;
  container.innerHTML='<div class="news-strip">'+
    newsItems.map(function(n){
      return '<div class="news-strip-item"><div class="news-dot"></div><div class="news-strip-text">'+(n.text||n.title||'')+'</div><div class="news-strip-time">'+(n.time||n.date||'')+'</div></div>';
    }).join('')+'</div>';
}

function renderIndexCard(label,value,change,dir,sub){
  var dirClass=dir==='up'?'up':dir==='down'?'down':'flat';
  var dirIcon=dir==='up'?'▲':dir==='down'?'▼':'—';
  return '<div class="index-card '+dirClass+'">'+
    '<div class="ic-label">'+label+'</div>'+
    '<div class="ic-value">'+value+'</div>'+
    '<div class="ic-change '+dirClass+'">'+dirIcon+' '+change+'</div>'+
    '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">'+sub+'</div></div></div>'+
  '</div>';
}

async function loadData(){
  var res=await fetch('../data/daily.json');
  var data=await res.json();
  var d=new Date(data.date);
  document.getElementById('market-date').innerHTML=
    d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'<br>UTC+8 台北時間';

  var tickers=data.tickers||[];
  var spx=tickers.find(function(t){return t.label==='S&P 500';});
  var ndx=tickers.find(function(t){return t.label==='NASDAQ';});
  var twx=tickers.find(function(t){return t.label==='台股加權';});
  var fg=data.sentiment&&data.sentiment.fear_greed?data.sentiment.fear_greed:null;
  var cg=data.sentiment&&data.sentiment.coinglass?data.sentiment.coinglass:null;

  // US index
  document.getElementById('us-index-grid').innerHTML=
    renderIndexCard('S&P 500',spx?spx.value:'--',spx?spx.change:'--',spx?spx.dir:'flat','Polygon')+
    renderIndexCard('NASDAQ',ndx?ndx.value:'--',ndx?ndx.change:'--',ndx?ndx.dir:'flat','Polygon')+
    '<div class="index-card '+(fg?(parseInt(fg.value)>=50?'up':'down'):'flat')+'">'+
      '<div class="ic-label">市場情緒</div>'+
      '<div class="ic-value" style="font-size:32px;color:'+(fg?(parseInt(fg.value)>=50?'var(--green-600)':parseInt(fg.value)>=30?'var(--amber-600)':'var(--red-600)'):'var(--gray-400)')+';">'+(fg?fg.value:'--')+'</div>'+
      '<div class="ic-change '+(fg?(parseInt(fg.value)>=50?'up':'down'):'flat')+'">'+(fg?fg.label:'--')+'</div>'+
      '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">Fear & Greed</div><div class="ic-stat-value">'+(fg?fg.change:'--')+'</div></div></div>'+
    '</div>';

  document.getElementById('us-sentiment-bar').innerHTML=
    '<div class="sent-item"><div class="sent-label">Fear & Greed</div><div class="sent-value" style="color:var(--amber-600);">'+(fg?fg.value:'--')+'</div><div class="sent-sub">'+(fg?fg.label:'--')+'</div></div>'+
    '<div class="sent-item"><div class="sent-label">NASDAQ</div><div class="sent-value '+(ndx?ndx.dir:'flat')+'" style="font-size:15px;">'+(ndx?(ndx.dir==='up'?'▲ ':ndx.dir==='down'?'▼ ':'— ')+ndx.change:'--')+'</div><div class="sent-sub">今日表現</div></div>'+
    '<div class="sent-item"><div class="sent-label">VIX 情緒</div><div class="sent-value" style="font-size:14px;color:var(--navy-500);">'+(fg?fg.note||'--':'--')+'</div><div class="sent-sub">市場情緒</div></div>';

  if(data.market&&data.market.us_stocks) renderStocks('us-stocks-list',data.market.us_stocks);
  if(data.market&&data.market.us_news) renderNews('us-news-list',data.market.us_news);

  // TW index
  document.getElementById('tw-index-grid').innerHTML=
    renderIndexCard('台股加權',twx?twx.value:'--',twx?twx.change:'--',twx?twx.dir:'flat','TAIEX')+
    '<div class="index-card flat"><div class="ic-label">今日成交量</div><div class="ic-value" style="font-size:18px;">'+(data.tw_market_summary?data.tw_market_summary.trade_value:'--')+'</div><div class="ic-change flat">台股總成交</div><div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">TWSE</div></div></div></div>'+
    '<div class="index-card flat"><div class="ic-label">外資動向</div><div class="ic-value" style="font-size:16px;">'+(data.tw_market_summary?data.tw_market_summary.foreign_net:'--')+'</div><div class="ic-change flat">三大法人</div><div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">TWSE</div></div></div></div>';

  document.getElementById('tw-sentiment-bar').innerHTML=
    '<div class="sent-item"><div class="sent-label">加權指數</div><div class="sent-value '+(twx?twx.dir:'flat')+'" style="font-size:14px;">'+(twx?(twx.dir==='up'?'▲ ':twx.dir==='down'?'▼ ':'— ')+twx.change:'--')+'</div><div class="sent-sub">'+(twx?twx.value:'--')+'</div></div>'+
    '<div class="sent-item"><div class="sent-label">今日成交量</div><div class="sent-value" style="font-size:13px;color:var(--navy-500);">'+(data.tw_market_summary?data.tw_market_summary.trade_value:'--')+'</div><div class="sent-sub">TWSE</div></div>'+
    '<div class="sent-item"><div class="sent-label">外資買賣超</div><div class="sent-value" style="font-size:12px;">'+(data.tw_market_summary?data.tw_market_summary.foreign_net:'--')+'</div><div class="sent-sub">三大法人</div></div>';

  if(data.market&&data.market.tw_stocks) renderStocks('tw-stocks-list',data.market.tw_stocks);
  if(data.market&&data.market.tw_news) renderNews('tw-news-list',data.market.tw_news);

  // Crypto
  document.getElementById('crypto-sentiment-bar').innerHTML=
    '<div class="sent-item"><div class="sent-label">Fear & Greed</div><div class="sent-value" style="color:var(--amber-600);">'+(fg?fg.value:'--')+'</div><div class="sent-sub">'+(fg?fg.label:'--')+'</div></div>'+
    '<div class="sent-item"><div class="sent-label">多空比</div><div class="sent-value" style="font-size:11px;color:var(--navy-500);line-height:1.3;">'+(cg?cg.long_short_ratio||'--':'--')+'</div><div class="sent-sub">CoinGlass</div></div>'+
    '<div class="sent-item"><div class="sent-label">資金費率</div><div class="sent-value" style="font-size:13px;color:var(--green-600);">'+(cg?cg.funding_rate||'--':'--')+'</div><div class="sent-sub">永續合約</div></div>'+
    '<div class="sent-item"><div class="sent-label">BTC多單清算</div><div class="sent-value" style="font-size:13px;color:var(--red-600);">'+(cg?cg.btc_long_liq||'--':'--')+'</div><div class="sent-sub">空單 '+(cg?cg.btc_short_liq||'--':'--')+'</div></div>';

  if(data.market&&data.market.crypto){
    document.getElementById('crypto-grid').innerHTML=data.market.crypto.map(function(c){
      var dirClass=c.dir==='up'?'up':c.dir==='down'?'down':'flat';
      var dirIcon=c.dir==='up'?'▲':c.dir==='down'?'▼':'—';
      return '<div class="crypto-card '+dirClass+'" onclick="toggleCrypto(this)">'+
        '<div class="cc-header"><div><div class="cc-symbol">'+c.symbol+'</div><div class="cc-name">'+c.name+'</div></div><span class="cc-signal '+(c.signal||'watch')+'">'+(c.signal_label||'觀察')+'</span></div>'+
        '<div class="cc-price '+dirClass+'">'+c.price+'</div>'+
        '<div class="cc-change '+dirClass+'">'+dirIcon+' '+c.change+'</div>'+
        '<div class="cc-stats"><div><div class="cc-stat-label">市值</div><div class="cc-stat-value">'+(c.market_cap||'--')+'</div></div><div><div class="cc-stat-label">成交量</div><div class="cc-stat-value">'+(c.volume||'--')+'</div></div></div>'+
        '<div class="cc-expand"><div class="cc-divider"></div><div class="cc-expand-grid">'+
          '<div><div class="cc-expand-label">支撐位</div><div class="cc-expand-value">'+(c.support||'—')+'</div></div>'+
          '<div><div class="cc-expand-label">壓力位</div><div class="cc-expand-value">'+(c.resistance||'—')+'</div></div>'+
          '<div><div class="cc-expand-label">技術面</div><div class="cc-expand-value">'+(c.tech_note||'—')+'</div></div>'+
          '<div><div class="cc-expand-label">觀察重點</div><div class="cc-expand-value">'+(c.watch_note||'—')+'</div></div>'+
        '</div></div>'+
      '</div>';
    }).join('');
  }

  if(data.market&&data.market.crypto_news) renderNews('crypto-news-list',data.market.crypto_news);

  document.getElementById('crypto-liquidation').innerHTML=
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">'+
      '<div style="background:var(--green-100);border:1px solid #bbf7d0;border-radius:8px;padding:11px;"><div style="font-size:10px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;">BTC多單清算</div><div style="font-size:16px;font-weight:700;color:var(--green-600);">'+(cg?cg.btc_long_liq||'--':'--')+'</div></div>'+
      '<div style="background:var(--red-100);border:1px solid #fecaca;border-radius:8px;padding:11px;"><div style="font-size:10px;color:var(--red-700);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;">BTC空單清算</div><div style="font-size:16px;font-weight:700;color:var(--red-600);">'+(cg?cg.btc_short_liq||'--':'--')+'</div></div>'+
      '<div style="background:var(--green-100);border:1px solid #bbf7d0;border-radius:8px;padding:11px;"><div style="font-size:10px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;">ETH多單清算</div><div style="font-size:16px;font-weight:700;color:var(--green-600);">'+(cg?cg.eth_long_liq||'--':'--')+'</div></div>'+
      '<div style="background:var(--red-100);border:1px solid #fecaca;border-radius:8px;padding:11px;"><div style="font-size:10px;color:var(--red-700);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;">ETH空單清算</div><div style="font-size:16px;font-weight:700;color:var(--red-600);">'+(cg?cg.eth_short_liq||'--':'--')+'</div></div>'+
    '</div>'+
    '<div style="font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:600;">資金費率</div>'+
    '<div style="font-size:14px;color:var(--green-600);font-weight:600;margin-bottom:10px;">'+(cg?cg.funding_rate||'未取得':'未取得')+'</div>'+
    '<div style="font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:600;">多空比</div>'+
    '<div style="font-size:12.5px;color:var(--gray-600);margin-bottom:10px;">'+(cg?cg.long_short_ratio||'未取得':'未取得')+'</div>'+
    (cg&&cg.note?'<div style="font-size:11.5px;color:var(--gray-400);padding-top:8px;border-top:1px solid var(--gray-100);">'+cg.note+'</div>':'');
}

loadData();
</script>
</body>
</html>
