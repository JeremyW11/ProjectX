<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX — 市場總覽</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-base: #05060f;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --text-muted: #44445a;
      --accent-blue: #4da6ff;
      --accent-purple: #9f7aea;
      --accent-green: #48bb78;
      --accent-red: #fc8181;
      --accent-orange: #f6ad55;
      --accent-teal: #38b2ac;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(77,99,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 0%, rgba(159,122,234,0.06) 0%, transparent 50%);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,6,15,0.95);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .logo { font-size: 18px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #4da6ff, #9f7aea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); padding-bottom: 2px; }
    .nav-right { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-glow { background: linear-gradient(135deg, #4da6ff, #9f7aea); color: #fff; box-shadow: 0 0 20px rgba(77,166,255,0.3); }

    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--text-primary); border-radius: 2px; transition: all 0.3s; }
    .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

    .mobile-menu { display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 0; background: rgba(5,6,15,0.98); backdrop-filter: blur(20px); z-index: 199; padding: 24px; flex-direction: column; gap: 8px; overflow-y: auto; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { color: var(--text-secondary); text-decoration: none; font-size: 18px; font-weight: 600; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .mobile-menu a.active { color: var(--accent-blue); }
    .mobile-menu-btns { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .mobile-menu-btns .btn { width: 100%; padding: 12px; font-size: 15px; text-align: center; }

    main { max-width: 1440px; margin: 0 auto; padding: 28px 40px 60px; }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
    .top-bar h1 { font-size: 20px; font-weight: 600; }
    .top-bar .meta { font-size: 12px; color: var(--text-muted); text-align: right; line-height: 1.8; }

    .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .tab-btn { padding: 10px 24px; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; background: transparent; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { color: var(--text-secondary); }
    .tab-btn.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .glass-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .card-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }

    /* 加密貨幣卡片 */
    .crypto-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    .crypto-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; }
    .crypto-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(77,166,255,0.2); }
    .crypto-card.open { background: rgba(255,255,255,0.06); }
    .cc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .cc-symbol { font-size: 16px; font-weight: 800; }
    .cc-name { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .cc-signal { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .cc-price { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .cc-change { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .cc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cc-stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .cc-stat-value { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .cc-expand { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.3s ease; opacity: 0; }
    .crypto-card.open .cc-expand { max-height: 150px; opacity: 1; }
    .cc-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px 0; }
    .cc-expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cc-expand-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .cc-expand-value { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    /* 個股列表 */
    .stock-header-row { display: grid; grid-template-columns: 140px 90px 80px 100px 1fr 20px; gap: 12px; padding: 8px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .stock-header-row span { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }

    .stock-item { display: grid; grid-template-columns: 140px 90px 80px 100px 1fr 20px; gap: 12px; align-items: center; padding: 13px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; transition: background 0.2s; margin: 0 -6px; }
    .stock-item:last-child { border-bottom: none; }
    .stock-item:hover { background: rgba(255,255,255,0.02); }
    .stock-item.open { background: rgba(255,255,255,0.02); }

    .s-ticker { font-size: 14px; font-weight: 700; }
    .s-name { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .s-price { font-size: 15px; font-weight: 700; }
    .s-change { font-size: 12px; font-weight: 600; }
    .s-tag { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 4px; display: inline-block; }
    .tag-ai { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.2); }
    .tag-semi { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.15); }
    .tag-server { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.15); }
    .tag-energy { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }
    .s-note { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .expand-arrow { font-size: 14px; color: var(--text-muted); transition: transform 0.3s; }

    .stock-expand { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.3s ease; opacity: 0; }
    .stock-item.open .stock-expand { max-height: 120px; opacity: 1; }
    .stock-expand-inner { grid-column: 1 / -1; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .se-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; font-weight: 600; }
    .se-value { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    /* 新聞條 */
    .news-strip { margin-top: 4px; }
    .news-strip-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); align-items: flex-start; }
    .news-strip-item:last-child { border-bottom: none; }
    .news-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-blue); flex-shrink: 0; margin-top: 6px; }
    .news-strip-text { font-size: 12px; color: var(--text-secondary); line-height: 1.6; flex: 1; }
    .news-strip-time { font-size: 10px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

    .up { color: var(--accent-green); }
    .down { color: var(--accent-red); }
    .flat { color: var(--text-muted); }
    .bull { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.2); }
    .bear { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.2); }
    .watch { background: rgba(246,173,85,0.08); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }

    /* ===== 手機響應式 ===== */
    @media (max-width: 768px) {
      nav { padding: 0 16px; }
      .nav-links { display: none; }
      .nav-right { display: none; }
      .hamburger { display: flex; }

      main { padding: 16px 16px 40px; }
      .top-bar { flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 16px; }
      .top-bar .meta { text-align: left; font-size: 11px; }

      .tabs { overflow-x: auto; gap: 0; padding-bottom: 0; }
      .tab-btn { padding: 10px 16px; font-size: 12px; }

      /* 加密卡片手機：單欄 */
      .crypto-grid { grid-template-columns: 1fr; gap: 10px; }
      .crypto-card.open .cc-expand { max-height: 200px; }

      /* 個股列表手機：簡化欄位 */
      .stock-header-row { display: none; }
      .stock-item { grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 6px; padding: 12px 6px; }

      .s-ticker-col { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 8px; }
      .s-price-col { grid-column: 2; grid-row: 1; text-align: right; }
      .s-note-col { grid-column: 1 / -1; grid-row: 2; }
      .s-arrow-col { display: none; }

      .s-price { font-size: 14px; }
      .stock-item.open .stock-expand { max-height: 160px; }
      .stock-expand-inner { grid-template-columns: 1fr; }

      .glass-card { padding: 14px; border-radius: 12px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">PROJECT X</div>
    <ul class="nav-links">
      <li><a href="/index.html">總覽</a></li>
      <li><a href="/pages/market.html" class="active">市場</a></li>
      <li><a href="/pages/industry.html">產業</a></li>
      <li><a href="/pages/institutional.html">機構報告</a></li>
      <li><a href="/pages/calendar.html">市場日曆</a></li>
      <li><a href="/pages/targets.html">標的追蹤</a></li>
    </ul>
    <div class="nav-right">
      <button class="btn btn-ghost">登入</button>
      <button class="btn btn-glow">訂閱 Pro</button>
    </div>
    <button class="hamburger" onclick="toggleMenu()" id="hamburger">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <a href="/index.html">📊 總覽</a>
    <a href="/pages/market.html" class="active">📈 市場</a>
    <a href="/pages/industry.html">🏭 產業</a>
    <a href="/pages/institutional.html">🏛 機構報告</a>
    <a href="/pages/calendar.html">📅 市場日曆</a>
    <a href="/pages/targets.html">🎯 標的追蹤</a>
    <div class="mobile-menu-btns">
      <button class="btn btn-ghost">登入</button>
      <button class="btn btn-glow">訂閱 Pro</button>
    </div>
  </div>

  <main>
    <div class="top-bar">
      <div>
        <h1>市場總覽</h1>
        <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">主要做虛擬貨幣，次要做美股與台股</div>
      </div>
      <div class="meta" id="market-date"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('us', this)">🇺🇸 美股</button>
      <button class="tab-btn" onclick="switchTab('tw', this)">🇹🇼 台股</button>
      <button class="tab-btn" onclick="switchTab('crypto', this)">🪙 虛擬貨幣</button>
    </div>

    <!-- 美股 -->
    <div id="tab-us" class="tab-content active">
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">🏆 重點追蹤標的</div>
        </div>
        <div id="us-stocks-list"></div>
      </div>
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">📰 今日美股新聞</div>
        </div>
        <div id="us-news-list"></div>
      </div>
    </div>

    <!-- 台股 -->
    <div id="tab-tw" class="tab-content">
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">🏆 重點追蹤標的</div>
        </div>
        <div id="tw-stocks-list"></div>
      </div>
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">📰 今日台股新聞</div>
        </div>
        <div id="tw-news-list"></div>
      </div>
    </div>

    <!-- 加密 -->
    <div id="tab-crypto" class="tab-content">
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">🪙 加密貨幣行情</div>
        </div>
        <div class="crypto-grid" id="crypto-grid"></div>
        <div id="crypto-news-list"></div>
      </div>
    </div>
  </main>

  <script>
    function toggleMenu() {
      var menu = document.getElementById('mobile-menu');
      var hamburger = document.getElementById('hamburger');
      menu.classList.toggle('open');
      hamburger.classList.toggle('open');
      document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
      document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');
    }

    function toggleStock(el) {
      var isOpen = el.classList.contains('open');
      document.querySelectorAll('.stock-item.open').forEach(function(item) {
        item.classList.remove('open');
        var arrow = item.querySelector('.expand-arrow');
        if (arrow) arrow.style.transform = 'rotate(0deg)';
      });
      if (!isOpen) {
        el.classList.add('open');
        var arrow = el.querySelector('.expand-arrow');
        if (arrow) arrow.style.transform = 'rotate(90deg)';
      }
    }

    function toggleCrypto(el) {
      var isOpen = el.classList.contains('open');
      document.querySelectorAll('.crypto-card.open').forEach(function(item) { item.classList.remove('open'); });
      if (!isOpen) el.classList.add('open');
    }

    function renderStocks(containerId, stocks) {
      var container = document.getElementById(containerId);
      container.innerHTML = stocks.map(function(s) {
        var dirClass = s.dir === 'up' ? 'up' : s.dir === 'down' ? 'down' : 'flat';
        var dirIcon = s.dir === 'up' ? '▲' : s.dir === 'down' ? '▼' : '—';
        return '<div class="stock-item" onclick="toggleStock(this)">' +
          '<div class="s-ticker-col">' +
            '<div><div class="s-ticker">' + s.ticker + '</div><div class="s-name">' + s.name + '</div></div>' +
            '<span class="s-tag tag-' + (s.tag || 'ai') + '">' + (s.tag_label || s.tag) + '</span>' +
          '</div>' +
          '<div class="s-price-col">' +
            '<div class="s-price ' + dirClass + '">' + s.price + '</div>' +
            '<div class="s-change ' + dirClass + '">' + dirIcon + ' ' + s.change + '</div>' +
          '</div>' +
          '<div class="s-note-col s-note">' + s.note + '</div>' +
          '<div class="s-arrow-col expand-arrow">›</div>' +
          '<div class="stock-expand" style="grid-column:1/-1;">' +
            '<div class="stock-expand-inner">' +
              '<div><div class="se-label">觀察重點</div><div class="se-value">' + (s.watch_note || '—') + '</div></div>' +
              '<div><div class="se-label">技術面 / 籌碼</div><div class="se-value">' + (s.tech_note || '—') + '</div></div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderNews(containerId, newsItems) {
      var container = document.getElementById(containerId);
      container.innerHTML = '<div class="news-strip">' +
        newsItems.map(function(n) {
          return '<div class="news-strip-item">' +
            '<div class="news-dot"></div>' +
            '<div class="news-strip-text">' + n.text + '</div>' +
            '<div class="news-strip-time">' + n.time + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }

    async function loadData() {
      var res = await fetch('../data/daily.json');
      var data = await res.json();

      var d = new Date(data.date);
      document.getElementById('market-date').innerHTML =
        d.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) +
        '<br>UTC+8 台北時間';

      if (data.market) {
        if (data.market.us_stocks) renderStocks('us-stocks-list', data.market.us_stocks);
        if (data.market.us_news) renderNews('us-news-list', data.market.us_news);
        if (data.market.tw_stocks) renderStocks('tw-stocks-list', data.market.tw_stocks);
        if (data.market.tw_news) renderNews('tw-news-list', data.market.tw_news);

        if (data.market.crypto) {
          document.getElementById('crypto-grid').innerHTML = data.market.crypto.map(function(c) {
            var dirClass = c.dir === 'up' ? 'up' : c.dir === 'down' ? 'down' : 'flat';
            var dirIcon = c.dir === 'up' ? '▲' : c.dir === 'down' ? '▼' : '—';
            return '<div class="crypto-card" onclick="toggleCrypto(this)">' +
              '<div class="cc-header">' +
                '<div><div class="cc-symbol">' + c.symbol + '</div><div class="cc-name">' + c.name + '</div></div>' +
                '<span class="cc-signal ' + (c.signal || 'watch') + '">' + (c.signal_label || '觀察') + '</span>' +
              '</div>' +
              '<div class="cc-price ' + dirClass + '">' + c.price + '</div>' +
              '<div class="cc-change ' + dirClass + '">' + dirIcon + ' ' + c.change + '</div>' +
              '<div class="cc-stats">' +
                '<div><div class="cc-stat-label">24H 高</div><div class="cc-stat-value">' + (c.high || '--') + '</div></div>' +
                '<div><div class="cc-stat-label">24H 低</div><div class="cc-stat-value">' + (c.low || '--') + '</div></div>' +
                '<div><div class="cc-stat-label">市值</div><div class="cc-stat-value">' + (c.market_cap || '--') + '</div></div>' +
                '<div><div class="cc-stat-label">成交量</div><div class="cc-stat-value">' + (c.volume || '--') + '</div></div>' +
              '</div>' +
              '<div class="cc-expand">' +
                '<div class="cc-divider"></div>' +
                '<div class="cc-expand-grid">' +
                  '<div><div class="cc-expand-label">支撐位</div><div class="cc-expand-value">' + (c.support || '—') + '</div></div>' +
                  '<div><div class="cc-expand-label">壓力位</div><div class="cc-expand-value">' + (c.resistance || '—') + '</div></div>' +
                  '<div><div class="cc-expand-label">技術面</div><div class="cc-expand-value">' + (c.tech_note || '—') + '</div></div>' +
                  '<div><div class="cc-expand-label">觀察重點</div><div class="cc-expand-value">' + (c.watch_note || '—') + '</div></div>' +
                '</div>' +
              '</div>' +
            '</div>';
          }).join('');
        }

        if (data.market.crypto_news) renderNews('crypto-news-list', data.market.crypto_news);
      }
    }

    loadData();
  </script>
</body>
</html>
