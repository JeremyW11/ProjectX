<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectX — 市場總覽</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root {
      --bg-base: #05060f; --bg-card: rgba(255,255,255,0.04); --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08); --text-primary: #f0f0f5; --text-secondary: #a8a8c8;
      --text-muted: #7070a0; --accent-blue: #4da6ff; --accent-purple: #9f7aea;
      --accent-green: #48bb78; --accent-red: #fc8181; --accent-orange: #f6ad55; --accent-teal: #38b2ac;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-base); color: var(--text-primary); min-height: 100vh; background-image: radial-gradient(ellipse 80% 50% at 20% 0%, rgba(77,99,255,0.07) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 0%, rgba(159,122,234,0.06) 0%, transparent 50%); }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 60px; border-bottom: 1px solid var(--border); background: rgba(5,6,15,0.95); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 200; }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #4da6ff, #9f7aea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 17px; font-weight: 500; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); padding-bottom: 2px; }
    .nav-right { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .btn { padding: 7px 16px; border-radius: 8px; font-size: 17px; font-weight: 500; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-glow { background: linear-gradient(135deg, #4da6ff, #9f7aea); color: #fff; box-shadow: 0 0 20px rgba(77,166,255,0.3); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--text-primary); border-radius: 2px; transition: all 0.3s; }
    .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
    .mobile-menu { display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 0; background: rgba(5,6,15,0.98); backdrop-filter: blur(20px); z-index: 199; padding: 24px; flex-direction: column; gap: 8px; overflow-y: auto; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { color: var(--text-secondary); text-decoration: none; font-size: 18px; font-weight: 600; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .mobile-menu a.active { color: var(--accent-blue); }
    .mobile-menu-btns { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .mobile-menu-btns .btn { width: 100%; padding: 12px; font-size: 17px; text-align: center; }
    main { max-width: 1440px; margin: 0 auto; padding: 28px 40px 60px; }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
    .top-bar h1 { font-size: 20px; font-weight: 600; }
    .top-bar .meta { font-size: 16px; color: var(--text-muted); text-align: right; line-height: 1.8; }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .tab-btn { padding: 10px 24px; border-radius: 8px 8px 0 0; font-size: 17px; font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; background: transparent; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { color: var(--text-secondary); }
    .tab-btn.active { color: var(--text-primary); border-bottom: 2px solid var(--accent-blue); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .glass-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .card-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
    .index-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
    .index-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; position: relative; overflow: hidden; }
    .index-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .index-card.up::before { background: linear-gradient(90deg, transparent, var(--accent-green), transparent); }
    .index-card.down::before { background: linear-gradient(90deg, transparent, var(--accent-red), transparent); }
    .index-card.flat::before { background: linear-gradient(90deg, transparent, var(--text-muted), transparent); }
    .ic-label { font-size: 15px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 8px; }
    .ic-value { font-size: 28px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
    .ic-change { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .ic-stats { display: flex; gap: 16px; }
    .ic-stat-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .ic-stat-value { font-size: 16px; font-weight: 600; color: var(--text-secondary); }
    .sentiment-bar-us { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .sentiment-bar-tw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .sentiment-bar-crypto { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .sent-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: center; }
    .sent-label { font-size: 14px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
    .sent-value { font-size: 20px; font-weight: 800; margin-bottom: 2px; }
    .sent-sub { font-size: 15px; color: var(--text-muted); }
    .stock-header-row { display: grid; grid-template-columns: 160px 1fr 100px 100px 80px 20px; gap: 12px; padding: 8px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .stock-header-row span { font-size: 14px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
    .stock-item { display: grid; grid-template-columns: 160px 1fr 100px 100px 80px 20px; gap: 12px; align-items: center; padding: 13px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; transition: background 0.2s; margin: 0 -6px; }
    .stock-item:last-child { border-bottom: none; }
    .stock-item:hover { background: rgba(255,255,255,0.02); }
    .stock-item.open { background: rgba(255,255,255,0.02); }
    .s-ticker { font-size: 16px; font-weight: 700; }
    .s-name { font-size: 15px; color: var(--text-muted); margin-top: 1px; }
    .s-price { font-size: 17px; font-weight: 700; }
    .s-change { font-size: 16px; font-weight: 600; }
    .s-tag { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; }
    .tag-ai { background: rgba(159,122,234,0.1); color: var(--accent-purple); border: 1px solid rgba(159,122,234,0.2); }
    .tag-semi { background: rgba(77,166,255,0.1); color: var(--accent-blue); border: 1px solid rgba(77,166,255,0.15); }
    .tag-server { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.15); }
    .tag-energy { background: rgba(246,173,85,0.1); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.2); }
    .s-note { font-size: 16px; color: var(--text-secondary); line-height: 1.5; }
    .expand-arrow { font-size: 16px; color: var(--text-muted); transition: transform 0.3s; }
    .stock-expand { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.3s ease; opacity: 0; }
    .stock-item.open .stock-expand { max-height: 160px; opacity: 1; }
    .stock-expand-inner { padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .se-label { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; font-weight: 600; }
    .se-value { font-size: 16px; color: var(--text-secondary); line-height: 1.5; }
    .crypto-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    .crypto-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
    .crypto-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .crypto-card.up::before { background: linear-gradient(90deg, transparent, var(--accent-green), transparent); }
    .crypto-card.down::before { background: linear-gradient(90deg, transparent, var(--accent-red), transparent); }
    .crypto-card:hover { background: rgba(255,255,255,0.06); }
    .crypto-card.open { background: rgba(255,255,255,0.06); }
    .cc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .cc-symbol { font-size: 16px; font-weight: 800; }
    .cc-name { font-size: 15px; color: var(--text-muted); margin-top: 1px; }
    .cc-signal { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .cc-price { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .cc-change { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
    .cc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cc-stat-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .cc-stat-value { font-size: 16px; font-weight: 600; color: var(--text-secondary); }
    .cc-expand { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.3s ease; opacity: 0; }
    .crypto-card.open .cc-expand { max-height: 180px; opacity: 1; }
    .cc-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 14px 0; }
    .cc-expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cc-expand-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; font-weight: 600; }
    .cc-expand-value { font-size: 16px; color: var(--text-secondary); line-height: 1.5; }
    .crypto-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .co-item { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .co-label { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600; }
    .co-value { font-size: 18px; font-weight: 800; color: var(--text-primary); margin-bottom: 2px; }
    .co-sub { font-size: 15px; color: var(--text-muted); }
    .news-strip { margin-top: 4px; }
    .news-strip-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); align-items: flex-start; }
    .news-strip-item:last-child { border-bottom: none; }
    .news-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-blue); flex-shrink: 0; margin-top: 6px; }
    .news-strip-text { font-size: 16px; color: var(--text-secondary); line-height: 1.6; flex: 1; }
    .news-strip-time { font-size: 14px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .rotation-item { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .rotation-item:last-child { border-bottom: none; }
    .rotation-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .rotation-from { font-size: 17px; color: var(--accent-red); font-weight: 700; }
    .rotation-arrow { color: var(--text-muted); font-size: 16px; }
    .rotation-to { font-size: 17px; color: var(--accent-green); font-weight: 700; }
    .rotation-strength { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: rgba(246,173,85,0.08); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }
    .rotation-reason { font-size: 16px; color: var(--text-muted); line-height: 1.5; }
    .up { color: var(--accent-green); } .down { color: var(--accent-red); } .flat { color: var(--text-muted); }
    .bull { background: rgba(72,187,120,0.1); color: var(--accent-green); border: 1px solid rgba(72,187,120,0.2); }
    .bear { background: rgba(252,129,129,0.1); color: var(--accent-red); border: 1px solid rgba(252,129,129,0.2); }
    .watch { background: rgba(246,173,85,0.08); color: var(--accent-orange); border: 1px solid rgba(246,173,85,0.15); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) {
      nav { padding: 0 16px; }
      .nav-links { display: none; } .nav-right { display: none; }
      .hamburger { display: flex; }
      main { padding: 16px 16px 40px; }
      .top-bar { flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 16px; }
      .top-bar .meta { text-align: left; font-size: 15px; }
      .tabs { overflow-x: auto; gap: 0; }
      .tab-btn { padding: 10px 16px; font-size: 16px; }
      .index-grid { grid-template-columns: 1fr; gap: 10px; }
      .sentiment-bar-us, .sentiment-bar-tw, .sentiment-bar-crypto { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .crypto-overview { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .crypto-grid { grid-template-columns: 1fr; gap: 10px; }
      .stock-header-row { display: none; }
      .stock-item { grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 6px; padding: 12px 6px; }
      .s-ticker-col { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 8px; }
      .s-price-col { grid-column: 2; grid-row: 1; text-align: right; }
      .s-note-col { grid-column: 1 / -1; grid-row: 2; }
      .s-arrow-col { display: none; }
      .stock-item.open .stock-expand { max-height: 200px; }
      .stock-expand-inner { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .glass-card { padding: 14px; border-radius: 12px; }
    }
  </style>
</head>

  <script>
    function toggleMenu() {
      var menu = document.getElementById('mobile-menu');
      var hamburger = document.getElementById('hamburger');
      menu.classList.toggle('open');
      hamburger.classList.toggle('open');
      document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
      document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');
    }

    function toggleStock(el) {
      var isOpen = el.classList.contains('open');
      document.querySelectorAll('.stock-item.open').forEach(function(item) {
        item.classList.remove('open');
        var arrow = item.querySelector('.expand-arrow');
        if (arrow) arrow.style.transform = 'rotate(0deg)';
      });
      if (!isOpen) {
        el.classList.add('open');
        var arrow = el.querySelector('.expand-arrow');
        if (arrow) arrow.style.transform = 'rotate(90deg)';
      }
    }

    function toggleCrypto(el) {
      var isOpen = el.classList.contains('open');
      document.querySelectorAll('.crypto-card.open').forEach(function(item) { item.classList.remove('open'); });
      if (!isOpen) el.classList.add('open');
    }

    function renderStocks(containerId, stocks) {
      var container = document.getElementById(containerId);
      container.innerHTML = stocks.map(function(s) {
        var dirClass = s.dir === 'up' ? 'up' : s.dir === 'down' ? 'down' : 'flat';
        var dirIcon = s.dir === 'up' ? '▲' : s.dir === 'down' ? '▼' : '—';
        return '<div class="stock-item" onclick="toggleStock(this)">' +
          '<div class="s-ticker-col"><div><div class="s-ticker">' + s.ticker + '</div><div class="s-name">' + s.name + '</div></div></div>' +
          '<div class="s-note-col s-note">' + s.note + '</div>' +
          '<div class="s-price ' + dirClass + '">' + s.price + '</div>' +
          '<div class="s-change ' + dirClass + '">' + dirIcon + ' ' + s.change + '</div>' +
          '<div><span class="s-tag tag-' + (s.tag || 'ai') + '">' + (s.tag_label || s.tag) + '</span></div>' +
          '<div class="s-arrow-col expand-arrow">›</div>' +
          '<div class="stock-expand" style="grid-column:1/-1;">' +
            '<div class="stock-expand-inner">' +
              '<div><div class="se-label">觀察重點</div><div class="se-value">' + (s.watch_note || '—') + '</div></div>' +
              '<div><div class="se-label">技術面 / 籌碼</div><div class="se-value">' + (s.tech_note || '—') + '</div></div>' +
              (s.action ? '<div style="grid-column:1/-1;margin-top:8px;padding:8px 12px;background:rgba(246,173,85,0.08);border-radius:8px;border-left:2px solid var(--accent-orange);"><div class="se-label" style="color:var(--accent-orange);margin-bottom:3px;">操作建議</div><div class="se-value" style="color:var(--accent-orange);font-weight:600;">' + s.action + '</div></div>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderNews(containerId, newsItems) {
      var container = document.getElementById(containerId);
      if (!container || !newsItems) return;
      container.innerHTML = '<div class="news-strip">' +
        newsItems.map(function(n) {
          return '<div class="news-strip-item"><div class="news-dot"></div><div class="news-strip-text">' + n.text + '</div><div class="news-strip-time">' + n.time + '</div></div>';
        }).join('') + '</div>';
    }

    function renderRotation(containerId, rotation) {
      var container = document.getElementById(containerId);
      if (!container || !rotation) return;
      container.innerHTML = rotation.map(function(r) {
        return '<div class="rotation-item">' +
          '<div class="rotation-row"><span class="rotation-from">' + r.from + '</span><span class="rotation-arrow">→</span><span class="rotation-to">' + r.to + '</span><span class="rotation-strength">' + r.strength + '</span></div>' +
          '<div class="rotation-reason">' + r.reason + '</div></div>';
      }).join('');
    }

    function renderIndexCard(label, value, change, dir, sub) {
      var dirClass = dir === 'up' ? 'up' : dir === 'down' ? 'down' : 'flat';
      var dirIcon = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
      return '<div class="index-card ' + dirClass + '">' +
        '<div class="ic-label">' + label + '</div>' +
        '<div class="ic-value">' + value + '</div>' +
        '<div class="ic-change ' + dirClass + '">' + dirIcon + ' ' + change + '</div>' +
        '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">' + sub + '</div></div></div>' +
      '</div>';
    }

    async function loadData() {
      var res = await fetch('../data/daily.json');
      var data = await res.json();

      var d = new Date(data.date);
      document.getElementById('market-date').innerHTML =
        d.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) + '<br>UTC+8 台北時間';

      // ── tickers
      var spx = data.tickers ? data.tickers.find(function(t) { return t.label === 'S&P 500'; }) : null;
      var ndx = data.tickers ? data.tickers.find(function(t) { return t.label === 'NASDAQ'; }) : null;
      var brent = data.tickers ? data.tickers.find(function(t) { return t.label === 'Brent 原油'; }) : null;
      var fg = data.sentiment && data.sentiment.fear_greed ? data.sentiment.fear_greed : null;
      var cg = data.sentiment && data.sentiment.coinglass ? data.sentiment.coinglass : null;

      // ── 美股：若 SPX ticker 是 '--'，從 us_stocks 找 SPY/TSM 推算
      // Polygon 覆蓋邏輯在 server.js 端，前端直接讀 tickers
      var spxVal = spx && spx.value !== '--' ? spx.value : '--';
      var spxChange = spx && spx.change !== '--' ? spx.change : '--';
      var spxDir = spx ? spx.dir : 'flat';
      var ndxVal = ndx && ndx.value !== '--' ? ndx.value : '--';
      var ndxChange = ndx && ndx.change !== '--' ? ndx.change : '--';
      var ndxDir = ndx ? ndx.dir : 'flat';

      // ── 美股指數卡
      document.getElementById('us-index-grid').innerHTML =
        renderIndexCard('S&P 500', spxVal, spxChange, spxDir, 'Polygon / SPY') +
        renderIndexCard('NASDAQ', ndxVal, ndxChange, ndxDir, 'Polygon / QQQ') +
        '<div class="index-card ' + (fg ? (parseInt(fg.value) >= 50 ? 'up' : 'down') : 'flat') + '">' +
          '<div class="ic-label">市場情緒</div>' +
          '<div class="ic-value" style="font-size:36px;color:' + (fg ? (parseInt(fg.value) >= 50 ? 'var(--accent-green)' : parseInt(fg.value) >= 30 ? 'var(--accent-orange)' : 'var(--accent-red)') : 'var(--text-muted)') + ';">' + (fg ? fg.value : '--') + '</div>' +
          '<div class="ic-change ' + (fg ? (parseInt(fg.value) >= 50 ? 'up' : 'down') : 'flat') + '">' + (fg ? fg.label : 'Fear & Greed') + '</div>' +
          '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">較昨日</div><div class="ic-stat-value">' + (fg ? (fg.change || '--') : '--') + '</div></div></div>' +
        '</div>';

      // ── 美股 Sentiment Bar（3欄，不含加密）
      // brent.value 本身已含 $，不需再加
      var brentDisplay = brent ? brent.value : '--';
      var brentChange = brent ? brent.change : '--';
      document.getElementById('us-sentiment-bar').innerHTML =
        '<div class="sent-item"><div class="sent-label">Fear & Greed</div><div class="sent-value" style="color:var(--accent-orange);">' + (fg ? fg.value : '--') + '</div><div class="sent-sub">' + (fg ? fg.label : '--') + '</div></div>' +
        '<div class="sent-item"><div class="sent-label">NASDAQ 漲跌</div><div class="sent-value ' + ndxDir + '" style="font-size:16px;">' + (ndxChange !== '--' ? (ndxDir === 'up' ? '▲ ' : ndxDir === 'down' ? '▼ ' : '— ') + ndxChange : '--') + '</div><div class="sent-sub">今日表現</div></div>' +
        '<div class="sent-item"><div class="sent-label">Brent 原油</div><div class="sent-value" style="color:var(--accent-orange);font-size:18px;">' + brentDisplay + '</div><div class="sent-sub">' + brentChange + '</div></div>';

      if (data.market && data.market.us_stocks) renderStocks('us-stocks-list', data.market.us_stocks);
      if (data.market && data.market.us_news) renderNews('us-news-list', data.market.us_news);
      if (data.industry_detail && data.industry_detail.rotation) renderRotation('us-rotation', data.industry_detail.rotation);

      // ── 台股
      var twIdx = data.tickers ? data.tickers.find(function(t) { return t.label === '台股加權'; }) : null;
      var twSummary = data.tw_market_summary || {};
      var tradeVal = twSummary.trade_value || '--';
      var foreignNet = twSummary.foreign_net || '--';
      var foreignDir = foreignNet.indexOf('買超') >= 0 ? 'up' : foreignNet.indexOf('賣超') >= 0 ? 'down' : 'flat';
      var foreignColor = foreignDir === 'up' ? 'var(--accent-green)' : foreignDir === 'down' ? 'var(--accent-red)' : 'var(--text-muted)';

      document.getElementById('tw-index-grid').innerHTML =
        renderIndexCard('台股加權指數', twIdx ? twIdx.value : '--', twIdx ? twIdx.change : '--', twIdx ? twIdx.dir : 'flat', 'TAIEX') +
        '<div class="index-card flat">' +
          '<div class="ic-label">今日成交量</div>' +
          '<div class="ic-value" style="font-size:' + (tradeVal === '--' ? '28px' : '20px') + ';">' + tradeVal + '</div>' +
          '<div class="ic-change flat">台股總成交</div>' +
          '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">TWSE</div></div></div>' +
        '</div>' +
        '<div class="index-card ' + foreignDir + '">' +
          '<div class="ic-label">外資動向</div>' +
          '<div class="ic-value" style="font-size:' + (foreignNet === '--' ? '28px' : '18px') + ';color:' + foreignColor + ';">' + foreignNet + '</div>' +
          '<div class="ic-change flat">三大法人</div>' +
          '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">TWSE BFI82U</div></div></div>' +
        '</div>';

      document.getElementById('tw-sentiment-bar').innerHTML =
        '<div class="sent-item"><div class="sent-label">加權指數</div><div class="sent-value ' + (twIdx ? twIdx.dir : 'flat') + '" style="font-size:16px;">' + (twIdx ? (twIdx.dir === 'up' ? '▲ ' : twIdx.dir === 'down' ? '▼ ' : '— ') + twIdx.change : '--') + '</div><div class="sent-sub">' + (twIdx ? twIdx.value : '--') + '</div></div>' +
        '<div class="sent-item"><div class="sent-label">今日成交量</div><div class="sent-value" style="font-size:15px;color:var(--accent-blue);">' + tradeVal + '</div><div class="sent-sub">TWSE</div></div>' +
        '<div class="sent-item"><div class="sent-label">外資買賣超</div><div class="sent-value" style="font-size:14px;color:' + foreignColor + ';">' + foreignNet + '</div><div class="sent-sub">三大法人</div></div>';

      if (data.market && data.market.tw_stocks) renderStocks('tw-stocks-list', data.market.tw_stocks);
      if (data.market && data.market.tw_news) renderNews('tw-news-list', data.market.tw_news);
      if (data.industry_detail && data.industry_detail.rotation) renderRotation('tw-rotation', data.industry_detail.rotation);

      // ── 虛擬貨幣 Sentiment Bar（4欄）
      document.getElementById('crypto-sentiment-bar').innerHTML =
        '<div class="sent-item"><div class="sent-label">Fear & Greed</div><div class="sent-value" style="color:var(--accent-orange);">' + (fg ? fg.value : '--') + '</div><div class="sent-sub">' + (fg ? fg.label : '--') + '</div></div>' +
        '<div class="sent-item"><div class="sent-label">BTC 多空比</div><div class="sent-value" style="color:var(--accent-blue);font-size:12px;line-height:1.3;">' + (cg && cg.long_short_ratio ? cg.long_short_ratio : '未取得') + '</div><div class="sent-sub">CoinGlass</div></div>' +
        '<div class="sent-item"><div class="sent-label">BTC 資金費率</div><div class="sent-value" style="font-size:14px;color:var(--accent-green);">' + (cg && cg.funding_rate ? cg.funding_rate : '未取得') + '</div><div class="sent-sub">永續合約</div></div>' +
        '<div class="sent-item"><div class="sent-label">BTC 多單清算</div><div class="sent-value" style="font-size:15px;color:var(--accent-red);">' + (cg ? (cg.btc_long_liq || '--') : '--') + '</div><div class="sent-sub">空單 ' + (cg ? (cg.btc_short_liq || '--') : '--') + '</div></div>';

      // ── 加密市值概覽
      var btc = data.market && data.market.crypto ? data.market.crypto.find(function(c){return c.symbol==='BTC';}) : null;
      var eth = data.market && data.market.crypto ? data.market.crypto.find(function(c){return c.symbol==='ETH';}) : null;
      document.getElementById('crypto-overview').innerHTML =
        '<div class="co-item"><div class="co-label">BTC 市值</div><div class="co-value">' + (btc ? btc.market_cap : '--') + '</div><div class="co-sub">Bitcoin</div></div>' +
        '<div class="co-item"><div class="co-label">BTC 24H 交易量</div><div class="co-value">' + (btc ? btc.volume : '--') + '</div><div class="co-sub">全球成交量</div></div>' +
        '<div class="co-item"><div class="co-label">ETH 市值</div><div class="co-value">' + (eth ? eth.market_cap : '--') + '</div><div class="co-sub">Ethereum</div></div>';

      // ── 加密個幣卡片
      if (data.market && data.market.crypto) {
        document.getElementById('crypto-grid').innerHTML = data.market.crypto.map(function(c) {
          var dirClass = c.dir === 'up' ? 'up' : c.dir === 'down' ? 'down' : 'flat';
          var dirIcon = c.dir === 'up' ? '▲' : c.dir === 'down' ? '▼' : '—';
          return '<div class="crypto-card ' + dirClass + '" onclick="toggleCrypto(this)">' +
            '<div class="cc-header"><div><div class="cc-symbol">' + c.symbol + '</div><div class="cc-name">' + c.name + '</div></div><span class="cc-signal ' + (c.signal||'watch') + '">' + (c.signal_label||'觀察') + '</span></div>' +
            '<div class="cc-price ' + dirClass + '">' + c.price + '</div>' +
            '<div class="cc-change ' + dirClass + '">' + dirIcon + ' ' + c.change + '</div>' +
            '<div class="cc-stats">' +
              '<div><div class="cc-stat-label">市值</div><div class="cc-stat-value">' + (c.market_cap||'--') + '</div></div>' +
              '<div><div class="cc-stat-label">成交量</div><div class="cc-stat-value">' + (c.volume||'--') + '</div></div>' +
            '</div>' +
            '<div class="cc-expand"><div class="cc-divider"></div>' +
              '<div class="cc-expand-grid">' +
                '<div><div class="cc-expand-label">支撐位</div><div class="cc-expand-value">' + (c.support||'—') + '</div></div>' +
                '<div><div class="cc-expand-label">壓力位</div><div class="cc-expand-value">' + (c.resistance||'—') + '</div></div>' +
                '<div><div class="cc-expand-label">技術面</div><div class="cc-expand-value">' + (c.tech_note||'—') + '</div></div>' +
                '<div><div class="cc-expand-label">觀察重點</div><div class="cc-expand-value">' + (c.watch_note||'—') + '</div></div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      if (data.market && data.market.crypto_news) renderNews('crypto-news-list', data.market.crypto_news);

      // ── 清算詳情
      document.getElementById('crypto-liquidation').innerHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">' +
          '<div style="background:rgba(72,187,120,0.05);border:1px solid rgba(72,187,120,0.15);border-radius:8px;padding:12px;">' +
            '<div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">BTC 多單清算</div>' +
            '<div style="font-size:18px;font-weight:700;color:var(--accent-green);">' + (cg ? (cg.btc_long_liq||'--') : '--') + '</div>' +
          '</div>' +
          '<div style="background:rgba(252,129,129,0.05);border:1px solid rgba(252,129,129,0.15);border-radius:8px;padding:12px;">' +
            '<div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">BTC 空單清算</div>' +
            '<div style="font-size:18px;font-weight:700;color:var(--accent-red);">' + (cg ? (cg.btc_short_liq||'--') : '--') + '</div>' +
          '</div>' +
          '<div style="background:rgba(72,187,120,0.05);border:1px solid rgba(72,187,120,0.15);border-radius:8px;padding:12px;">' +
            '<div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">ETH 多單清算</div>' +
            '<div style="font-size:18px;font-weight:700;color:var(--accent-green);">' + (cg ? (cg.eth_long_liq||'--') : '--') + '</div>' +
          '</div>' +
          '<div style="background:rgba(252,129,129,0.05);border:1px solid rgba(252,129,129,0.15);border-radius:8px;padding:12px;">' +
            '<div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">ETH 空單清算</div>' +
            '<div style="font-size:18px;font-weight:700;color:var(--accent-red);">' + (cg ? (cg.eth_short_liq||'--') : '--') + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;font-weight:600;">資金費率</div>' +
        '<div style="font-size:15px;color:var(--accent-green);font-weight:700;margin-bottom:10px;">' + (cg ? (cg.funding_rate||'未取得') : '未取得') + '</div>' +
        '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;font-weight:600;">多空比</div>' +
        '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;">' + (cg ? (cg.long_short_ratio||'未取得') : '未取得') + '</div>' +
        (cg && cg.note ? '<div style="font-size:12px;color:var(--text-muted);padding-top:10px;border-top:1px solid rgba(255,255,255,0.04);">' + cg.note + '</div>' : '');
    }

    loadData();
  </script>
</body>
</html>
