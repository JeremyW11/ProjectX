<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project X · 市場數據</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7;
  --red-700:#b91c1c; --red-600:#dc2626; --red-100:#fee2e2;
  --amber-700:#b45309; --amber-600:#d97706; --amber-100:#fef3c7;

  /* 原有 JS 相容變數 */
  --bg-base:#f7f8fc; --bg-card:#ffffff; --bg-card-hover:#f1f5f9;
  --border:#e2e8f0; --text-primary:#0f172a; --text-secondary:#475569;
  --text-muted:#94a3b8; --accent-blue:#2563eb; --accent-purple:#7c3aed;
  --accent-green:#16a34a; --accent-red:#dc2626; --accent-orange:#d97706;
  --accent-teal:#0891b2;

  --font-en:'DM Sans',sans-serif; --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
  --shadow-hover:0 4px 24px rgba(15,23,42,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-zh);background:var(--bg-base);color:var(--text-primary);min-height:100vh;background-image:none;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;font-family:inherit;}
ul{list-style:none;}

/* ── TOPBAR ── */
nav{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:200;}
.logo{display:flex;align-items:center;gap:10px;margin-right:36px;flex-shrink:0;}
.logo-mark{width:32px;height:32px;background:var(--navy-700);border-radius:8px;display:grid;place-items:center;transition:transform .3s;}
.logo-mark:hover{transform:rotate(45deg) scale(1.05);}
.logo-main{font-family:var(--font-en);font-size:13.5px;font-weight:600;color:var(--navy-800);letter-spacing:.05em;}
.logo-sub{font-size:9.5px;color:var(--gray-400);letter-spacing:.08em;font-family:var(--font-en);}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;}
.nav-links a{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-sm);font-size:13.5px;color:var(--gray-500);font-weight:400;transition:all .15s;white-space:nowrap;font-family:var(--font-zh);border-bottom:none;}
.nav-links a:hover{background:var(--navy-50);color:var(--navy-700);}
.nav-links a.active{background:var(--navy-50);color:var(--navy-600);font-weight:500;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-400);display:inline-block;}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green-100);color:var(--green-600);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:var(--font-en);}
.live-dot{width:5px;height:5px;background:var(--green-600);border-radius:50%;animation:pulse 2s infinite;display:inline-block;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header-time{font-family:var(--font-en);font-size:12px;color:var(--gray-400);}
.btn{padding:7px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:var(--font-en);}
.btn-ghost{background:var(--white);border:1px solid var(--gray-300);color:var(--gray-700);}
.btn-ghost:hover{border-color:var(--navy-400);color:var(--navy-700);}
.btn-glow{background:var(--navy-700);color:var(--white);box-shadow:none;border:none;}
.btn-glow:hover{background:var(--navy-600);transform:translateY(-1px);}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;}
.hamburger span{display:block;width:22px;height:2px;background:var(--gray-700);border-radius:2px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.mobile-menu{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);z-index:199;padding:24px;flex-direction:column;gap:4px;overflow-y:auto;border-top:1px solid var(--gray-200);}
.mobile-menu.open{display:flex;}
.mobile-menu a{color:var(--gray-600);font-size:16px;font-weight:500;padding:13px 0;border-bottom:1px solid var(--gray-100);font-family:var(--font-zh);}
.mobile-menu a.active{color:var(--navy-600);}
.mobile-menu-btns{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
.mobile-menu-btns .btn{width:100%;padding:12px;font-size:14px;text-align:center;}

/* ── PAGE ── */
main{margin-top:56px;max-width:1440px;margin-left:auto;margin-right:auto;padding:28px 24px 60px;}
.top-bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;}
.top-bar h1{font-family:var(--font-display);font-size:26px;color:var(--navy-950);}
.top-bar .meta{font-size:12px;color:var(--gray-400);text-align:right;line-height:1.8;font-family:var(--font-en);}

/* ── TAB BAR ── */
.tabs{display:flex;gap:0;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:5px;margin-bottom:22px;box-shadow:var(--shadow-card);width:fit-content;}
.tab-btn{display:flex;align-items:center;gap:7px;padding:9px 22px;border-radius:var(--r-md);font-size:14px;font-weight:500;color:var(--gray-500);font-family:var(--font-zh);transition:all .2s;cursor:pointer;white-space:nowrap;border:none;background:transparent;border-bottom:none;}
.tab-btn:hover{color:var(--navy-700);background:var(--navy-50);}
.tab-btn.active{background:var(--navy-700);color:var(--white);box-shadow:0 2px 8px rgba(29,45,90,.2);}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* ── CARDS ── */
.glass-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:18px 20px;backdrop-filter:none;margin-bottom:12px;box-shadow:var(--shadow-card);}
.glass-card:hover{box-shadow:var(--shadow-hover);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--gray-100);}
.card-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--gray-900);font-family:var(--font-zh);}

/* ── INDEX GRID ── */
.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.index-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
.index-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.index-card.up::before{background:var(--green-600);}
.index-card.down::before{background:var(--red-600);}
.index-card.flat::before{background:var(--gray-300);}
.ic-label{font-size:10px;color:var(--gray-400);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;font-family:var(--font-en);}
.ic-value{font-size:26px;font-weight:600;color:var(--gray-900);margin-bottom:4px;font-family:var(--font-en);letter-spacing:-.01em;}
.ic-change{font-size:13px;font-weight:600;margin-bottom:10px;font-family:var(--font-en);}
.ic-stats{display:flex;gap:14px;}
.ic-stat-label{font-size:9.5px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;font-family:var(--font-en);}
.ic-stat-value{font-size:12px;font-weight:500;color:var(--gray-500);font-family:var(--font-en);}

/* ── SENTIMENT BAR ── */
.sentiment-bar-us,.sentiment-bar-tw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.sentiment-bar-crypto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.sent-item{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:12px 14px;text-align:center;box-shadow:var(--shadow-card);}
.sent-label{font-size:10px;color:var(--gray-400);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;font-weight:600;font-family:var(--font-en);}
.sent-value{font-size:18px;font-weight:700;margin-bottom:2px;font-family:var(--font-en);}
.sent-sub{font-size:11px;color:var(--gray-400);font-family:var(--font-en);}

/* ── TWO COL ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ── STOCK TABLE ── */
.stock-header-row{display:grid;grid-template-columns:160px 1fr 100px 100px 80px 20px;gap:12px;padding:7px 6px;border-bottom:1px solid var(--gray-100);margin-bottom:3px;}
.stock-header-row span{font-size:10px;font-weight:600;color:var(--gray-400);letter-spacing:.06em;text-transform:uppercase;font-family:var(--font-en);}
.stock-item{display:grid;grid-template-columns:160px 1fr 100px 100px 80px 20px;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--gray-100);border-radius:var(--r-sm);cursor:pointer;transition:background .15s;margin:0 -6px;}
.stock-item:last-child{border-bottom:none;}
.stock-item:hover{background:var(--navy-50);}
.stock-item.open{background:var(--navy-50);}
.s-ticker{font-size:14px;font-weight:700;color:var(--gray-900);font-family:var(--font-en);}
.s-name{font-size:11px;color:var(--gray-400);margin-top:1px;font-family:var(--font-zh);}
.s-price{font-size:14px;font-weight:600;font-family:var(--font-en);}
.s-change{font-size:13px;font-weight:600;font-family:var(--font-en);}
.s-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;display:inline-block;margin-top:3px;font-family:var(--font-en);}
.tag-ai{background:#ede9fe;color:#6d28d9;}
.tag-semi{background:var(--navy-50);color:var(--navy-600);}
.tag-server{background:var(--green-100);color:var(--green-700);}
.tag-energy{background:var(--amber-100);color:var(--amber-700);}
.s-note{font-size:12.5px;color:var(--gray-600);font-family:var(--font-zh);}
.expand-arrow{font-size:13px;color:var(--gray-400);transition:transform .3s;}
.stock-expand{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .3s;opacity:0;}
.stock-item.open .stock-expand{max-height:160px;opacity:1;}
.stock-expand-inner{padding-top:10px;border-top:1px solid var(--gray-100);margin-top:4px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.se-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:600;font-family:var(--font-en);}
.se-value{font-size:12.5px;color:var(--gray-600);line-height:1.5;font-family:var(--font-zh);}

/* ── CRYPTO CARDS ── */
.crypto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.crypto-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;box-shadow:var(--shadow-card);}
.crypto-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.crypto-card.up::before{background:var(--green-600);}
.crypto-card.down::before{background:var(--red-600);}
.crypto-card:hover{box-shadow:var(--shadow-hover);}
.crypto-card.open{border-color:var(--navy-300);}
.cc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.cc-symbol{font-size:15px;font-weight:700;color:var(--gray-900);font-family:var(--font-en);}
.cc-name{font-size:11px;color:var(--gray-400);margin-top:1px;font-family:var(--font-zh);}
.cc-signal{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;font-family:var(--font-en);}
.cc-price{font-size:22px;font-weight:600;margin-bottom:3px;font-family:var(--font-en);letter-spacing:-.01em;}
.cc-change{font-size:13px;font-weight:600;margin-bottom:12px;font-family:var(--font-en);}
.cc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cc-stat-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-family:var(--font-en);}
.cc-stat-value{font-size:12.5px;font-weight:600;color:var(--gray-600);font-family:var(--font-en);}
.cc-expand{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .3s;opacity:0;}
.crypto-card.open .cc-expand{max-height:180px;opacity:1;}
.cc-divider{height:1px;background:var(--gray-100);margin:12px 0;}
.cc-expand-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cc-expand-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:600;font-family:var(--font-en);}
.cc-expand-value{font-size:12.5px;color:var(--gray-600);line-height:1.5;font-family:var(--font-zh);}

/* ── CRYPTO OVERVIEW ── */
.crypto-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.co-item{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--shadow-card);}
.co-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-weight:600;font-family:var(--font-en);}
.co-value{font-size:17px;font-weight:600;color:var(--gray-900);margin-bottom:2px;font-family:var(--font-en);}
.co-sub{font-size:11px;color:var(--gray-400);font-family:var(--font-en);}

/* ── NEWS STRIP ── */
.news-strip{margin-top:2px;}
.news-strip-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray-100);align-items:flex-start;}
.news-strip-item:last-child{border-bottom:none;}
.news-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-400);flex-shrink:0;margin-top:5px;}
.news-strip-text{font-size:13px;color:var(--gray-600);line-height:1.6;flex:1;font-family:var(--font-zh);}
.news-strip-time{font-size:11px;color:var(--gray-400);white-space:nowrap;flex-shrink:0;font-family:var(--font-en);}

/* ── ROTATION ── */
.rotation-item{padding:10px 0;border-bottom:1px solid var(--gray-100);}
.rotation-item:last-child{border-bottom:none;}
.rotation-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.rotation-from{font-size:13px;color:var(--red-600);font-weight:700;font-family:var(--font-en);}
.rotation-arrow{color:var(--gray-400);font-size:13px;}
.rotation-to{font-size:13px;color:var(--green-600);font-weight:700;font-family:var(--font-en);}
.rotation-strength{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--amber-100);color:var(--amber-700);font-family:var(--font-en);}
.rotation-reason{font-size:12.5px;color:var(--gray-500);line-height:1.5;font-family:var(--font-zh);}

/* ── SIGNALS ── */
.up{color:var(--green-600);}
.down{color:var(--red-600);}
.flat{color:var(--gray-400);}
.bull{background:var(--green-100);color:var(--green-700);border:1px solid #bbf7d0;}
.bear{background:var(--red-100);color:var(--red-700);border:1px solid #fecaca;}
.watch{background:var(--amber-100);color:var(--amber-700);border:1px solid #fde68a;}
.neutral{background:var(--gray-100);color:var(--gray-500);border:1px solid var(--gray-200);}

/* ── RESPONSIVE ── */
@media(max-width:1024px){.two-col{grid-template-columns:1fr;}}
@media(max-width:768px){
  nav{padding:0 16px;}
  .nav-links,.nav-right{display:none;}
  .hamburger{display:flex;}
  main{padding:16px 16px 40px;}
  .top-bar{flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:14px;}
  .top-bar .meta{text-align:left;font-size:11px;}
  .tabs{overflow-x:auto;gap:0;width:100%;}
  .tab-btn{padding:9px 14px;font-size:13px;}
  .index-grid{grid-template-columns:1fr;gap:8px;}
  .sentiment-bar-us,.sentiment-bar-tw,.sentiment-bar-crypto{grid-template-columns:repeat(2,1fr);gap:8px;}
  .crypto-overview{grid-template-columns:repeat(2,1fr);gap:8px;}
  .crypto-grid{grid-template-columns:1fr;gap:10px;}
  .stock-header-row{display:none;}
  .stock-item{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:6px;padding:12px 6px;}
  .s-ticker-col{grid-column:1;grid-row:1;display:flex;align-items:center;gap:8px;}
  .s-price-col{grid-column:2;grid-row:1;text-align:right;}
  .s-note-col{grid-column:1/-1;grid-row:2;}
  .s-arrow-col{display:none;}
  .stock-item.open .stock-expand{max-height:200px;}
  .stock-expand-inner{grid-template-columns:1fr;}
  .glass-card{padding:14px 16px;}
}
</style>
</head>

<main>
  <div class="top-bar">
    <div>
      <h1>市場數據</h1>
      <div style="font-size:11px;color:var(--gray-400);margin-top:3px;font-family:var(--font-en);">

      </div>

    <div class="meta" id="market-date"></div>

  <!-- Tab bar：順序改為美股→台股→加密 -->

<script>
// Clock
function tick(){
  const t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  const el=document.getElementById('clock');
  if(el) el.textContent=t+' CST';
}
tick(); setInterval(tick,1000);

// Mobile menu
function toggleMenu(){
  var menu=document.getElementById('mobile-menu');
  var hamburger=document.getElementById('hamburger');
  menu.classList.toggle('open');
  hamburger.classList.toggle('open');
  document.body.style.overflow=menu.classList.contains('open')?'hidden':'';
}
document.getElementById('mobile-menu').querySelectorAll('a').forEach(function(a){
  a.addEventListener('click',function(){
    document.getElementById('mobile-menu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
    document.body.style.overflow='';
  });
});

// Topbar shadow
window.addEventListener('scroll',function(){
  document.querySelector('nav').style.boxShadow=window.scrollY>10?'0 2px 20px rgba(15,23,42,.08)':'';
});
</script>

<!-- 原有所有 JS 邏輯完整保留 -->
<script>
function switchTab(tab,btn){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(el){el.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}
function toggleStock(el){
  var isOpen=el.classList.contains('open');
  document.querySelectorAll('.stock-item.open').forEach(function(item){
    item.classList.remove('open');
    var arrow=item.querySelector('.expand-arrow');
    if(arrow) arrow.style.transform='rotate(0deg)';
  });
  if(!isOpen){
    el.classList.add('open');
    var arrow=el.querySelector('.expand-arrow');
    if(arrow) arrow.style.transform='rotate(90deg)';
  }
}
function toggleCrypto(el){
  var isOpen=el.classList.contains('open');
  document.querySelectorAll('.crypto-card.open').forEach(function(item){item.classList.remove('open');});
  if(!isOpen) el.classList.add('open');
}
function renderStocks(containerId,stocks){
  var container=document.getElementById(containerId);
  container.innerHTML=stocks.map(function(s){
    var dirClass=s.dir==='up'?'up':s.dir==='down'?'down':'flat';
    var dirIcon=s.dir==='up'?'▲':s.dir==='down'?'▼':'—';
    return '<div class="stock-item" onclick="toggleStock(this)">'+
      '<div class="s-ticker-col"><div><div class="s-ticker">'+s.ticker+'</div><div class="s-name">'+s.name+'</div></div></div>'+
      '<div class="s-note-col s-note">'+s.note+'</div>'+
      '<div class="s-price '+dirClass+'">'+s.price+'</div>'+
      '<div class="s-change '+dirClass+'">'+dirIcon+' '+s.change+'</div>'+
      '<div><span class="s-tag tag-'+(s.tag||'ai')+'">'+(s.tag_label||s.tag)+'</span></div>'+
      '<div class="s-arrow-col expand-arrow">›</div>'+
      '<div class="stock-expand" style="grid-column:1/-1;">'+
        '<div class="stock-expand-inner">'+
          '<div><div class="se-label">觀察重點</div><div class="se-value">'+(s.watch_note||'—')+'</div></div>'+
          '<div><div class="se-label">技術面 / 籌碼</div><div class="se-value">'+(s.tech_note||'—')+'</div></div>'+
          (s.action?'<div style="grid-column:1/-1;margin-top:8px;padding:8px 12px;background:var(--amber-100);border-radius:8px;border-left:2px solid var(--amber-600);"><div class="se-label" style="color:var(--amber-700);margin-bottom:3px;">操作建議</div><div class="se-value" style="color:var(--amber-700);font-weight:600;">'+s.action+'</div></div>':'')+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}
function renderNews(containerId,newsItems){
  var container=document.getElementById(containerId);
  if(!container||!newsItems) return;
  container.innerHTML='<div class="news-strip">'+
    newsItems.map(function(n){
      return '<div class="news-strip-item"><div class="news-dot"></div><div class="news-strip-text">'+n.text+'</div><div class="news-strip-time">'+n.time+'</div></div>';
    }).join('')+'</div>';
}
function renderRotation(containerId,rotation){
  var container=document.getElementById(containerId);
  if(!container||!rotation) return;
  container.innerHTML=rotation.map(function(r){
    return '<div class="rotation-item">'+
      '<div class="rotation-row"><span class="rotation-from">'+r.from+'</span><span class="rotation-arrow">→</span><span class="rotation-to">'+r.to+'</span><span class="rotation-strength">'+r.strength+'</span></div>'+
      '<div class="rotation-reason">'+r.reason+'</div></div>';
  }).join('');
}
function renderIndexCard(label,value,change,dir,sub){
  var dirClass=dir==='up'?'up':dir==='down'?'down':'flat';
  var dirIcon=dir==='up'?'▲':dir==='down'?'▼':'—';
  return '<div class="index-card '+dirClass+'">'+
    '<div class="ic-label">'+label+'</div>'+
    '<div class="ic-value">'+value+'</div>'+
    '<div class="ic-change '+dirClass+'">'+dirIcon+' '+change+'</div>'+
    '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">'+sub+'</div></div></div>'+
  '</div>';
}
async function loadData(){
  var res=await fetch('../data/daily.json');
  var data=await res.json();
  var d=new Date(data.date);
  document.getElementById('market-date').innerHTML=
    d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'<br>UTC+8 台北時間';
  var spx=data.tickers?data.tickers.find(function(t){return t.label==='S&P 500';}):null;
  var ndx=data.tickers?data.tickers.find(function(t){return t.label==='NASDAQ';}):null;
  var brent=data.tickers?data.tickers.find(function(t){return t.label==='Brent 原油';}):null;
  var fg=data.sentiment&&data.sentiment.fear_greed?data.sentiment.fear_greed:null;
  var cg=data.sentiment&&data.sentiment.coinglass?data.sentiment.coinglass:null;
  var spxVal=spx&&spx.value!=='--'?spx.value:'--';
  var spxChange=spx&&spx.change!=='--'?spx.change:'--';
  var spxDir=spx?spx.dir:'flat';
  var ndxVal=ndx&&ndx.value!=='--'?ndx.value:'--';
  var ndxChange=ndx&&ndx.change!=='--'?ndx.change:'--';
  var ndxDir=ndx?ndx.dir:'flat';
  document.getElementById('us-index-grid').innerHTML=
    renderIndexCard('S&P 500',spxVal,spxChange,spxDir,'Polygon / SPY')+
    renderIndexCard('NASDAQ',ndxVal,ndxChange,ndxDir,'Polygon / QQQ')+
    '<div class="index-card '+(fg?(parseInt(fg.value)>=50?'up':'down'):'flat')+'">'+
      '<div class="ic-label">市場情緒</div>'+
      '<div class="ic-value" style="font-size:32px;color:'+(fg?(parseInt(fg.value)>=50?'var(--green-600)':parseInt(fg.value)>=30?'var(--amber-600)':'var(--red-600)'):'var(--gray-400)')+';">'+(fg?fg.value:'--')+'</div>'+
      '<div class="ic-change '+(fg?(parseInt(fg.value)>=50?'up':'down'):'flat')+'">'+(fg?fg.label:'Fear & Greed')+'</div>'+
      '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">較昨日</div><div class="ic-stat-value">'+(fg?(fg.change||'--'):'--')+'</div></div></div>'+
    '</div>';
  var brentDisplay=brent?brent.value:'--';
  var brentChange=brent?brent.change:'--';
  document.getElementById('us-sentiment-bar').innerHTML=
    '<div class="sent-item"><div class="sent-label">Fear & Greed</div><div class="sent-value" style="color:var(--amber-600);">'+(fg?fg.value:'--')+'</div><div class="sent-sub">'+(fg?fg.label:'--')+'</div></div>'+
    '<div class="sent-item"><div class="sent-label">NASDAQ 漲跌</div><div class="sent-value '+ndxDir+'" style="font-size:15px;">'+(ndxChange!=='--'?(ndxDir==='up'?'▲ ':ndxDir==='down'?'▼ ':'— ')+ndxChange:'--')+'</div><div class="sent-sub">今日表現</div></div>'+
    '<div class="sent-item"><div class="sent-label">Brent 原油</div><div class="sent-value" style="color:var(--amber-600);font-size:16px;">'+brentDisplay+'</div><div class="sent-sub">'+brentChange+'</div></div>';
  if(data.market&&data.market.us_stocks) renderStocks('us-stocks-list',data.market.us_stocks);
  if(data.market&&data.market.us_news) renderNews('us-news-list',data.market.us_news);
  if(data.industry_detail&&data.industry_detail.rotation) renderRotation('us-rotation',data.industry_detail.rotation);
  var twIdx=data.tickers?data.tickers.find(function(t){return t.label==='台股加權';}):null;
  var twSummary=data.tw_market_summary||{};
  var tradeVal=twSummary.trade_value||'--';
  var foreignNet=twSummary.foreign_net||'--';
  var foreignDir=foreignNet.indexOf('買超')>=0?'up':foreignNet.indexOf('賣超')>=0?'down':'flat';
  var foreignColor=foreignDir==='up'?'var(--green-600)':foreignDir==='down'?'var(--red-600)':'var(--gray-400)';
  document.getElementById('tw-index-grid').innerHTML=
    renderIndexCard('台股加權指數',twIdx?twIdx.value:'--',twIdx?twIdx.change:'--',twIdx?twIdx.dir:'flat','TAIEX')+
    '<div class="index-card flat">'+
      '<div class="ic-label">今日成交量</div>'+
      '<div class="ic-value" style="font-size:'+(tradeVal==='--'?'26px':'18px')+';">'+tradeVal+'</div>'+
      '<div class="ic-change flat">台股總成交</div>'+
      '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">TWSE</div></div></div>'+
    '</div>'+
    '<div class="index-card '+foreignDir+'">'+
      '<div class="ic-label">外資動向</div>'+
      '<div class="ic-value" style="font-size:'+(foreignNet==='--'?'26px':'16px')+';color:'+foreignColor+';">'+foreignNet+'</div>'+
      '<div class="ic-change flat">三大法人</div>'+
      '<div class="ic-stats"><div class="ic-stat"><div class="ic-stat-label">來源</div><div class="ic-stat-value">TWSE BFI82U</div></div></div>'+
    '</div>';
  document.getElementById('tw-sentiment-bar').innerHTML=
    '<div class="sent-item"><div class="sent-label">加權指數</div><div class="sent-value '+(twIdx?twIdx.dir:'flat')+'" style="font-size:14px;">'+(twIdx?(twIdx.dir==='up'?'▲ ':twIdx.dir==='down'?'▼ ':'— ')+twIdx.change:'--')+'</div><div class="sent-sub">'+(twIdx?twIdx.value:'--')+'</div></div>'+
    '<div class="sent-item"><div class="sent-label">今日成交量</div><div class="sent-value" style="font-size:13px;color:var(--navy-500);">'+tradeVal+'</div><div class="sent-sub">TWSE</div></div>'+
    '<div class="sent-item"><div class="sent-label">外資買賣超</div><div class="sent-value" style="font-size:12px;color:'+foreignColor+';">'+foreignNet+'</div><div class="sent-sub">三大法人</div></div>';
  if(data.market&&data.market.tw_stocks) renderStocks('tw-stocks-list',data.market.tw_stocks);
  if(data.market&&data.market.tw_news) renderNews('tw-news-list',data.market.tw_news);
  if(data.industry_detail&&data.industry_detail.rotation) renderRotation('tw-rotation',data.industry_detail.rotation);
  document.getElementById('crypto-sentiment-bar').innerHTML=
    '<div class="sent-item"><div class="sent-label">Fear & Greed</div><div class="sent-value" style="color:var(--amber-600);">'+(fg?fg.value:'--')+'</div><div class="sent-sub">'+(fg?fg.label:'--')+'</div></div>'+
    '<div class="sent-item"><div class="sent-label">BTC 多空比</div><div class="sent-value" style="color:var(--navy-500);font-size:12px;line-height:1.3;">'+(cg&&cg.long_short_ratio?cg.long_short_ratio:'未取得')+'</div><div class="sent-sub">CoinGlass</div></div>'+
    '<div class="sent-item"><div class="sent-label">BTC 資金費率</div><div class="sent-value" style="font-size:13px;color:var(--green-600);">'+(cg&&cg.funding_rate?cg.funding_rate:'未取得')+'</div><div class="sent-sub">永續合約</div></div>'+
    '<div class="sent-item"><div class="sent-label">BTC 多單清算</div><div class="sent-value" style="font-size:13px;color:var(--red-600);">'+(cg?(cg.btc_long_liq||'--'):'--')+'</div><div class="sent-sub">空單 '+(cg?(cg.btc_short_liq||'--'):'--')+'</div></div>';
  var btc=data.market&&data.market.crypto?data.market.crypto.find(function(c){return c.symbol==='BTC';}):null;
  var eth=data.market&&data.market.crypto?data.market.crypto.find(function(c){return c.symbol==='ETH';}):null;
  document.getElementById('crypto-overview').innerHTML=
    '<div class="co-item"><div class="co-label">BTC 市值</div><div class="co-value">'+(btc?btc.market_cap:'--')+'</div><div class="co-sub">Bitcoin</div></div>'+
    '<div class="co-item"><div class="co-label">BTC 24H 交易量</div><div class="co-value">'+(btc?btc.volume:'--')+'</div><div class="co-sub">全球成交量</div></div>'+
    '<div class="co-item"><div class="co-label">ETH 市值</div><div class="co-value">'+(eth?eth.market_cap:'--')+'</div><div class="co-sub">Ethereum</div></div>';
  if(data.market&&data.market.crypto){
    document.getElementById('crypto-grid').innerHTML=data.market.crypto.map(function(c){
      var dirClass=c.dir==='up'?'up':c.dir==='down'?'down':'flat';
      var dirIcon=c.dir==='up'?'▲':c.dir==='down'?'▼':'—';
      return '<div class="crypto-card '+dirClass+'" onclick="toggleCrypto(this)">'+
        '<div class="cc-header"><div><div class="cc-symbol">'+c.symbol+'</div><div class="cc-name">'+c.name+'</div></div><span class="cc-signal '+(c.signal||'watch')+'">'+(c.signal_label||'觀察')+'</span></div>'+
        '<div class="cc-price '+dirClass+'">'+c.price+'</div>'+
        '<div class="cc-change '+dirClass+'">'+dirIcon+' '+c.change+'</div>'+
        '<div class="cc-stats">'+
          '<div><div class="cc-stat-label">市值</div><div class="cc-stat-value">'+(c.market_cap||'--')+'</div></div>'+
          '<div><div class="cc-stat-label">成交量</div><div class="cc-stat-value">'+(c.volume||'--')+'</div></div>'+
        '</div>'+
        '<div class="cc-expand"><div class="cc-divider"></div>'+
          '<div class="cc-expand-grid">'+
            '<div><div class="cc-expand-label">支撐位</div><div class="cc-expand-value">'+(c.support||'—')+'</div></div>'+
            '<div><div class="cc-expand-label">壓力位</div><div class="cc-expand-value">'+(c.resistance||'—')+'</div></div>'+
            '<div><div class="cc-expand-label">技術面</div><div class="cc-expand-value">'+(c.tech_note||'—')+'</div></div>'+
            '<div><div class="cc-expand-label">觀察重點</div><div class="cc-expand-value">'+(c.watch_note||'—')+'</div></div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  if(data.market&&data.market.crypto_news) renderNews('crypto-news-list',data.market.crypto_news);
  document.getElementById('crypto-liquidation').innerHTML=
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">'+
      '<div style="background:var(--green-100);border:1px solid #bbf7d0;border-radius:8px;padding:11px;">'+
        '<div style="font-size:10px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;">BTC 多單清算</div>'+
        '<div style="font-size:16px;font-weight:700;color:var(--green-600);">'+(cg?(cg.btc_long_liq||'--'):'--')+'</div>'+
      '</div>'+
      '<div style="background:var(--red-100);border:1px solid #fecaca;border-radius:8px;padding:11px;">'+
        '<div style="font-size:10px;color:var(--red-700);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;">BTC 空單清算</div>'+
        '<div style="font-size:16px;font-weight:700;color:var(--red-600);">'+(cg?(cg.btc_short_liq||'--'):'--')+'</div>'+
      '</div>'+
      '<div style="background:var(--green-100);border:1px solid #bbf7d0;border-radius:8px;padding:11px;">'+
        '<div style="font-size:10px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;">ETH 多單清算</div>'+
        '<div style="font-size:16px;font-weight:700;color:var(--green-600);">'+(cg?(cg.eth_long_liq||'--'):'--')+'</div>'+
      '</div>'+
      '<div style="background:var(--red-100);border:1px solid #fecaca;border-radius:8px;padding:11px;">'+
        '<div style="font-size:10px;color:var(--red-700);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;">ETH 空單清算</div>'+
        '<div style="font-size:16px;font-weight:700;color:var(--red-600);">'+(cg?(cg.eth_short_liq||'--'):'--')+'</div>'+
      '</div>'+
    '</div>'+
    '<div style="font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:600;">資金費率</div>'+
    '<div style="font-size:14px;color:var(--green-600);font-weight:600;margin-bottom:10px;">'+(cg?(cg.funding_rate||'未取得'):'未取得')+'</div>'+
    '<div style="font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:600;">多空比</div>'+
    '<div style="font-size:12.5px;color:var(--gray-600);margin-bottom:10px;">'+(cg?(cg.long_short_ratio||'未取得'):'未取得')+'</div>'+
    (cg&&cg.note?'<div style="font-size:11.5px;color:var(--gray-400);padding-top:8px;border-top:1px solid var(--gray-100);font-family:var(--font-zh);">'+cg.note+'</div>':'');
}
loadData();
</script>
