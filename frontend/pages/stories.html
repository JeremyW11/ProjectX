<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela · 全球事件追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy-950:#070d1c; --navy-900:#0d1630; --navy-800:#152244;
  --navy-700:#1d2d5a; --navy-600:#1e3a8a; --navy-500:#2563eb;
  --navy-400:#3b82f6; --navy-300:#93c5fd; --navy-100:#dbeafe; --navy-50:#eff6ff;
  --gray-900:#0f172a; --gray-700:#334155; --gray-600:#475569;
  --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc; --white:#ffffff;
  --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7; --green-50:#f0fdf4;
  --red-700:#b91c1c; --red-600:#dc2626; --red-100:#fee2e2;
  --amber-600:#d97706; --amber-100:#fef3c7;
  --pro-gold:#c9a84c; --pro-gold-light:#f5e9c8; --pro-gold-dark:#8a6a1f;
  --font-en:'DM Sans',sans-serif;
  --font-zh:'Noto Sans TC',sans-serif;
  --font-display:'DM Serif Display',Georgia,serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{background:radial-gradient(1120px 640px at 94% -14%, rgba(37,99,235,.46), transparent 64%),radial-gradient(940px 720px at -10% 4%, rgba(51,65,85,.40), transparent 64%),radial-gradient(820px 620px at 50% 118%, rgba(29,78,216,.28), transparent 66%),linear-gradient(160deg, #dbe2ef 0%, #f4f6fb 56%);background-attachment:fixed;color:var(--gray-900);font-family:var(--font-zh);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:10px;margin-right:36px;}
.header-nav{display:flex;align-items:center;gap:2px;flex:1;}
.nav-item{font-size:13.5px;color:var(--gray-600);padding:6px 12px;border-radius:var(--r-sm);font-weight:500;display:flex;align-items:center;gap:6px;transition:all .15s;}
.nav-item:hover{background:var(--gray-100);color:var(--navy-700);}
.nav-item.active{background:var(--navy-50);color:var(--navy-700);font-weight:600;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--navy-500);}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green-100);color:var(--green-600);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:var(--font-en);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green-600);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.header-time{font-size:12px;color:var(--gray-400);font-family:var(--font-en);}
.btn-login{padding:7px 16px;background:var(--navy-700);color:var(--white);border-radius:var(--r-sm);font-size:13px;font-weight:500;font-family:var(--font-en);}

.page{max-width:920px;margin:0 auto;padding:88px 24px 64px;}
.page-header{margin-bottom:24px;}
.page-title{font-size:26px;font-weight:600;color:var(--navy-900);font-family:var(--font-zh);}
.page-title-sub{font-size:14px;color:var(--gray-400);font-family:var(--font-en);font-weight:400;margin-left:8px;}
.page-update{font-size:12.5px;color:var(--gray-500);margin-top:4px;}

/* PRO GATE */
.pro-gate{background:linear-gradient(135deg,var(--navy-900),var(--navy-800));border-radius:var(--r-xl);padding:48px 40px;text-align:center;color:var(--white);margin-bottom:20px;}
.pro-gate-icon{font-size:36px;color:var(--pro-gold);margin-bottom:12px;}
.pro-gate-title{font-size:24px;font-weight:600;margin-bottom:10px;}
.pro-gate-title em{color:var(--pro-gold);font-style:normal;}
.pro-gate-desc{font-size:14px;color:rgba(255,255,255,.7);max-width:520px;margin:0 auto 24px;line-height:1.7;}
.btn-pro-upgrade{display:inline-block;padding:12px 28px;background:var(--pro-gold);color:var(--navy-900);border-radius:var(--r-md);font-size:14px;font-weight:700;}

/* STORY CARDS */
.stories-view{display:none;}
.stories-view.active{display:block;}
.story-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-card);}
.sc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.sc-title{font-size:17px;font-weight:600;color:var(--navy-900);flex:1;min-width:180px;}
.sc-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;font-family:var(--font-en);}
.sc-cat{font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;background:var(--gray-100);color:var(--gray-600);}
.sc-summary{font-size:13.5px;color:var(--gray-700);line-height:1.65;margin-bottom:10px;}
.sc-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--gray-500);margin-bottom:12px;}
.sc-meta b{color:var(--gray-700);font-weight:600;}
.sc-assets span{display:inline-block;background:var(--navy-50);color:var(--navy-700);font-size:11px;padding:2px 8px;border-radius:5px;margin:0 4px 4px 0;font-family:var(--font-en);}
.timeline{border-left:2px solid var(--gray-200);padding-left:16px;margin-left:4px;}
.tl-item{position:relative;padding-bottom:12px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-21px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--navy-400);border:2px solid var(--white);}
.tl-date{font-size:11px;color:var(--gray-400);font-family:var(--font-en);font-weight:600;}
.tl-text{font-size:13px;color:var(--gray-700);margin-top:2px;line-height:1.55;}
.tl-src{font-size:11px;color:var(--navy-500);margin-left:6px;font-weight:600;}
.sc-dir{font-weight:700;}
.empty-box{background:var(--white);border:1px dashed var(--gray-300);border-radius:var(--r-lg);padding:48px 24px;text-align:center;color:var(--gray-400);font-size:14px;}
.story-pred{margin-top:14px;border-top:1px solid var(--gray-200);padding-top:12px;}
.story-pred-header{font-size:10px;font-weight:700;color:var(--navy-600);font-family:var(--font-en);letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.story-pred-meta{color:var(--gray-400);font-weight:400;}
.story-pred-text{font-size:13.5px;color:var(--gray-800);line-height:1.6;margin-bottom:7px;}
.story-pred-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;}
.story-pred-trigger{color:var(--gray-500);font-size:11.5px;}
.story-pred-assets{font-size:11.5px;color:var(--navy-700);margin-top:5px;background:var(--navy-50);border-radius:5px;padding:3px 8px;display:inline-block;}
@media(max-width:768px){.header-nav{display:none;}}
</style>
  <script src="/js/icons.js"></script>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a href="https://projectxbrief.netlify.app/" class="logo-link" style="text-decoration:none;"><div class="topbar-logo">
    <svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(6,5) scale(0.62)">
        <path d="M 9 13 L 24 44 L 31.5 28.5" fill="none" stroke="#0B1F4D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="33" y="17" width="7" height="7" rx="1.2" fill="#147EFF"/>
        <rect x="36" y="11.5" width="6" height="6" rx="1" fill="#39D5FF"/>
        <rect x="39" y="6.5" width="5" height="5" rx="0.9" fill="#39D5FF"/>
      </g>
      <text x="42" y="27" font-family="'Poppins','DM Sans',-apple-system,system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="-1" fill="#0B1F4D">vela</text>
    </svg>
  </div></a>
  <nav class="header-nav" data-active="stories"></nav>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    <span class="header-time" id="clock">—</span>
    <a href="/pages/login.html" class="btn-login" id="auth-btn">登入</a>
  </div>
</header>

<script src="/shared/nav.js"></script>
<script src="/shared/footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/header-user.js"></script>

<main class="page">

  <div class="page-header">
    <div>
      <h1 class="page-title">全球事件追蹤 <span class="page-title-sub">Global Story Tracker</span></h1>
      <div class="page-update">把同一條國際大事串成跨日時間軸 · Pro 會員專屬 · 台北時間基準</div>
    </div>
  </div>

  <!-- PRO GATE -->
  <div id="pro-gate-view">
    <div class="pro-gate">
      <div class="pro-gate-icon">✦</div>
      <h2 class="pro-gate-title">追蹤<em>全球大事</em>的完整脈絡</h2>
      <p class="pro-gate-desc">地緣衝突、貿易政策、央行路徑、AI 與半導體供應鏈——每條重大事件串成連續時間軸，每天更新進展、方向與受影響標的。OrionAI 每日針對進行中的事件生成市場預判，14 日後自動驗收，結果計入歷史績效。</p>
      <div class="pro-gate-btns">
        <a href="/pages/login.html" class="btn-pro-upgrade">✦ 登入體驗 Pro</a>
      </div>
    </div>
  </div>

  <!-- LOGGED-IN VIEW -->
  <div id="stories-view" class="stories-view">
    <div id="stories-list"></div>
  </div>

</main>

<script>
// Clock
function tick(){
  var t=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  var el=document.getElementById('clock'); if(el) el.textContent=t+' CST';
}
tick(); setInterval(tick,1000);

// ── Supabase Auth ──
var SUPABASE_URL='https://eezhmeccakaeiprviqra.supabase.co';
var SUPABASE_KEY='sb_publishable_qb__g5BMRYLiV2Bin6b1Bw_LwmVARqM';
var _supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function initAuth(){
  _supabase.auth.onAuthStateChange(function(event,session){
    if(event==='INITIAL_SESSION'||event==='SIGNED_IN'||event==='TOKEN_REFRESHED'){
      setAuthState(session?session.user:null);
    } else if(event==='SIGNED_OUT'){
      setAuthState(null);
    }
  });
}

function setAuthState(user){
  var gateEl=document.getElementById('pro-gate-view');
  var viewEl=document.getElementById('stories-view');
  var btnEl=document.getElementById('auth-btn');
  if(user){
    if(btnEl){ btnEl.textContent='登出'; btnEl.href='#'; btnEl.onclick=function(e){e.preventDefault();signOutUser();}; }
    checkProStatus(user, gateEl, viewEl);
  } else {
    if(gateEl) gateEl.style.display='block';
    if(viewEl) viewEl.classList.remove('active');
    if(btnEl){ btnEl.textContent='登入'; btnEl.href='/pages/login.html'; btnEl.onclick=null; }
  }
}

async function checkProStatus(user, gateEl, viewEl){
  var isPro = user.email === 'jermy831102@gmail.com';
  if(!isPro){
    var result = await _supabase.from('profiles').select('is_pro').eq('id', user.id).single();
    isPro = result.data && result.data.is_pro === true;
  }
  if(isPro){
    if(gateEl) gateEl.style.display='none';
    if(viewEl) viewEl.classList.add('active');
    loadStories();
  } else {
    if(gateEl) gateEl.style.display='block';
    if(viewEl) viewEl.classList.remove('active');
  }
}

async function signOutUser(){
  await _supabase.auth.signOut();
  window.location.reload();
}

// ── Render tracked stories ──
var STATUS_STYLE={
  '進行中':{bg:'var(--navy-50)',c:'var(--navy-600)'},
  '升溫':{bg:'var(--red-100)',c:'var(--red-600)'},
  '緩和':{bg:'var(--green-100)',c:'var(--green-700)'},
  '落幕':{bg:'var(--gray-100)',c:'var(--gray-500)'}
};
var DIR_STYLE={'看多':'var(--green-600)','看空':'var(--red-600)','中性':'var(--amber-600)'};
var SENT_COLOR={'利多':'var(--green-600)','利空':'var(--red-600)','中性':'var(--gray-500)'};

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

async function loadStories(){
  var listEl=document.getElementById('stories-list');
  if(!listEl) return;
  var stories=[], storyPreds={};
  try{
    var v=Math.floor(Date.now()/300000);
    var [accRes,dailyRes]=await Promise.all([fetch('/data/accumulated.json?v='+v),fetch('/data/daily.json?v='+v)]);
    var acc=await accRes.json();
    stories=Array.isArray(acc.tracked_stories)?acc.tracked_stories:[];
    try{var daily=await dailyRes.json();(daily.story_predictions||[]).forEach(function(p){if(p.story_id)storyPreds[p.story_id]=p;});}catch(e2){}
  }catch(e){ stories=[]; if(window.PX_showDataError)window.PX_showDataError('⚠ 追蹤資料載入失敗，請稍後重新整理。'); }

  // 進行中優先，落幕殿後；各自依最新更新排序
  stories.sort(function(a,b){
    var ended=function(s){return s.status==='落幕'?1:0;};
    if(ended(a)!==ended(b)) return ended(a)-ended(b);
    return (b.last_update||'').localeCompare(a.last_update||'');
  });

  if(!stories.length){
    listEl.innerHTML='<div class="empty-box">尚無追蹤中的全球事件。下次早報生成後，重大國際大事會在這裡串成時間軸。</div>';
    return;
  }

  listEl.innerHTML=stories.map(function(s){
    var st=STATUS_STYLE[s.status]||STATUS_STYLE['進行中'];
    var dirColor=DIR_STYLE[s.direction]||'var(--gray-500)';
    var assets=(s.affect_assets||'').split(/[,，、\s]+/).filter(Boolean);
    var tl=(Array.isArray(s.timeline)?s.timeline:[]).slice().reverse();
    var tlHTML=tl.map(function(t){
      var sc=SENT_COLOR[t.sentiment]||'var(--gray-500)';
      var src=t.source_url?' <a class="tl-src" href="'+esc(t.source_url)+'" target="_blank" rel="noopener">'+ICO.link+' 原文</a>':'';
      return '<div class="tl-item">'+
        '<div class="tl-date">'+esc(t.date)+' · <span style="color:'+sc+';">'+esc(t.sentiment||'')+'</span></div>'+
        '<div class="tl-text">'+esc(t.update)+src+'</div>'+
      '</div>';
    }).join('');
    // ── AI 預判區塊（今日 story_predictions 匹配）──
    var pred=storyPreds[s.id]||null;
    var predHTML='';
    if(pred&&s.status!=='落幕'){
      var PDCOL={positive:'var(--green-600)',negative:'var(--red-600)',neutral:'var(--amber-600)'};
      var PDLBL={positive:'利多',negative:'利空',neutral:'中性'};
      var PCBG={HIGH:'var(--green-100)',MED:'var(--amber-100)',LOW:'var(--gray-100)'};
      var PCCOL={HIGH:'var(--green-700)',MED:'var(--amber-700)',LOW:'var(--gray-600)'};
      predHTML='<div class="story-pred">'+
        '<div class="story-pred-header">✦ AI 預判 <span class="story-pred-meta">｜'+esc(pred.timeframe||'')+'</span></div>'+
        '<div class="story-pred-text">'+esc(pred.prediction||'')+'</div>'+
        '<div class="story-pred-foot">'+
          '<span style="color:'+(PDCOL[pred.direction]||'var(--gray-500)')+';">'+(PDLBL[pred.direction]||pred.direction||'')+'</span>'+
          '<span style="background:'+(PCBG[pred.confidence]||'var(--gray-100)')+';color:'+(PCCOL[pred.confidence]||'var(--gray-600)')+';border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;font-family:var(--font-en);">'+esc(pred.confidence||'')+'</span>'+
          (pred.next_trigger?'<span class="story-pred-trigger">觀察：'+esc(pred.next_trigger)+'</span>':'')+
        '</div>'+
        (pred.affect_assets?'<div class="story-pred-assets">影響：'+esc(pred.affect_assets)+'</div>':'')+
      '</div>';
    }
    return '<div class="story-card">'+
      '<div class="sc-head">'+
        '<span class="sc-title">'+esc(s.title)+'</span>'+
        '<span class="sc-cat">'+esc(s.category||'')+'</span>'+
        '<span class="sc-badge" style="background:'+st.bg+';color:'+st.c+';">'+esc(s.status||'')+'</span>'+
      '</div>'+
      (s.summary?'<div class="sc-summary">'+esc(s.summary)+'</div>':'')+
      '<div class="sc-meta">'+
        '<span>方向：<span class="sc-dir" style="color:'+dirColor+';">'+esc(s.direction||'—')+'</span></span>'+
        '<span>起始：<b>'+esc(s.started||'—')+'</b></span>'+
        '<span>最近更新：<b>'+esc(s.last_update||'—')+'</b></span>'+
      '</div>'+
      (assets.length?'<div class="sc-assets" style="margin-bottom:12px;"><span style="background:none;color:var(--gray-400);padding-left:0;">受影響標的：</span>'+assets.map(function(a){return '<span>'+esc(a)+'</span>';}).join('')+'</div>':'')+
      (tlHTML?'<div class="timeline">'+tlHTML+'</div>':'')+
      predHTML+
    '</div>';
  }).join('');
}

initAuth();
</script>
</body>
</html>
