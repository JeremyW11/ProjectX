[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://projectx-backend-o2pl.onrender.com https://cdn.jsdelivr.net https://api.anthropic.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://api.binance.com https://query1.finance.yahoo.com https://query2.finance.yahoo.com; img-src 'self' data: https:;"

# HTML pages — always revalidate (never stale)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Data JSON — 5-minute CDN cache; Netlify auto-purges on each deploy
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

[[headers]]
  for = "/data/columns/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

[[headers]]
  for = "/data/columns/**/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

# Static assets — long cache (JS/CSS don't have content hashes, use 1-day)
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/shared/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"
